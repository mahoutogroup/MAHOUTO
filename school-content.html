<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Contenu de formation — MAHOUTO+</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../theme.css">
<script src="../theme-toggle.js"></script>
<style>
  header { padding: 20px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
  header a.back { font-size: 12.5px; color: var(--text-muted); text-decoration: none; }
  header h1 { font-size: 19px; color: var(--gold); margin-top: 6px; }
  header p { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }

  #access-denied, #loading-state {
    text-align: center; color: var(--text-dim); padding: 60px 24px; font-size: 14px;
  }

  .section { padding: 16px 20px; }

  .module-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; margin-bottom: 14px;
  }
  .module-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .module-head h3 { font-size: 15px; }
  .module-head .ordre { font-size: 11px; color: var(--text-dim); }

  .lesson-row {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
    margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px;
  }
  .lesson-row .top-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lesson-row .titre { font-size: 13.5px; font-weight: 600; }
  .lesson-row .status { font-size: 11px; }
  .lesson-row .status.ok { color: var(--accent-green); }
  .lesson-row .status.none { color: #F87171; }
  .lesson-row .preview-tag { font-size: 10px; color: var(--gold); font-weight: 700; }

  .quiz-admin-panel {
    border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 8px;
  }
  .quiz-question-admin-row {
    background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px;
  }
  .quiz-question-admin-row .qq-text { font-size: 12.5px; margin-bottom: 4px; }
  .quiz-question-admin-row .qq-choices { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .nq-choice-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .nq-choice-row input[type="text"] { flex: 1; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm {
    font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer;
  }
  .btn-sm.primary { background: var(--gold-bright); color: #0A0A0A; border: none; }
  .btn-sm.danger { color: #F87171; }
  .btn-sm:disabled { opacity: .5; cursor: wait; }

  form.inline-form {
    display: flex; flex-direction: column; gap: 8px; margin-top: 10px;
    padding-top: 10px; border-top: 1px dashed var(--border);
  }
  form.inline-form input, form.inline-form select {
    padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--white); font-size: 13px;
  }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }

  .add-module-form {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; margin-bottom: 18px;
  }

  .msg { font-size: 12px; margin-top: 6px; }
  .msg.error { color: #F87171; }
  .msg.ok { color: var(--accent-green); }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div class="page-content">

  <header>
    <a class="back" href="formations.html">← Retour aux formations</a>
    <h1>🎬 Contenu de la formation</h1>
    <p id="formation-title">Chargement...</p>
  </header>

  <div id="loading-state">Vérification des droits...</div>
  <div id="access-denied" class="hidden">🔒 Connecte-toi avec un compte administrateur pour accéder à cette page.</div>

  <div id="container" class="hidden">
    <div class="section">
      <div class="add-module-form">
        <h3 style="font-size:14px;margin-bottom:8px;">➕ Ajouter un module</h3>
        <form id="new-module-form" class="inline-form" style="border-top:none;padding-top:0;margin-top:0;">
          <input type="text" id="nm-titre" placeholder="Ex : Module 1 — Les bases" required>
          <input type="number" id="nm-ordre" placeholder="Ordre (0, 1, 2...)" value="0" min="0">
          <button type="submit" class="btn-sm primary">Créer le module</button>
        </form>
        <div id="new-module-msg" class="msg"></div>
      </div>

      <div id="modules-list"></div>
    </div>
  </div>

</div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const cfg = window.MAHOUTO_CONFIG;
  const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const formationId = params.get("formation");

  const loadingEl = document.getElementById("loading-state");
  const deniedEl = document.getElementById("access-denied");
  const containerEl = document.getElementById("container");
  const modulesListEl = document.getElementById("modules-list");
  const formationTitleEl = document.getElementById("formation-title");

  let currentSession = null;

  if (!formationId) {
    loadingEl.textContent = "Aucune formation sélectionnée. Ouvrez cette page depuis une formation.";
  }

  async function getAccessToken() {
    const { data } = await supabase.auth.getSession();
    return data && data.session ? data.session.access_token : null;
  }

  // Toutes les actions serveur (upload sign) passent par ce point
  // d'entrée unique — voir /api/course.js.
  async function callCourseApi(action, payload) {
    const token = await getAccessToken();
    const resp = await fetch("/api/course", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ action, ...payload })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Erreur serveur.");
    return data;
  }

  async function loadFormationTitle() {
    const { data } = await supabase.from("formations").select("nom").eq("id", formationId).maybeSingle();
    formationTitleEl.textContent = data ? data.nom : formationId;
  }

  async function loadModules() {
    const { data: modules, error } = await supabase
      .from("formation_modules")
      .select("*")
      .eq("formation_id", formationId)
      .order("ordre", { ascending: true });

    if (error) {
      modulesListEl.innerHTML = `<div class="msg error">Erreur de chargement : ${error.message}</div>`;
      return;
    }

    modulesListEl.innerHTML = "";
    for (const mod of (modules || [])) {
      const card = document.createElement("div");
      card.className = "module-card";
      card.innerHTML = `
        <div class="module-head">
          <h3>${mod.titre}</h3>
          <span class="ordre">ordre ${mod.ordre}</span>
        </div>
        <div class="lessons-container" data-module-id="${mod.id}"></div>
        <form class="inline-form new-lesson-form" data-module-id="${mod.id}">
          <input type="text" class="nl-titre" placeholder="Titre de la leçon" required>
          <input type="number" class="nl-ordre" placeholder="Ordre" value="0" min="0">
          <select class="nl-type">
            <option value="video">🎬 Vidéo</option>
            <option value="quiz">📝 Quiz</option>
          </select>
          <label class="chk"><input type="checkbox" class="nl-preview"> Leçon gratuite (aperçu, sans achat)</label>
          <button type="submit" class="btn-sm primary">➕ Ajouter la leçon</button>
        </form>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn-sm danger delete-module-btn" data-id="${mod.id}">🗑️ Supprimer ce module</button>
        </div>
        <div class="msg module-msg"></div>
      `;
      modulesListEl.appendChild(card);
      await loadLessons(mod.id, card.querySelector(".lessons-container"));
    }

    modulesListEl.querySelectorAll(".new-lesson-form").forEach((form) => {
      form.addEventListener("submit", onCreateLesson);
    });
    modulesListEl.querySelectorAll(".delete-module-btn").forEach((btn) => {
      btn.addEventListener("click", onDeleteModule);
    });
  }

  async function loadLessons(moduleId, containerEl2) {
    const { data: lessons, error } = await supabase
      .from("formation_lessons")
      .select("*")
      .eq("module_id", moduleId)
      .order("ordre", { ascending: true });

    if (error) {
      containerEl2.innerHTML = `<div class="msg error">${error.message}</div>`;
      return;
    }

    containerEl2.innerHTML = "";
    for (const lesson of (lessons || [])) {
      const row = document.createElement("div");
      row.className = "lesson-row";

      if (lesson.type === "quiz") {
        const { count } = await supabase
          .from("quiz_questions")
          .select("id", { count: "exact", head: true })
          .eq("lesson_id", lesson.id);

        row.innerHTML = `
          <div class="top-line">
            <span class="titre">📝 ${lesson.titre}</span>
            ${lesson.is_preview ? '<span class="preview-tag">APERÇU GRATUIT</span>' : ""}
          </div>
          <div class="status ${count ? "ok" : "none"}">
            ${count ? "✅ " + count + " question(s)" : "⚠️ Aucune question pour l'instant"}
          </div>
          <div class="btn-row">
            <button class="btn-sm toggle-quiz-btn" data-id="${lesson.id}">📝 Gérer les questions</button>
            <button class="btn-sm danger delete-lesson-btn" data-id="${lesson.id}">🗑️ Supprimer la leçon</button>
          </div>
          <div class="quiz-admin-panel hidden" data-lesson-id="${lesson.id}"></div>
          <div class="msg lesson-msg" data-lesson-id="${lesson.id}"></div>
        `;
        containerEl2.appendChild(row);
        continue;
      }

      const { data: media } = await supabase
        .from("formation_lesson_media")
        .select("video_public_id, duree_secondes")
        .eq("lesson_id", lesson.id)
        .maybeSingle();

      const hasVideo = !!(media && media.video_public_id);

      row.innerHTML = `
        <div class="top-line">
          <span class="titre">${lesson.titre}</span>
          ${lesson.is_preview ? '<span class="preview-tag">APERÇU GRATUIT</span>' : ""}
        </div>
        <div class="status ${hasVideo ? "ok" : "none"}">
          ${hasVideo ? "✅ Vidéo attachée" : "⚠️ Aucune vidéo pour l'instant"}
        </div>
        <div class="btn-row">
          <label class="btn-sm" style="cursor:pointer;">
            🎬 ${hasVideo ? "Remplacer la vidéo" : "Uploader une vidéo"}
            <input type="file" accept="video/*" class="video-input hidden" data-lesson-id="${lesson.id}">
          </label>
          <button class="btn-sm danger delete-lesson-btn" data-id="${lesson.id}">🗑️ Supprimer</button>
        </div>
        <div class="msg lesson-msg" data-lesson-id="${lesson.id}"></div>
      `;
      containerEl2.appendChild(row);
    }

    containerEl2.querySelectorAll(".video-input").forEach((input) => {
      input.addEventListener("change", onUploadVideo);
    });
    containerEl2.querySelectorAll(".delete-lesson-btn").forEach((btn) => {
      btn.addEventListener("click", onDeleteLesson);
    });
    containerEl2.querySelectorAll(".toggle-quiz-btn").forEach((btn) => {
      btn.addEventListener("click", onToggleQuizPanel);
    });
  }

  // -------- Gestion des questions d'un quiz --------
  async function onToggleQuizPanel(e) {
    const lessonId = e.target.dataset.id;
    const panel = document.querySelector(`.quiz-admin-panel[data-lesson-id="${lessonId}"]`);
    if (!panel) return;
    const wasHidden = panel.classList.contains("hidden");
    panel.classList.toggle("hidden");
    if (wasHidden) await loadQuizQuestions(lessonId, panel);
  }

  async function loadQuizQuestions(lessonId, panel) {
    panel.innerHTML = `<div class="msg">Chargement...</div>`;

    const { data: questions, error } = await supabase
      .from("quiz_questions")
      .select("*")
      .eq("lesson_id", lessonId)
      .order("ordre", { ascending: true });

    if (error) {
      panel.innerHTML = `<div class="msg error">${error.message}</div>`;
      return;
    }

    panel.innerHTML = "";

    (questions || []).forEach((q) => {
      const qRow = document.createElement("div");
      qRow.className = "quiz-question-admin-row";
      const choicesText = Array.isArray(q.choices)
        ? q.choices.map((c, i) => (i === q.correct_index ? "✓ " : "— ") + c).join(" | ")
        : "";
      qRow.innerHTML = `
        <div class="qq-text"><strong>${q.ordre}.</strong> ${q.question}</div>
        <div class="qq-choices">${choicesText}</div>
        <button class="btn-sm danger delete-question-btn" data-id="${q.id}" data-lesson-id="${lessonId}">🗑️ Supprimer cette question</button>
      `;
      panel.appendChild(qRow);
    });

    const form = document.createElement("form");
    form.className = "inline-form new-question-form";
    form.dataset.lessonId = lessonId;
    form.innerHTML = `
      <div style="font-weight:600; margin:10px 0 4px;">➕ Nouvelle question</div>
      <input type="text" class="nq-question" placeholder="Intitulé de la question" required>
      <input type="number" class="nq-ordre" placeholder="Ordre" value="${(questions || []).length + 1}" min="1">
      <div class="nq-choice-row"><input type="radio" name="nq-correct" value="0" checked><input type="text" class="nq-choice" placeholder="Choix A" required></div>
      <div class="nq-choice-row"><input type="radio" name="nq-correct" value="1"><input type="text" class="nq-choice" placeholder="Choix B" required></div>
      <div class="nq-choice-row"><input type="radio" name="nq-correct" value="2"><input type="text" class="nq-choice" placeholder="Choix C (optionnel)"></div>
      <div class="nq-choice-row"><input type="radio" name="nq-correct" value="3"><input type="text" class="nq-choice" placeholder="Choix D (optionnel)"></div>
      <div style="font-size:11px; color:var(--text-muted); margin:2px 0 8px;">Cochez le bouton radio à gauche du bon choix.</div>
      <button type="submit" class="btn-sm primary">➕ Ajouter la question</button>
    `;
    form.addEventListener("submit", onAddQuizQuestion);
    panel.appendChild(form);

    panel.querySelectorAll(".delete-question-btn").forEach((btn) => {
      btn.addEventListener("click", onDeleteQuizQuestion);
    });
  }

  async function onAddQuizQuestion(e) {
    e.preventDefault();
    const form = e.target;
    const lessonId = form.dataset.lessonId;
    const question = form.querySelector(".nq-question").value.trim();
    const ordre = parseInt(form.querySelector(".nq-ordre").value, 10) || 1;

    const rows = Array.from(form.querySelectorAll(".nq-choice-row"));
    const choices = [];
    let correctIndex = -1;
    const correctRadioValue = parseInt(form.querySelector('input[name="nq-correct"]:checked').value, 10);

    rows.forEach((row, i) => {
      const text = row.querySelector(".nq-choice").value.trim();
      if (!text) return; // choix vide (C/D optionnels) : ignoré
      if (i === correctRadioValue) correctIndex = choices.length;
      choices.push(text);
    });

    if (choices.length < 2) {
      alert("Il faut au moins 2 choix remplis.");
      return;
    }
    if (correctIndex === -1) {
      alert("Le choix marqué comme correct doit avoir un texte rempli.");
      return;
    }

    const { error } = await supabase.from("quiz_questions").insert({
      lesson_id: lessonId, question, choices, correct_index: correctIndex, ordre
    });

    if (error) {
      alert("Erreur : " + error.message);
      return;
    }

    // loadModules() reconstruit toute la liste (pour rafraîchir le
    // compteur de questions affiché sur la ligne de la leçon) — on
    // rouvre ensuite le panneau de cette leçon pour rester au même
    // endroit plutôt que de faire disparaître ce qu'on vient de faire.
    await loadModules();
    const panel = document.querySelector(`.quiz-admin-panel[data-lesson-id="${lessonId}"]`);
    if (panel) { panel.classList.remove("hidden"); await loadQuizQuestions(lessonId, panel); }
  }

  async function onDeleteQuizQuestion(e) {
    const id = e.target.dataset.id;
    const lessonId = e.target.dataset.lessonId;
    if (!confirm("Supprimer cette question ?")) return;
    const { error } = await supabase.from("quiz_questions").delete().eq("id", id);
    if (error) { alert("Erreur : " + error.message); return; }
    const panel = document.querySelector(`.quiz-admin-panel[data-lesson-id="${lessonId}"]`);
    if (panel) await loadQuizQuestions(lessonId, panel);
  }


  document.getElementById("new-module-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const titre = document.getElementById("nm-titre").value.trim();
    const ordre = parseInt(document.getElementById("nm-ordre").value, 10) || 0;
    const msgEl = document.getElementById("new-module-msg");
    msgEl.textContent = "";

    const { error } = await supabase.from("formation_modules").insert({
      formation_id: formationId, titre, ordre
    });

    if (error) {
      msgEl.className = "msg error";
      msgEl.textContent = "Erreur : " + error.message;
      return;
    }

    document.getElementById("nm-titre").value = "";
    await loadModules();
  });

  async function onCreateLesson(e) {
    e.preventDefault();
    const form = e.target;
    const moduleId = form.dataset.moduleId;
    const titre = form.querySelector(".nl-titre").value.trim();
    const ordre = parseInt(form.querySelector(".nl-ordre").value, 10) || 0;
    const isPreview = form.querySelector(".nl-preview").checked;
    const type = form.querySelector(".nl-type").value || "video";

    const { error } = await supabase.from("formation_lessons").insert({
      module_id: moduleId, titre, ordre, is_preview: isPreview, type
    });

    if (error) {
      alert("Erreur : " + error.message);
      return;
    }
    await loadModules();
  }

  async function onDeleteModule(e) {
    const id = e.target.dataset.id;
    if (!confirm("Supprimer ce module et toutes ses leçons ?")) return;
    const { error } = await supabase.from("formation_modules").delete().eq("id", id);
    if (error) { alert("Erreur : " + error.message); return; }
    await loadModules();
  }

  async function onDeleteLesson(e) {
    const id = e.target.dataset.id;
    if (!confirm("Supprimer cette leçon ?")) return;
    const { error } = await supabase.from("formation_lessons").delete().eq("id", id);
    if (error) { alert("Erreur : " + error.message); return; }
    await loadModules();
  }

  async function onUploadVideo(e) {
    const input = e.target;
    const file = input.files[0];
    if (!file) return;

    const lessonId = input.dataset.lessonId;
    const msgEl = document.querySelector(`.lesson-msg[data-lesson-id="${lessonId}"]`);
    msgEl.className = "msg";
    msgEl.textContent = "⏳ Envoi en cours...";
    input.disabled = true;

    try {
      // 1. Signature d'upload sécurisée (type authenticated)
      const sig = await callCourseApi("admin-upload-sign", { lessonId: Number(lessonId) });

      // 2. Envoi direct du fichier vers Cloudinary
      const formData = new FormData();
      formData.append("file", file);
      formData.append("api_key", sig.apiKey);
      formData.append("timestamp", sig.timestamp);
      formData.append("signature", sig.signature);
      formData.append("folder", sig.folder);
      formData.append("type", sig.type);

      const uploadResp = await fetch(sig.uploadUrl, { method: "POST", body: formData });
      const uploadData = await uploadResp.json();

      if (!uploadResp.ok || !uploadData.public_id) {
        throw new Error(uploadData.error ? uploadData.error.message : "Échec de l'upload Cloudinary.");
      }

      // 3. Enregistrement des métadonnées (jamais le fichier lui-même)
      const { error: dbError } = await supabase.from("formation_lesson_media").upsert({
        lesson_id: Number(lessonId),
        video_public_id: uploadData.public_id,
        duree_secondes: uploadData.duration ? Math.round(uploadData.duration) : null,
        updated_at: new Date().toISOString()
      });

      if (dbError) throw new Error(dbError.message);

      msgEl.className = "msg ok";
      msgEl.textContent = "✅ Vidéo enregistrée.";
      await loadModules();
    } catch (err) {
      console.error(err);
      msgEl.className = "msg error";
      msgEl.textContent = "❌ " + err.message;
    } finally {
      input.disabled = false;
    }
  }

  async function init() {
    const { data } = await supabase.auth.getSession();

    if (!data || !data.session || !data.session.user) {
      loadingEl.classList.add("hidden");
      deniedEl.classList.remove("hidden");
      return;
    }
    currentSession = data.session;

    const { data: profile } = await supabase
      .from("profiles").select("role").eq("id", data.session.user.id).maybeSingle();

    const role = profile ? profile.role : "user";
    if (role !== "admin" && role !== "super_admin" && role !== "founder") {
      loadingEl.classList.add("hidden");
      deniedEl.classList.remove("hidden");
      return;
    }

    if (!formationId) {
      loadingEl.classList.add("hidden");
      return;
    }

    loadingEl.classList.add("hidden");
    containerEl.classList.remove("hidden");
    await loadFormationTitle();
    await loadModules();
  }

  init();
})();
</script>

</body>
</html>
