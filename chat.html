<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — MAHOUTO+</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/logo-mahouto-plus.png">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="attachment-card.css">
<link rel="stylesheet" href="audio-player.css">
<script src="theme-toggle.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

  html, body { height: 100%; background: var(--bg); color: var(--white); }

  body { display: flex; flex-direction: column; }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--bg-card);
  }

  header a.back {
    color: var(--gold-bright);
    text-decoration: none;
    font-size: 22px;
    line-height: 1;
  }

  header h1 { font-size: 18px; color: var(--gold-bright); }

  header .room {
    margin-left: auto;
    font-size: 12px;
    color: var(--accent-green);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  header .room::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    display: inline-block;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    background: var(--bg-card);
    align-self: flex-start;
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
  }

  .bubble.long { max-width: 90%; }

  .bubble pre.code-block {
    margin: 6px 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.28);
    overflow-x: auto;
    white-space: pre;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .bubble.mine pre.code-block { background: rgba(0,0,0,.14); }
  .bubble pre.code-block code { white-space: pre; }

  .bubble.mine { background: var(--gold-bright); color: #0A0A0A; align-self: flex-end; }

  .bubble .meta { font-size: 11px; opacity: .65; margin-bottom: 4px; font-weight: bold; }

  form#composer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--bg-card);
  }

  #composer textarea {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border-radius: 20px;
    border: none;
    background: var(--bg-card);
    color: var(--white);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 220px;
    overflow-y: auto;
    line-height: 1.35;
  }

  #composer textarea:focus { outline: 2px solid var(--gold-bright); }

  #composer button[type="submit"] {
    padding: 0 22px;
    border: none;
    border-radius: 20px;
    background: var(--gold-bright);
    font-weight: bold;
    cursor: pointer;
  }

  #composer button:disabled { opacity: .5; cursor: not-allowed; }

  #login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }

  #login-screen h2 { color: var(--gold-bright); font-size: 24px; }
  #login-screen p { color: var(--text-muted); max-width: 320px; }

  #login-screen input {
    padding: 12px 16px;
    border-radius: 12px;
    border: none;
    background: var(--bg-card);
    color: var(--white);
    width: 100%;
    max-width: 300px;
    font-size: 15px;
  }

  #login-screen button {
    padding: 12px 30px;
    border: none;
    border-radius: 12px;
    background: var(--gold-bright);
    font-weight: bold;
    cursor: pointer;
  }

  #status-message { color: var(--text-muted); font-size: 13px; min-height: 18px; }

  /* ---------- Salon payant non débloqué ---------- */
  #locked-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
  }
  #locked-screen .lock-icon { font-size: 44px; }
  #locked-screen h2 { color: var(--gold-bright); font-size: 22px; }
  #locked-screen p { color: var(--text-muted); max-width: 300px; }
  #locked-price { color: var(--gold); font-weight: bold; font-size: 18px; }
  #locked-buy-btn {
    padding: 12px 30px;
    border: none;
    border-radius: 12px;
    background: var(--gold-bright);
    font-weight: bold;
    cursor: pointer;
    margin-top: 6px;
  }

  .hidden { display: none !important; }

  /* ---------- Bulle : état modifié / supprimé ---------- */
  .bubble .edited-tag {
    font-size: 10.5px;
    opacity: .6;
    margin-left: 6px;
    font-style: italic;
  }

  .bubble.deleted { font-style: italic; opacity: .6; }

  .bubble { cursor: pointer; }

  /* ---------- Menu d'actions sur un message (tap long) ---------- */
  #msg-action-sheet {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 70;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  #msg-action-sheet .sheet {
    width: 100%;
    max-width: 480px;
    background: var(--bg-elevated);
    border-radius: 20px 20px 0 0;
    padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    max-height: 70vh;
    overflow-y: auto;
  }

  #msg-action-sheet .sheet-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 3px;
    margin: 0 auto 10px;
  }

  #msg-action-sheet button {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 22px;
    background: none;
    border: none;
    color: var(--white);
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }

  #msg-action-sheet button:active { background: var(--bg-card); }
  #msg-action-sheet button.danger { color: #F87171; }
  #msg-action-sheet button:disabled { opacity: .35; cursor: not-allowed; }

  #media-viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 80;
    display: flex; align-items: center; justify-content: center;
  }
  #media-viewer img, #media-viewer video { width: 90vw; height: 90vh; object-fit: contain; }
  #media-viewer-close {
    position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
    border-radius: 50%; border: none; background: rgba(0,0,0,.5); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer; z-index: 81;
  }
  .play-overlay {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.55);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 20px; pointer-events: none;
  }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div id="login-screen">
  <h2>Rejoindre la discussion</h2>
  <p>Choisis un pseudo pour commencer à discuter en temps réel.</p>
  <input id="username-input" type="text" placeholder="Ton pseudo" maxlength="24" autocomplete="off">
  <button id="join-btn">Entrer dans le chat</button>
  <div id="status-message"></div>
</div>

<header class="hidden" id="chat-header">
  <a class="back" href="discussions.html" aria-label="Retour">←</a>
  <h1 id="room-title">💬 Discussion</h1>
  <span class="room">En direct</span>
</header>

<div id="locked-screen" class="hidden">
  <a href="discussions.html" style="position:absolute;top:18px;left:18px;color:var(--text-muted);text-decoration:none;font-size:15px;">← Retour</a>
  <div class="lock-icon">🔒</div>
  <h2 id="locked-room-name">Salon payant</h2>
  <p>Rejoins ce salon pour lire et écrire les messages.</p>
  <div id="locked-price"></div>
  <button id="locked-buy-btn" type="button">Débloquer l'accès</button>
</div>

<div id="media-viewer" class="hidden">
  <button type="button" id="media-viewer-close" aria-label="Fermer">✕</button>
  <img id="media-viewer-img" class="hidden" src="" alt="">
  <video id="media-viewer-video" class="hidden" controls></video>
</div>

<button type="button" id="play-all-audio-btn" class="play-all-audio-btn hidden">▶ Lire tous les audios</button>
<div id="messages" class="hidden"></div>

<!-- Menu d'actions sur un message (modifier / supprimer / copier / partager) -->
<div id="msg-action-sheet" class="hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <button type="button" data-action="copy">📋 Copier</button>
    <button type="button" data-action="share">🔗 Partager</button>
    <button type="button" data-action="edit">✏️ Modifier</button>
    <button type="button" data-action="delete-me">🙈 Supprimer pour moi</button>
    <button type="button" class="danger" data-action="delete-all">🗑️ Supprimer pour tous</button>
  </div>
</div>

<div id="attachment-queue" class="attachment-queue hidden">
  <div id="attachment-queue-list" class="attachment-queue-list"></div>
  <div class="attachment-queue-actions">
    <button type="button" id="attachment-queue-cancel" class="attachment-queue-cancel">Annuler</button>
    <button type="button" id="attachment-queue-send" class="attachment-queue-send">Envoyer <span id="attachment-queue-count"></span></button>
  </div>
</div>

<form id="composer" class="hidden">
  <button type="button" id="attach-btn" title="Envoyer un fichier" style="background:var(--bg-card);border:none;border-radius:20px;width:44px;flex:none;color:var(--gold-bright);font-size:18px;cursor:pointer;">📎</button>
  <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.tiff,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.md,.svg,.ai,.eps,.psd,.cdr,.dng,.cr2,.cr3,.nef,.arw,.raf,.mp3,.wav,.m4a,.ogg,.mp4,.webm,.mov,.mkv,.zip,.rar,.7z,.tar,.gz,.html,.css,.js,.ts,.json,.xml,.sql,.php,.py,.java,.c,.cpp,.h,.go,.rs" class="hidden">
  <textarea id="message-input" rows="1" placeholder="Écrire un message..." maxlength="20000"></textarea>
  <button type="submit">Envoyer</button>
</form>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="attachments.js"></script>
<script src="audio-player.js"></script>
<script>
(function () {
  const cfg = window.MAHOUTO_CONFIG;
  const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const ROOM_ID = params.get("room") || "general";
  const ROOM_NAME = params.get("name") || "Général";

  document.getElementById("room-title").textContent = "💬 " + ROOM_NAME;

  const loginScreen = document.getElementById("login-screen");
  const usernameInput = document.getElementById("username-input");
  const joinBtn = document.getElementById("join-btn");
  const statusMessage = document.getElementById("status-message");
  const chatHeader = document.getElementById("chat-header");
  const messagesEl = document.getElementById("messages");
  const composer = document.getElementById("composer");
  const messageInput = document.getElementById("message-input");

  // -------- Lecture en chaîne des audios du salon (playlist) --------
  const playAllAudioBtn = document.getElementById("play-all-audio-btn");
  if (window.MahoutoAudioPlayer) {
    window.MahoutoAudioPlayer.setOnRegistryChange((count) => {
      playAllAudioBtn.classList.toggle("hidden", count < 2);
    });
    playAllAudioBtn.addEventListener("click", () => window.MahoutoAudioPlayer.playAll());
  }

  const mediaViewer = document.getElementById("media-viewer");
  const mediaViewerImg = document.getElementById("media-viewer-img");
  const mediaViewerVideo = document.getElementById("media-viewer-video");

  function openMediaViewer(el) {
    if (el.dataset.type === "video") {
      mediaViewerVideo.src = el.dataset.src;
      mediaViewerVideo.classList.remove("hidden");
      mediaViewerImg.classList.add("hidden");
      mediaViewerImg.src = "";
      mediaViewerVideo.play().catch(() => {});
    } else {
      mediaViewerImg.src = el.dataset.fullSrc || el.src;
      mediaViewerImg.classList.remove("hidden");
      mediaViewerVideo.classList.add("hidden");
      mediaViewerVideo.pause();
      mediaViewerVideo.removeAttribute("src");
      mediaViewerVideo.load();
    }
    mediaViewer.classList.remove("hidden");
  }

  function closeMediaViewer() {
    mediaViewer.classList.add("hidden");
    mediaViewerImg.classList.add("hidden");
    mediaViewerImg.src = "";
    mediaViewerVideo.pause();
    mediaViewerVideo.removeAttribute("src");
    mediaViewerVideo.load();
  }

  document.getElementById("media-viewer-close").addEventListener("click", closeMediaViewer);
  mediaViewer.addEventListener("click", (e) => {
    if (e.target === mediaViewer || e.target === mediaViewerImg) closeMediaViewer();
  });


  let currentUser = null;
  let currentUsername = null;
  let hiddenMessageIds = new Set(); // "supprimé pour moi" (local, table hidden_messages)
  let activeMessageId = null;

  function setStatus(text) { statusMessage.textContent = text || ""; }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // Détecte si une URL de pièce jointe pointe vers un PDF.
  function isPdfUrl(url) {
    return /\.pdf(\?|$)/i.test(url || "");
  }

  // Construit l'URL Cloudinary de la miniature de la 1ère page d'un PDF.
  // Cloudinary stocke les PDF comme des images multi-pages : on insère
  // une transformation (page 1, conversion JPG, largeur limitée) juste
  // après "/upload/" dans l'URL d'origine.
  function pdfThumbnailUrl(url) {
    if (!url || !url.includes("/upload/")) return null;
    return url.replace("/upload/", "/upload/pg_1,f_jpg,w_500,c_limit,q_auto/");
  }

  // Transforme les URLs présentes dans un texte déjà échappé en liens
  // cliquables. Opère sur le texte échappé (jamais sur le texte brut)
  // pour ne jamais réintroduire de HTML non filtré — sûr contre les
  // injections, même si le message contient "<script>" etc.
  function linkify(escapedText) {
    return escapedText.replace(/(\bhttps?:\/\/[^\s<]+|\bwww\.[^\s<]+)/gi, function (match) {
      const href = /^https?:\/\//i.test(match) ? match : "https://" + match;
      return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;">' + match + '</a>';
    });
  }

  // Met en forme le corps d'un message : détecte les blocs ```code```
  // et les isole visuellement, sans jamais désactiver l'échappement.
  // N'opère QUE sur du texte déjà passé par escapeHtml() — les
  // backticks ne sont jamais échappés par escapeHtml, donc cette
  // détection reste fiable sur le texte sûr. linkify() n'est appliqué
  // qu'aux portions hors bloc de code, pour ne pas transformer une
  // URL présente dans un extrait de code.
  function formatMessageBody(escapedText) {
    const parts = escapedText.split(/```([\s\S]*?)```/g);
    let result = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        const codeContent = parts[i].replace(/^\n/, "").replace(/\n$/, "");
        result += '<pre class="code-block"><code>' + codeContent + "</code></pre>";
      } else {
        result += linkify(parts[i]);
      }
    }
    return result;
  }

  // Nettoie un nom de fichier pour l'utiliser dans une URL de
  // transformation Cloudinary : les points, parenthèses, virgules...
  // ont un sens technique pour Cloudinary et cassent l'URL, même
  // une fois encodés. On retire aussi l'extension : Cloudinary
  // l'ajoute automatiquement lui-même au moment du téléchargement.
  function sanitizeForCloudinaryAttachment(filename) {
    const withoutExt = filename.replace(/\.[^./\\]+$/, "");
    const safe = withoutExt.replace(/[^a-zA-Z0-9 _-]/g, "_").trim();
    return safe || "fichier";
  }

  // Construit une URL Cloudinary qui force le téléchargement avec le
  // vrai nom d'origine (fl_attachment), plutôt que l'identifiant
  // aléatoire généré par Cloudinary lors de l'envoi.
  function attachmentDownloadUrl(url, filename) {
    if (!url || !url.includes("/upload/") || !filename) return url;
    const safeName = sanitizeForCloudinaryAttachment(filename);
    return url.replace("/upload/", "/upload/fl_attachment:" + encodeURIComponent(safeName) + "/");
  }

  // `resolvedMap` (optionnel) : Map(id -> {url, previewUrl, downloadUrl})
  // déjà résolue en lot par loadHistory() pour les pièces jointes
  // "authenticated". Sans cette map (nouveau message reçu en temps
  // réel), la pièce jointe authenticated est résolue individuellement
  // après le premier rendu, sans bloquer l'affichage du message.
  function renderMessage(msg, resolvedMap) {
    if (hiddenMessageIds.has(msg.id)) return;

    const bubble = document.createElement("div");
    bubble.dataset.id = msg.id;
    bubble.dataset.userId = msg.user_id;
    bubble.className = "bubble" +
      (msg.user_id === currentUser.id ? " mine" : "") +
      (msg.is_deleted ? " deleted" : "") +
      (msg.content && msg.content.length > 200 ? " long" : "");
    const time = new Date(msg.created_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = msg.username + " · " + time;
    bubble.appendChild(meta);

    if (msg.is_deleted) {
      if (msg.attachment_type === "audio" && window.MahoutoAudioPlayer) {
        window.MahoutoAudioPlayer.unregisterTrack(msg.id); // retire proprement de la playlist si présent
      }
      bubble.appendChild(document.createTextNode("🚫 Message supprimé"));
    } else {
      if (msg.attachment_url) {
        const resolved = resolvedMap ? resolvedMap.get(String(msg.id)) : null;
        const mediaEl = MahoutoAttachments.renderAttachment(msg, resolved);
        mediaEl.classList.add("msg-attachment-wrap");
        bubble.appendChild(mediaEl);

        if (!resolved && MahoutoAttachments.needsSignedUrl(msg)) {
          MahoutoAttachments.resolveAttachmentUrls(supabase, "room", ROOM_ID, [msg]).then((map) => {
            const r = map.get(String(msg.id));
            if (r && mediaEl.isConnected) {
              const fresh = MahoutoAttachments.renderAttachment(msg, r);
              fresh.classList.add("msg-attachment-wrap");
              mediaEl.replaceWith(fresh);
            }
          });
        }
      }

      if (msg.content) {
        const textWrap = document.createElement("div");
        if (msg.attachment_url) textWrap.style.marginTop = "6px";
        textWrap.innerHTML = formatMessageBody(escapeHtml(msg.content));
        bubble.appendChild(textWrap);
      }

      if (msg.edited_at) {
        const editedTag = document.createElement("span");
        editedTag.className = "edited-tag";
        editedTag.textContent = "modifié";
        bubble.appendChild(editedTag);
      }
    }

    bubble.addEventListener("click", (e) => {
      const media = e.target.closest(".msg-media");
      if (media) { openMediaViewer(media); return; }
      openMessageActions(msg);
    });

    const existing = messagesEl.querySelector('[data-id="' + msg.id + '"]');
    if (existing) {
      existing.replaceWith(bubble);
    } else {
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  async function loadHiddenMessageIds() {
    if (!currentUser) return;
    const { data, error } = await supabase
      .from("hidden_messages")
      .select("message_id")
      .eq("user_id", currentUser.id);
    if (error) { console.error("hidden_messages indisponible :", error); return; }
    hiddenMessageIds = new Set((data || []).map((r) => r.message_id));
  }

  async function loadHistory() {
    const { data, error } = await supabase
      .from("messages")
      .select("*")
      .eq("room_id", ROOM_ID)
      .order("created_at", { ascending: true })
      .limit(200);

    if (error) { setStatus("Erreur de chargement des messages."); console.error(error); return; }
    const resolvedMap = await MahoutoAttachments.resolveAttachmentUrls(supabase, "room", ROOM_ID, data);
    data.forEach((m) => renderMessage(m, resolvedMap));
  }

  function subscribeToNewMessages() {
    supabase
      .channel("room:" + ROOM_ID)
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "messages", filter: "room_id=eq." + ROOM_ID },
        (payload) => { renderMessage(payload.new); markAsRead(); }
      )
      .on(
        "postgres_changes",
        { event: "UPDATE", schema: "public", table: "messages", filter: "room_id=eq." + ROOM_ID },
        (payload) => { renderMessage(payload.new); }
      )
      .subscribe();
  }

  async function ensureProfile(userId, username) {
    const { error } = await supabase
      .from("profiles")
      .upsert({ id: userId, username: username }, { onConflict: "id" });
    if (error) console.error("Profil non enregistré :", error);
  }

  async function markAsRead() {
    if (!currentUser) return;
    await supabase
      .from("read_state")
      .upsert(
        { user_id: currentUser.id, room_id: ROOM_ID, last_read_at: new Date().toISOString() },
        { onConflict: "user_id,room_id" }
      );
  }

  async function joinChat() {
    const username = usernameInput.value.trim();
    if (!username) { setStatus("Entre un pseudo pour continuer."); return; }

    joinBtn.disabled = true;
    setStatus("Connexion...");

    try {
      const { data, error } = await supabase.auth.signInAnonymously();
      if (error) throw error;

      currentUser = data.user;
      currentUsername = username;

      await ensureProfile(currentUser.id, currentUsername);
      await enterRoom();
    } catch (err) {
      console.error(err);
      setStatus("Connexion impossible. Vérifie ta configuration Supabase (config.js).");
      joinBtn.disabled = false;
    }
  }

  function money(xof) { return Number(xof).toLocaleString("fr-FR") + " FCFA"; }

  // Vérifie l'accès à un salon payant. La vraie barrière est côté
  // base de données (RLS sur "messages") — ce contrôle ne sert qu'à
  // donner un écran clair plutôt qu'un chat vide et muet.
  async function checkRoomAccess() {
    const { data: room } = await supabase
      .from("rooms")
      .select("name, is_paid, price, created_by")
      .eq("id", ROOM_ID)
      .maybeSingle();

    if (!room || !room.is_paid) return true;
    if (room.created_by === currentUser.id) return true;

    const { data: profile } = await supabase
      .from("profiles").select("role").eq("id", currentUser.id).maybeSingle();
    if (profile && ["admin", "super_admin", "founder"].includes(profile.role)) return true;

    const { data: purchase } = await supabase
      .from("purchases")
      .select("id")
      .eq("user_id", currentUser.id)
      .eq("course_id", ROOM_ID)
      .eq("product_type", "salon")
      .eq("status", "paid")
      .maybeSingle();

    if (purchase) return true;

    document.getElementById("locked-room-name").textContent = room.name;
    document.getElementById("locked-price").textContent = money(room.price);
    document.getElementById("locked-screen").classList.remove("hidden");
    document.getElementById("locked-buy-btn").onclick = () => buyRoomAccess(room);
    return false;
  }

  async function buyRoomAccess(room) {
    const btn = document.getElementById("locked-buy-btn");
    btn.disabled = true;
    btn.textContent = "Redirection...";

    try {
      const { data: sessionData } = await supabase.auth.getSession();
      const accessToken = sessionData && sessionData.session ? sessionData.session.access_token : null;
      if (!accessToken) {
        alert("Ta session a expiré. Reconnecte-toi puis réessaie.");
        btn.disabled = false;
        btn.textContent = "Débloquer l'accès";
        return;
      }

      const resp = await fetch("/api/fedapay-checkout", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + accessToken
        },
        body: JSON.stringify({ courseId: ROOM_ID, productType: "salon" })
      });

      const data = await resp.json();
      if (!resp.ok || !data.checkoutUrl) {
        throw new Error(data.error || "Réponse de paiement invalide.");
      }

      window.location.href = data.checkoutUrl;
    } catch (err) {
      console.error(err);
      alert("Paiement indisponible : " + err.message);
      btn.disabled = false;
      btn.textContent = "Débloquer l'accès";
    }
  }

  async function enterRoom() {
    loginScreen.classList.add("hidden");

    const hasAccess = await checkRoomAccess();
    if (!hasAccess) return;

    chatHeader.classList.remove("hidden");
    messagesEl.classList.remove("hidden");
    composer.classList.remove("hidden");

    await loadHiddenMessageIds();
    await loadHistory();
    subscribeToNewMessages();
    await markAsRead();
    messageInput.focus();
  }

  async function trySilentResume() {
    const { data } = await supabase.auth.getSession();
    if (data && data.session && data.session.user) {
      currentUser = data.session.user;
      const { data: profile } = await supabase
        .from("profiles")
        .select("username")
        .eq("id", currentUser.id)
        .maybeSingle();
      currentUsername = profile ? profile.username : "Utilisateur";
      await enterRoom();
    }
  }

  joinBtn.addEventListener("click", joinChat);
  usernameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") joinChat(); });

  composer.addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = messageInput.value.trim();
    if (!content || !currentUser) return;

    messageInput.value = "";
    autoGrow();
    const { error } = await supabase.from("messages").insert({
      room_id: ROOM_ID,
      user_id: currentUser.id,
      username: currentUsername,
      content: content
    });

    if (error) { console.error(error); setStatus("Message non envoyé."); }
    else await markAsRead();
  });

  // -------- Zone de texte extensible (vers le haut, comme WhatsApp) --------
  function autoGrow() {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 220) + "px";
  }

  messageInput.addEventListener("input", autoGrow);

  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      composer.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });

  const attachBtn = document.getElementById("attach-btn");
  const fileInput = document.getElementById("file-input");
  const attachQueueEl = document.getElementById("attachment-queue");
  const attachQueueListEl = document.getElementById("attachment-queue-list");
  const attachQueueCountEl = document.getElementById("attachment-queue-count");
  const attachQueueSendBtn = document.getElementById("attachment-queue-send");
  const attachQueueCancelBtn = document.getElementById("attachment-queue-cancel");

  // File d'attente en mémoire : la sélection d'un fichier ne l'envoie
  // plus jamais toute seule (voir renderQueue()/change ci-dessous).
  // Chaque item : { localId, file, status: 'pending'|'uploading'|'sent'|'error' }
  let pendingFiles = [];
  let queueSending = false;
  let localIdSeq = 0;

  attachBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const newFiles = Array.from(fileInput.files || []);
    fileInput.value = ""; // permet de resélectionner le même fichier plus tard
    if (!newFiles.length) return;
    newFiles.forEach((file) => {
      pendingFiles.push({ localId: ++localIdSeq, file, status: "pending" });
    });
    renderQueue();
  });

  function renderQueue() {
    if (!pendingFiles.length) {
      attachQueueEl.classList.add("hidden");
      attachQueueListEl.innerHTML = "";
      return;
    }
    attachQueueEl.classList.remove("hidden");
    attachQueueListEl.innerHTML = "";
    pendingFiles.forEach((item) => {
      const row = document.createElement("div");
      row.className = "attachment-queue-item";
      row.dataset.localId = item.localId;

      const icon = document.createElement("div");
      icon.className = "attachment-queue-item-icon";
      icon.textContent = "📎";

      const info = document.createElement("div");
      info.className = "attachment-queue-item-info";
      const name = document.createElement("div");
      name.className = "attachment-queue-item-name";
      name.textContent = item.file.name;
      const status = document.createElement("div");
      status.className = "attachment-queue-item-status" + (item.status === "error" ? " error" : item.status === "sent" ? " sent" : "");
      status.textContent =
        item.status === "pending" ? "En attente" :
        item.status === "uploading" ? "Envoi..." :
        item.status === "sent" ? "Envoyé ✓" : "Erreur — sera retenté";
      info.appendChild(name);
      info.appendChild(status);

      row.appendChild(icon);
      row.appendChild(info);

      if (item.status === "pending" || item.status === "error") {
        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "attachment-queue-item-remove";
        removeBtn.textContent = "✕";
        removeBtn.addEventListener("click", () => {
          pendingFiles = pendingFiles.filter((f) => f.localId !== item.localId);
          renderQueue();
        });
        row.appendChild(removeBtn);
      }

      attachQueueListEl.appendChild(row);
    });
    attachQueueCountEl.textContent = "(" + pendingFiles.filter((f) => f.status !== "sent").length + ")";
  }

  attachQueueCancelBtn.addEventListener("click", () => {
    if (queueSending) return; // pas d'annulation en pleine transmission
    pendingFiles = [];
    renderQueue();
  });

  // Un seul fichier -> un seul message (comportement inchangé), mais
  // désormais appelé UNIQUEMENT depuis "Envoyer", jamais depuis "change".
  async function uploadAndSendFile(file) {
    const { data: sessionData } = await supabase.auth.getSession();
    const accessToken = sessionData && sessionData.session ? sessionData.session.access_token : null;
    const signQuery = new URLSearchParams({ filename: file.name || "", context: "room", contextId: ROOM_ID });
    const signResp = await fetch("/api/attachment?" + signQuery.toString(), {
      headers: accessToken ? { "Authorization": "Bearer " + accessToken } : {}
    });
    const sign = await signResp.json();
    if (!signResp.ok) throw new Error(sign.error || "Signature indisponible");

    const formData = new FormData();
    formData.append("file", file);
    formData.append("api_key", sign.apiKey);
    formData.append("timestamp", sign.timestamp);
    formData.append("signature", sign.signature);
    formData.append("folder", sign.folder);
    if (sign.type) formData.append("type", sign.type);

    const uploadResp = await fetch(sign.uploadUrl, { method: "POST", body: formData });
    const uploadData = await uploadResp.json();
    if (!uploadResp.ok) throw new Error(uploadData.error?.message || "Envoi échoué");

    let attachmentType = "raw";
    if (uploadData.resource_type === "image") attachmentType = "image";
    else if (uploadData.resource_type === "video") attachmentType = "video";

    const { error } = await supabase.from("messages").insert({
      room_id: ROOM_ID,
      user_id: currentUser.id,
      username: currentUsername,
      content: "",
      attachment_url: uploadData.secure_url,
      attachment_type: attachmentType,
      attachment_name: file.name || null,
      attachment_size: file.size || null,
      attachment_mime: file.type || null,
      attachment_public_id: uploadData.public_id || null,
      attachment_resource_type: uploadData.resource_type || null,
      attachment_access: sign.accessType === "authenticated" ? "authenticated" : "public"
    });
    if (error) throw error;
  }

  attachQueueSendBtn.addEventListener("click", async () => {
    if (queueSending || !currentUser) return;
    const toSend = pendingFiles.filter((f) => f.status === "pending" || f.status === "error");
    if (!toSend.length) return;

    queueSending = true;
    attachQueueSendBtn.disabled = true;
    attachQueueCancelBtn.disabled = true;

    // Envoi séquentiel (un fichier à la fois) : chaque fichier n'est
    // envoyé qu'une seule fois, jamais deux fois même si l'utilisateur
    // reclique pendant l'envoi (bouton désactivé le temps de la boucle).
    for (const item of toSend) {
      item.status = "uploading";
      renderQueue();
      try {
        await uploadAndSendFile(item.file);
        item.status = "sent";
      } catch (err) {
        console.error(err);
        item.status = "error";
      }
      renderQueue();
    }

    await markAsRead();
    // On retire les envois réussis ; les échecs restent affichés pour
    // permettre de les retirer ou de recliquer sur "Envoyer" (retente).
    pendingFiles = pendingFiles.filter((f) => f.status !== "sent");
    queueSending = false;
    attachQueueCancelBtn.disabled = false;
    attachQueueSendBtn.disabled = false;
    renderQueue();
  });

  // -------- Menu d'actions sur un message --------
  const actionSheet = document.getElementById("msg-action-sheet");
  let activeMessage = null;

  function openMessageActions(msg) {
    if (msg.is_deleted) return; // rien à faire sur un message déjà supprimé pour tous
    activeMessage = msg;

    const isMine = msg.user_id === currentUser.id;
    actionSheet.querySelector('[data-action="edit"]').style.display = isMine && !msg.attachment_url ? "flex" : "none";
    actionSheet.querySelector('[data-action="delete-all"]').style.display = isMine ? "flex" : "none";

    actionSheet.classList.remove("hidden");
  }

  function closeMessageActions() {
    actionSheet.classList.add("hidden");
    activeMessage = null;
  }

  actionSheet.addEventListener("click", (e) => {
    if (e.target === actionSheet) closeMessageActions();
  });

  actionSheet.querySelector('[data-action="copy"]').addEventListener("click", async () => {
    if (activeMessage && activeMessage.content) {
      try { await navigator.clipboard.writeText(activeMessage.content); } catch (err) { console.error(err); }
    }
    closeMessageActions();
  });

  actionSheet.querySelector('[data-action="share"]').addEventListener("click", async () => {
    const msg = activeMessage;
    closeMessageActions();
    if (!msg) return;

    // Priorité : partager le vrai fichier (photo/vidéo/audio/document)
    // si le navigateur le permet — plus utile que de partager un simple lien.
    if (msg.attachment_url) {
      try {
        let fetchUrl = msg.attachment_url;
        if (MahoutoAttachments.needsSignedUrl(msg)) {
          const map = await MahoutoAttachments.resolveAttachmentUrls(supabase, "room", ROOM_ID, [msg]);
          const r = map.get(String(msg.id));
          if (r && r.url) fetchUrl = r.url;
        }
        const resp = await fetch(fetchUrl);
        const blob = await resp.blob();
        const ext = msg.attachment_type === "image" ? "jpg"
          : msg.attachment_type === "video" ? "mp4"
          : msg.attachment_type === "audio" ? "webm"
          : "pdf";
        const filename = msg.attachment_name || ("mahouto-plus." + ext);
        const file = new File([blob], filename, { type: blob.type });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: "MAHOUTO+" });
          return;
        }
      } catch (err) {
        console.error("Partage du fichier impossible, repli sur le lien :", err);
      }
    }

    const text = msg.content || msg.attachment_url || "";
    if (navigator.share) {
      try { await navigator.share({ text: text, title: "MAHOUTO+" }); } catch (err) { /* annulé par l'utilisateur */ }
    } else if (text) {
      try { await navigator.clipboard.writeText(text); setStatus("Copié — le partage direct n'est pas supporté ici."); } catch (err) { console.error(err); }
    }
  });

  actionSheet.querySelector('[data-action="edit"]').addEventListener("click", () => {
    if (!activeMessage) return;
    const msg = activeMessage;
    closeMessageActions();

    const newContent = prompt("Modifier le message :", msg.content || "");
    if (newContent === null) return;
    const trimmed = newContent.trim();
    if (!trimmed) return;

    supabase
      .from("messages")
      .update({ content: trimmed, edited_at: new Date().toISOString() })
      .eq("id", msg.id)
      .then(({ error }) => {
        if (error) { console.error(error); alert("Impossible de modifier ce message."); }
      });
  });

  actionSheet.querySelector('[data-action="delete-me"]').addEventListener("click", async () => {
    if (!activeMessage) return;
    const msg = activeMessage;
    closeMessageActions();

    const { error } = await supabase
      .from("hidden_messages")
      .upsert({ user_id: currentUser.id, message_id: msg.id }, { onConflict: "user_id,message_id" });

    if (error) { console.error(error); alert("Impossible de masquer ce message."); return; }

    hiddenMessageIds.add(msg.id);
    const el = messagesEl.querySelector('[data-id="' + msg.id + '"]');
    if (el) el.remove();
  });

  actionSheet.querySelector('[data-action="delete-all"]').addEventListener("click", () => {
    if (!activeMessage) return;
    const msg = activeMessage;
    closeMessageActions();

    if (!confirm("Supprimer ce message pour tout le monde ?")) return;

    supabase
      .from("messages")
      .update({ is_deleted: true, content: "", attachment_url: "" })
      .eq("id", msg.id)
      .then(({ error }) => {
        if (error) { console.error(error); alert("Impossible de supprimer ce message."); }
      });
  });

  trySilentResume();

})();
</script>
<script src="pwa-install.js"></script>

</body>
</html>
