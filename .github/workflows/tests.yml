# Tests automatiques : lancés à chaque pull request et à chaque envoi vers main.
# Aucun secret n'est utilisé. Les tests s'exécutent sans installation (ils utilisent de faux modules).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lancer les tests
        run: node --test tests/*.test.js
