<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHOUTO AI — MAHOUTO+</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/logo-mahouto-plus.png">
<link rel="stylesheet" href="theme.css">
<script src="theme-toggle.js"></script>
<style>
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    padding-right: 60px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }

  header h1 { font-size: 17px; color: var(--gold); flex: 1; }

  header .hdr-btn {
    font-size: 12.5px;
    background: var(--bg-card);
    color: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 7px 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  header .hdr-btn:active { transform: scale(.96); }

  #ai-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    align-self: flex-start;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .msg a { color: var(--gold-bright); text-decoration: underline; }

  .msg.user {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #0A0A0A;
    align-self: flex-end;
    border: none;
  }

  .msg.thinking { color: var(--text-dim); font-style: italic; }

  form#ai-composer {
    display: flex;
    gap: 10px;
    padding: 14px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
  }

  #ai-composer textarea {
    flex: 1;
    resize: none;
    max-height: 100px;
    padding: 12px 16px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--white);
    font-size: 14.5px;
    font-family: inherit;
  }

  #ai-composer textarea:focus { outline: none; border-color: var(--gold); }

  #ai-composer button { padding: 0 20px; border: none; border-radius: 18px; background: var(--gold-bright); font-weight: bold; cursor: pointer; }
  #ai-composer button:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Panneau historique ---------- */
  #history-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 50;
  }

  #history-panel {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: min(86vw, 340px);
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    z-index: 51;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform .22s ease;
  }

  #history-panel.open { transform: translateX(0); }

  .hist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    color: var(--gold);
    font-weight: bold;
  }

  .hist-head button { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

  #history-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  .hist-empty { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; padding: 14px 8px; text-align: center; }
  .hist-empty a { color: var(--gold); }

  .hist-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 4px 4px 12px;
  }

  .hist-item.current { border-color: var(--gold); }

  .hist-open {
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    color: var(--white);
    padding: 8px 0;
    cursor: pointer;
    font-family: inherit;
  }

  .hist-title { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-date { display: block; font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  .hist-del { background: none; border: none; font-size: 17px; padding: 10px; cursor: pointer; }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div id="ai-app" style="display:flex; flex-direction:column; flex:1;">

  <header>
    <h1>🧠 MAHOUTO AI</h1>
    <button type="button" class="hdr-btn" id="history-btn">🕘 Historique</button>
    <button type="button" class="hdr-btn" id="new-chat-btn">+ Nouvelle conversation</button>
  </header>

  <div id="ai-messages"></div>

  <form id="ai-composer">
    <textarea id="ai-input" rows="1" placeholder="Pose ta question à MAHOUTO AI..."></textarea>
    <button type="submit" id="ai-send-btn">Envoyer</button>
  </form>

</div>

<div id="history-overlay" class="hidden"></div>
<aside id="history-panel" aria-hidden="true">
  <div class="hist-head">
    <span>🕘 Historique</span>
    <button type="button" id="history-close" aria-label="Fermer">✕</button>
  </div>
  <div id="history-list"></div>
</aside>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="icon">🏠</span>Accueil</a>
  <a class="nav-item" href="discussions.html"><span class="icon">💬</span>Messages</a>
  <a class="nav-item active" href="ai.html"><span class="icon">🧠</span>MAHOUTO AI</a>
  <a class="nav-item" href="school.html"><span class="icon">🎓</span>School</a>
  <a class="nav-item" href="profil.html"><span class="icon">👤</span>Profil</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  const API = "https://ai.majestepresse.com";
  const ERROR_TEXT = "Une erreur est survenue, veuillez réessayer";
  const LOGIN_URL = "index.html"; // la connexion (modal Google) vit sur la page d'accueil

  const messagesEl = document.getElementById("ai-messages");
  const composer = document.getElementById("ai-composer");
  const input = document.getElementById("ai-input");
  const sendBtn = document.getElementById("ai-send-btn");
  const newChatBtn = document.getElementById("new-chat-btn");
  const historyBtn = document.getElementById("history-btn");
  const historyClose = document.getElementById("history-close");
  const historyPanel = document.getElementById("history-panel");
  const historyOverlay = document.getElementById("history-overlay");
  const historyList = document.getElementById("history-list");

  const GREETING = "Bonjour 👋 Je suis MAHOUTO AI. Pose-moi une question, demande du code, ou colle un texte à analyser.";

  let conversationId = null;
  let historyToken = 0; // invalide les réponses d'historique périmées

  // -------- Supabase (même pattern que share.html) --------
  let supabaseClient = null;
  try {
    const cfg = window.MAHOUTO_CONFIG;
    if (window.supabase && cfg && cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY) {
      supabaseClient = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    }
  } catch (err) {
    console.error("Supabase indisponible :", err);
  }

  async function getSession() {
    if (!supabaseClient) return null;
    try {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) { console.error("Erreur session:", error); return null; }
      return (data && data.session) || null;
    } catch (err) {
      console.error("Erreur session:", err);
      return null;
    }
  }

  async function authHeaders(base) {
    const headers = Object.assign({}, base);
    const session = await getSession();
    if (session && session.access_token) {
      headers["Authorization"] = "Bearer " + session.access_token;
    }
    return { headers, hasSession: !!(session && session.access_token) };
  }

  // -------- Rendu sécurisé : jamais d'innerHTML --------
  const URL_RE = /https?:\/\/[^\s<>"']+/g;

  function appendText(parent, text) {
    // les "**" orphelins ne doivent jamais rester visibles
    const clean = text.replace(/\*\*/g, "");
    if (clean) parent.appendChild(document.createTextNode(clean));
  }

  function appendLinkified(parent, text) {
    let last = 0;
    let m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text)) !== null) {
      let url = m[0];
      let trailing = "";
      const t = url.match(/[.,;:!?)\]]+$/);
      if (t) { trailing = t[0]; url = url.slice(0, -trailing.length); }
      appendText(parent, text.slice(last, m.index));
      if (url.length > 8) {
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = url;
        parent.appendChild(a);
      } else {
        appendText(parent, url);
      }
      appendText(parent, trailing);
      last = m.index + m[0].length;
    }
    appendText(parent, text.slice(last));
  }

  function renderRich(target, text) {
    const re = /\*\*([\s\S]+?)\*\*/g;
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      appendLinkified(target, text.slice(last, m.index));
      const strong = document.createElement("strong");
      appendLinkified(strong, m[1]);
      target.appendChild(strong);
      last = m.index + m[0].length;
    }
    appendLinkified(target, text.slice(last));
  }

  function addMessage(role, content) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const text = String(content == null ? "" : content);
    if (role.indexOf("assistant") !== -1 && role.indexOf("thinking") === -1) {
      renderRich(div, text);
    } else {
      div.textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function resetMessages() {
    messagesEl.textContent = "";
  }

  function showGreeting() {
    addMessage("assistant", GREETING);
  }

  // -------- Envoi d'un message --------
  composer.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    addMessage("user", text);
    input.value = "";
    autoGrow();
    sendBtn.disabled = true;

    const thinkingEl = addMessage("assistant thinking", "MAHOUTO AI réfléchit...");

    try {
      const { headers } = await authHeaders({ "Content-Type": "application/json" });
      const response = await fetch(API + "/api/chat", {
        method: "POST",
        headers,
        body: JSON.stringify({ message: text, conversationId: conversationId || null })
      });

      if (!response.ok) throw new Error("HTTP " + response.status);

      const newId = response.headers.get("X-Conversation-Id");
      if (newId) conversationId = newId;

      const data = await response.json();
      if (typeof data.reply !== "string") throw new Error("Réponse invalide : reply manquant");
      thinkingEl.remove();
      addMessage("assistant", data.reply);
    } catch (err) {
      console.error(err);
      thinkingEl.remove();
      addMessage("assistant", ERROR_TEXT);
    } finally {
      sendBtn.disabled = false;
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      composer.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });

  // -------- Zone de texte extensible (vers le haut, comme WhatsApp) --------
  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 100) + "px";
  }
  input.addEventListener("input", autoGrow);

  // -------- Nouvelle conversation --------
  newChatBtn.addEventListener("click", () => {
    historyToken++;
    conversationId = null;
    resetMessages();
    showGreeting();
    closeHistory();
  });

  // -------- Historique --------
  function formatDate(value) {
    const d = new Date(value);
    if (!value || isNaN(d.getTime())) return "";
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((startOf(new Date()) - startOf(d)) / 86400000);
    if (days === 0) return "aujourd'hui";
    if (days === 1) return "hier";
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  }

  function openHistory() {
    historyOverlay.classList.remove("hidden");
    historyPanel.classList.add("open");
    historyPanel.setAttribute("aria-hidden", "false");
    loadHistory();
  }

  function closeHistory() {
    historyOverlay.classList.add("hidden");
    historyPanel.classList.remove("open");
    historyPanel.setAttribute("aria-hidden", "true");
  }

  historyBtn.addEventListener("click", openHistory);
  historyClose.addEventListener("click", closeHistory);
  historyOverlay.addEventListener("click", closeHistory);

  function setListMessage(text, withLoginLink) {
    historyList.textContent = "";
    const div = document.createElement("div");
    div.className = "hist-empty";
    div.appendChild(document.createTextNode(text));
    if (withLoginLink) {
      div.appendChild(document.createElement("br"));
      const a = document.createElement("a");
      a.href = LOGIN_URL;
      a.textContent = "Se connecter";
      div.appendChild(a);
    }
    historyList.appendChild(div);
  }

  async function loadHistory() {
    const token = ++historyToken;
    const { headers, hasSession } = await authHeaders({});
    if (!hasSession) {
      setListMessage("Connectez-vous pour conserver votre historique", true);
      return;
    }
    setListMessage("Chargement...", false);
    try {
      const res = await fetch(API + "/api/chat/history", { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.conversations)) throw new Error("Réponse invalide : conversations manquant");
      const items = data.conversations;
      if (token !== historyToken) return;
      renderHistory(items);
    } catch (err) {
      console.error(err);
      if (token === historyToken) setListMessage(ERROR_TEXT, false);
    }
  }

  function renderHistory(items) {
    historyList.textContent = "";
    if (!items.length) { setListMessage("Aucune conversation pour le moment.", false); return; }

    items.forEach((conv) => {
      if (!conv || conv.id == null) return;
      const row = document.createElement("div");
      row.className = "hist-item" + (String(conv.id) === String(conversationId) ? " current" : "");

      const open = document.createElement("button");
      open.type = "button";
      open.className = "hist-open";
      const title = document.createElement("span");
      title.className = "hist-title";
      title.textContent = conv.title || "Conversation";
      const date = document.createElement("span");
      date.className = "hist-date";
      date.textContent = formatDate(conv.updated_at);
      open.appendChild(title);
      open.appendChild(date);
      open.addEventListener("click", () => openConversation(conv.id));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "hist-del";
      del.title = "Supprimer";
      del.setAttribute("aria-label", "Supprimer la conversation");
      del.textContent = "🗑";
      del.addEventListener("click", () => deleteConversation(conv.id, row));

      row.appendChild(open);
      row.appendChild(del);
      historyList.appendChild(row);
    });
  }

  async function openConversation(id) {
    try {
      const { headers } = await authHeaders({});
      const res = await fetch(API + "/api/chat/history/" + encodeURIComponent(id), { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.messages)) throw new Error("Réponse invalide : messages manquant");
      const msgs = data.messages;
      conversationId = id;
      resetMessages();
      msgs.forEach((m) => {
        addMessage(m.role === "user" ? "user" : "assistant", m.content);
      });
      if (!messagesEl.childElementCount) showGreeting();
      closeHistory();
    } catch (err) {
      console.error(err);
      addMessage("assistant", ERROR_TEXT);
      closeHistory();
    }
  }

  async function deleteConversation(id, row) {
    if (!window.confirm("Supprimer cette conversation ?")) return;
    try {
      const { headers } = await authHeaders({});
      const res = await fetch(API + "/api/chat/history/" + encodeURIComponent(id), { method: "DELETE", headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      row.remove();
      if (String(id) === String(conversationId)) conversationId = null;
      if (!historyList.childElementCount) setListMessage("Aucune conversation pour le moment.", false);
    } catch (err) {
      console.error(err);
      window.alert(ERROR_TEXT);
    }
  }

  showGreeting();

})();
</script>
<script src="pwa-install.js"></script>

</body>
</html>
