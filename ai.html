<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>MAJESTÉ — MAHOUTO+</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/logo-mahouto-plus.png">
<link rel="stylesheet" href="theme.css">

<style>
  html, body { overflow: hidden; }

  /* #ai-app occupe la hauteur visible (hors clavier) ; son padding-bottom
     réserve la hauteur MESURÉE de nav.bottom-nav (fixe, hors flux). */
  #ai-app {
    height: var(--app-h, 100dvh);
    min-height: 0;
    flex: none;
    padding-bottom: var(--nav-h, 72px);
  }

  /* Clavier ouvert : la barre de navigation s'efface, le composeur
     reste juste au-dessus du clavier. */
  body.typing nav.bottom-nav { display: none; }
  body.typing #ai-app { padding-bottom: 0; }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 10px 16px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }

  .hdr-title { flex: 1; min-width: 0; }
  header h1 { font-size: 17px; color: var(--gold); white-space: nowrap; line-height: 1.2; }
  .hdr-sub { display: block; font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 3 boutons ronds identiques (le bouton thème est déplacé dans le header) */
  header .icon-btn,
  header .theme-toggle-fab {
    position: static;
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--white);
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }

  header .icon-btn:active { transform: scale(.92); }

  #ai-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    align-self: flex-start;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .msg a { color: var(--gold-bright); text-decoration: underline; }

  .msg.user {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #0A0A0A;
    align-self: flex-end;
    border: none;
  }

  .msg.thinking { color: var(--text-dim); font-style: italic; }

  /* boutons « Word » et « PDF » sous chaque réponse réelle de MAJESTÉ */
  .msg-actions {
    display: flex;
    gap: 8px;
    align-self: flex-start;
    margin-top: -6px;
  }

  .word-btn,
  .pdf-btn {
    min-width: 36px;
    min-height: 36px;
    padding: 0 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 18px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }

  .word-btn:active,
  .pdf-btn:active { transform: scale(.96); border-color: var(--gold); color: var(--gold); }
  .word-btn:disabled,
  .pdf-btn:disabled { opacity: .5; cursor: wait; }

  /* ---------- Écran d'accueil (conversation vide) ---------- */
  #ai-welcome {
    margin: auto;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }

  #ai-welcome .w-logo { font-size: 52px; line-height: 1; }
  #ai-welcome .w-text { color: var(--text-muted); font-size: 14.5px; line-height: 1.5; max-width: 320px; margin-bottom: 8px; }

  .w-cards { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .w-card {
    min-height: 64px;
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--white);
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.35;
    cursor: pointer;
  }

  .w-card:active { transform: scale(.97); border-color: var(--gold); }

  /* libellé : 2 lignes maximum */
  .w-label {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }

  /* 5e carte : sous les deux rangées, sur toute la largeur */
  .w-card:nth-child(5) { grid-column: 1 / -1; }

  form#ai-composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex: none;
    padding: 10px 12px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    box-shadow: 0 -6px 14px rgba(0,0,0,.28);
    position: relative;
  }

  #ai-composer .c-btn,
  #ai-composer #ai-send-btn {
    flex: none;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--white);
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  #ai-composer .c-btn:disabled { opacity: .4; cursor: not-allowed; }

  #ai-composer #ai-send-btn {
    background: var(--gold-bright);
    border: none;
    color: #0A0A0A;
    font-size: 18px;
    font-weight: bold;
  }

  #ai-composer #ai-send-btn:disabled { opacity: .4; cursor: not-allowed; }

  #ai-composer textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    height: 44px;
    max-height: 108px; /* 4 lignes : 4 x 22px + 2 x 10px de padding */
    padding: 10px 16px;
    border-radius: 22px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--white);
    font-size: 16px;
    line-height: 22px;
    font-family: inherit;
    overflow-y: auto;
  }

  #ai-composer textarea:focus { outline: none; border-color: var(--gold); }

  /* ---------- Conversation vocale (plein écran) ---------- */
  #voice-overlay { display: none; }
  #voice-overlay.open {
    display: flex;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px 24px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }

  .v-title { color: var(--gold); font-weight: bold; font-size: 17px; }

  .v-halo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    background: radial-gradient(circle, rgba(255,215,0,.25), rgba(255,215,0,.05) 70%);
    border: 2px solid var(--gold);
  }

  #voice-overlay[data-state="listening"] .v-halo { animation: v-pulse 1.4s ease-in-out infinite; }
  #voice-overlay[data-state="thinking"] .v-halo { animation: v-breathe 1.6s ease-in-out infinite; border-style: dashed; }
  #voice-overlay[data-state="speaking"] .v-halo { animation: v-pulse .8s ease-in-out infinite; background: radial-gradient(circle, rgba(255,215,0,.45), rgba(255,215,0,.1) 70%); }
  #voice-overlay[data-state="paused"] .v-halo { opacity: .5; }

  @keyframes v-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,.45); transform: scale(1); }
    50% { box-shadow: 0 0 0 22px rgba(255,215,0,0); transform: scale(1.05); }
  }
  @keyframes v-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    #voice-overlay .v-halo { animation: none !important; }
  }

  #voice-status { color: var(--white); font-size: 18px; min-height: 26px; }

  #voice-stop {
    min-width: 170px;
    height: 52px;
    padding: 0 28px;
    border: none;
    border-radius: 26px;
    background: var(--gold-bright);
    color: #0A0A0A;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
  }

  #voice-stop:active { transform: scale(.96); }

  /* ---------- Panneau historique ---------- */
  #history-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 50;
  }

  #history-overlay { display: none; }
  #history-overlay.open { display: block; }

  #history-panel {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: min(86vw, 340px);
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    z-index: 51;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform .22s ease;
    pointer-events: none;
  }

  #history-panel.open { transform: translateX(0); pointer-events: auto; }

  .hist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    color: var(--gold);
    font-weight: bold;
  }

  .hist-head button { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; width: 44px; height: 44px; }

  #history-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  .hist-empty { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; padding: 14px 8px; text-align: center; }
  .hist-empty a { color: var(--gold); }

  .hist-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 4px 4px 12px;
  }

  .hist-item.current { border-color: var(--gold); }

  .hist-open {
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    color: var(--white);
    padding: 8px 0;
    cursor: pointer;
    font-family: inherit;
  }

  .hist-title { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-date { display: block; font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  .hist-del { background: none; border: none; font-size: 17px; width: 44px; height: 44px; flex: none; cursor: pointer; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  "use strict";

  const API = "https://ai.majestepresse.com";
  const ERROR_TEXT = "Une erreur est survenue, veuillez réessayer";
  const LOGIN_URL = "index.html"; // la connexion (modal Google) vit sur la page d'accueil

  const messagesEl = document.getElementById("ai-messages");
  const composer = document.getElementById("ai-composer");
  const input = document.getElementById("ai-input");
  const sendBtn = document.getElementById("ai-send-btn");
  const newChatBtn = document.getElementById("new-chat-btn");
  const historyBtn = document.getElementById("history-btn");
  const historyClose = document.getElementById("history-close");
  const historyPanel = document.getElementById("history-panel");
  const historyOverlay = document.getElementById("history-overlay");
  const historyList = document.getElementById("history-list");

  const GREETING = "Bonjour 👋 Je suis MAJESTÉ. Pose-moi une question, demande du code, ou colle un texte à analyser.";
  // label = texte affiché sur la carte ; message = texte réellement envoyé au clic.
  const SUGGESTIONS = [
    {
      label: "🖨️ Je cherche un imprimeur",
      message: "J'ai besoin d'un imprimeur. Quels services proposez-vous (flyers, affiches, cartes de visite, textile…) et comment passer commande ?"
    },
    {
      label: "🎨 Découvrir la sérigraphie",
      message: "Explique-moi ce que vous faites en sérigraphie : supports, tarifs, délais, quantités minimales."
    },
    {
      label: "📲 S'inscrire sur MAHOUTO+",
      message: "Comment m'inscrire sur la plateforme MAHOUTO+, étape par étape ?"
    },
    {
      label: "🌐 L'écosystème MAHOUTO+",
      message: "Explique-moi l'écosystème MAHOUTO+ : quels modules sont disponibles aujourd'hui et lesquels arrivent bientôt ?"
    },
    {
      label: "🎓 Quelles formations proposez-vous ?",
      message: "Quelles formations proposez-vous ? Présente-moi les modules disponibles (sérigraphie, imprimerie, graphisme, développement web), leurs tarifs et les documents obtenus."
    }
  ];
  let sending = false;

  let conversationId = null;
  let historyToken = 0; // invalide les réponses d'historique périmées

  // -------- Supabase (même pattern que share.html) --------
  let supabaseClient = null;
  try {
    const cfg = window.MAHOUTO_CONFIG;
    if (window.supabase && cfg && cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY) {
      supabaseClient = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    }
  } catch (err) {
    console.error("Supabase indisponible :", err);
  }

  async function getSession() {
    if (!supabaseClient) return null;
    try {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) { console.error("Erreur session:", error); return null; }
      return (data && data.session) || null;
    } catch (err) {
      console.error("Erreur session:", err);
      return null;
    }
  }

  async function authHeaders(base) {
    const headers = Object.assign({}, base);
    const session = await getSession();
    if (session && session.access_token) {
      headers["Authorization"] = "Bearer " + session.access_token;
    }
    return { headers, hasSession: !!(session && session.access_token) };
  }

  // -------- Rendu sécurisé : jamais d'innerHTML --------
  const URL_RE = /https?:\/\/[^\s<>"']+/g;

  function appendText(parent, text) {
    // les "**" orphelins ne doivent jamais rester visibles
    const clean = text.replace(/\*\*/g, "");
    if (clean) parent.appendChild(document.createTextNode(clean));
  }

  function appendLinkified(parent, text) {
    let last = 0;
    let m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text)) !== null) {
      let url = m[0];
      let trailing = "";
      const t = url.match(/[.,;:!?)\]]+$/);
      if (t) { trailing = t[0]; url = url.slice(0, -trailing.length); }
      appendText(parent, text.slice(last, m.index));
      if (url.length > 8) {
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = url;
        parent.appendChild(a);
      } else {
        appendText(parent, url);
      }
      appendText(parent, trailing);
      last = m.index + m[0].length;
    }
    appendText(parent, text.slice(last));
  }

  function renderRich(target, text) {
    const re = /\*\*([\s\S]+?)\*\*/g;
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      appendLinkified(target, text.slice(last, m.index));
      const strong = document.createElement("strong");
      appendLinkified(strong, m[1]);
      target.appendChild(strong);
      last = m.index + m[0].length;
    }
    appendLinkified(target, text.slice(last));
  }

  function addMessage(role, content) {
    const welcome = document.getElementById("ai-welcome");
    if (welcome) welcome.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    const text = String(content == null ? "" : content);
    if (role.indexOf("assistant") !== -1 && role.indexOf("thinking") === -1) {
      renderRich(div, text);
    } else {
      div.textContent = text;
    }
    messagesEl.appendChild(div);
    // Vraie réponse de MAJESTÉ uniquement : ni « réfléchit... », ni message utilisateur, ni notice d'erreur.
    if (role.indexOf("assistant") !== -1 && role.indexOf("thinking") === -1 && role.indexOf("notice") === -1) {
      attachWordButton(div, text);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  // Conserve le texte brut sur la bulle et ajoute les boutons Word + PDF juste dessous.
  function attachWordButton(bubble, text) {
    bubble.dataset.rawText = text;
    const next = bubble.nextElementSibling;
    if (next && next.classList.contains("msg-actions")) return; // déjà présents
    const row = document.createElement("div");
    row.className = "msg-actions";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "word-btn";
    btn.textContent = "📄 Word";
    btn.title = "Télécharger cette réponse en Word";
    btn.setAttribute("aria-label", "Télécharger cette réponse en Word");
    btn.addEventListener("click", () => downloadMessageAsWord(bubble, btn));
    row.appendChild(btn);

    const pdfBtn = document.createElement("button");
    pdfBtn.type = "button";
    pdfBtn.className = "pdf-btn";
    pdfBtn.textContent = "📕 PDF";
    pdfBtn.title = "Télécharger cette réponse en PDF";
    pdfBtn.setAttribute("aria-label", "Télécharger cette réponse en PDF");
    pdfBtn.addEventListener("click", () => downloadMessageAsPdf(bubble, pdfBtn));
    row.appendChild(pdfBtn);

    bubble.after(row);
  }

  // -------- Export Word (.docx) --------
  // La bibliothèque « docx » n'est chargée qu'au premier clic, jamais au chargement de la page.
  const DOCX_URL = "https://cdn.jsdelivr.net/npm/docx@8/build/index.umd.js"; // docx@8 : le point d'entrée est index.umd.js (pas index.js)
  let docxPromise = null;

  function loadDocx() {
    if (window.docx) return Promise.resolve(window.docx);
    if (docxPromise) return docxPromise;
    docxPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = DOCX_URL;
      script.onload = () => {
        if (window.docx) resolve(window.docx);
        else { docxPromise = null; reject(new Error("docx indisponible")); }
      };
      script.onerror = () => {
        script.remove();
        docxPromise = null; // un clic ultérieur pourra réessayer
        reject(new Error("docx non chargé"));
      };
      document.head.appendChild(script);
    });
    return docxPromise;
  }

  // Même esprit que renderRich/appendLinkified : **gras** et URL (vrai lien hypertexte).
  function wordRuns(docx, line) {
    const FONT = { ascii: "Arial", hAnsi: "Arial", cs: "Arial", eastAsia: "Arial" };
    const SIZE = 24; // 12 pt
    const runs = [];

    function pushText(text, bold) {
      const clean = text.replace(/\*\*/g, "");
      if (clean) runs.push(new docx.TextRun({ text: clean, bold: bold, font: FONT, size: SIZE }));
    }

    function pushLinkified(text, bold) {
      let last = 0;
      let m;
      URL_RE.lastIndex = 0;
      while ((m = URL_RE.exec(text)) !== null) {
        let url = m[0];
        let trailing = "";
        const t = url.match(/[.,;:!?)\]]+$/);
        if (t) { trailing = t[0]; url = url.slice(0, -trailing.length); }
        pushText(text.slice(last, m.index), bold);
        if (url.length > 8) {
          runs.push(new docx.ExternalHyperlink({
            link: url,
            children: [new docx.TextRun({ text: url, bold: bold, font: FONT, size: SIZE, color: "0563C1", underline: {} })]
          }));
        } else {
          pushText(url, bold);
        }
        pushText(trailing, bold);
        last = m.index + m[0].length;
      }
      pushText(text.slice(last), bold);
    }

    const re = /\*\*([\s\S]+?)\*\*/g;
    let last = 0;
    let m;
    while ((m = re.exec(line)) !== null) {
      pushLinkified(line.slice(last, m.index), false);
      pushLinkified(m[1], true);
      last = m.index + m[0].length;
    }
    pushLinkified(line.slice(last), false);
    return runs;
  }

  function wordFileName() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return "Echange_MAJESTE_" + pad(d.getDate()) + "-" + pad(d.getMonth() + 1) + "-" + d.getFullYear() + ".docx";
  }

  // Question de l'utilisateur = bulle "user" juste avant la bulle assistant (sinon : pas de question).
  function questionTextFor(bubble) {
    const prev = bubble.previousElementSibling;
    return prev && prev.classList.contains("user") ? (prev.textContent || "").trim() : "";
  }

    const pad = (n) => String(n).padStart(2, "0");

  async function downloadMessageAsWord(bubble, btn) {
    const raw = bubble && bubble.dataset ? bubble.dataset.rawText : "";
    if (!raw || !raw.trim()) return; // ne devrait jamais arriver : on ignore sans rien afficher

    if (btn) btn.disabled = true;
    let docx;
    try {
      docx = await loadDocx();
    } catch (err) {
      console.error(err);
      if (btn) btn.disabled = false;
      window.alert("Impossible de charger le générateur Word. Vérifiez votre connexion.");
      return;
    }

    try {
      const FONT = { ascii: "Arial", hAnsi: "Arial", cs: "Arial", eastAsia: "Arial" };

      // Une ligne non vide = un paragraphe ; la 1re ligne du bloc porte le label en gras.
      const blockParagraphs = (text, label, afterLast) => {
        const lines = text.split("\n").filter((line) => line.trim());
        return lines.map((line, i) => new docx.Paragraph({
          children: (i === 0 ? [new docx.TextRun({ text: label + " ", bold: true, font: FONT, size: 24 })] : [])
            .concat(wordRuns(docx, line)),
          spacing: { after: i === lines.length - 1 ? afterLast : 120 }
        }));
      };

      const question = questionTextFor(bubble);
      const paragraphs = []
        .concat(question ? blockParagraphs(question, "Vous :", 360) : [])   // espace visuel avant la réponse
        .concat(blockParagraphs(raw, "MAJESTÉ :", 120));

      // Mention de non-engagement : 8 pt, grise, séparée du contenu.
      paragraphs.push(new docx.Paragraph({
        children: [new docx.TextRun({ text: exportNoticeText(), font: FONT, size: 16, color: "808080" })],
        spacing: { before: 480 }
      }));

      const doc = new docx.Document({
        styles: { default: { document: { run: { font: { ascii: "Arial", hAnsi: "Arial", cs: "Arial", eastAsia: "Arial" }, size: 24 } } } },
        sections: [{ children: paragraphs }]
      });

      const blob = await docx.Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = wordFileName();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (err) {
      console.error(err);
      window.alert("Impossible de générer le document Word.");
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  // -------- Export PDF --------
  // jsPDF n'est chargé qu'au premier clic sur « PDF », jamais au chargement de la page.
  // Police : jsPDF n'embarque pas Arial ; on utilise Helvetica (police PDF standard, métriques identiques à Arial).
  const JSPDF_URL = "https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js";
  let jspdfPromise = null;
  let pdfBusy = false;

  function loadJsPdf() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf);
    if (jspdfPromise) return jspdfPromise;
    jspdfPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = JSPDF_URL;
      script.onload = () => {
        if (window.jspdf && window.jspdf.jsPDF) resolve(window.jspdf);
        else { jspdfPromise = null; reject(new Error("jsPDF indisponible")); }
      };
      script.onerror = () => {
        script.remove();
        jspdfPromise = null; // un clic ultérieur pourra réessayer
        reject(new Error("jsPDF non chargé"));
      };
      document.head.appendChild(script);
    });
    return jspdfPromise;
  }

  // Helvetica (WinAnsi) n'affiche que Latin-1 + quelques signes ; tout autre caractère (emoji...)
  // corromprait la ligne entière, on le retire ou on le remplace.
  function pdfSafeText(text) {
    return String(text)
      .replace(/\r\n?/g, "\n")
      .replace(/[\u00A0\u202F\u2009\u200A]/g, " ")
      .replace(/\t/g, " ")
      .replace(/\u2192/g, "->").replace(/\u2190/g, "<-")
      .replace(/\u2265/g, ">=").replace(/\u2264/g, "<=").replace(/\u2260/g, "!=")
      // \n est conservé : il sépare les paragraphes
      .replace(/[^\n\x20-\x7E\xA1-\xFF\u20AC\u201A\u0192\u201E\u2026\u2020\u2021\u02C6\u2030\u0160\u2039\u0152\u017D\u2018\u2019\u201C\u201D\u2022\u2013\u2014\u02DC\u2122\u0161\u203A\u0153\u017E\u0178]/g, "")
      .replace(/\xAD/g, "");
  }

  // Une ligne -> mots {text, bold, url, space} (mêmes règles que wordRuns : **gras** et URL_RE).
  function pdfAtoms(line) {
    const atoms = [];
    let pendingSpace = false;

    function pushText(text, bold) {
      text.replace(/\*\*/g, "").split(/(\s+)/).forEach((part) => {
        if (!part) return;
        if (/^\s+$/.test(part)) { pendingSpace = true; return; }
        atoms.push({ text: part, bold: bold, url: null, space: pendingSpace && atoms.length > 0 });
        pendingSpace = false;
      });
    }

    function pushLinkified(text, bold) {
      let last = 0;
      let m;
      URL_RE.lastIndex = 0;
      while ((m = URL_RE.exec(text)) !== null) {
        let url = m[0];
        let trailing = "";
        const t = url.match(/[.,;:!?)\]]+$/);
        if (t) { trailing = t[0]; url = url.slice(0, -trailing.length); }
        pushText(text.slice(last, m.index), bold);
        if (url.length > 8) {
          atoms.push({ text: url, bold: bold, url: url, space: pendingSpace && atoms.length > 0 });
          pendingSpace = false;
        } else {
          pushText(url, bold);
        }
        pushText(trailing, bold);
        last = m.index + m[0].length;
      }
      pushText(text.slice(last), bold);
    }

    const re = /\*\*([\s\S]+?)\*\*/g;
    let last = 0;
    let m;
    while ((m = re.exec(line)) !== null) {
      pushLinkified(line.slice(last, m.index), false);
      pushLinkified(m[1], true);
      last = m.index + m[0].length;
    }
    pushLinkified(line.slice(last), false);
    return atoms;
  }

  function buildPdf(jsPDF, raw, question) {
    const MARGIN = 20;                 // mm, 4 côtés
    const PAGE_W = 210, PAGE_H = 297;  // A4 portrait
    const USABLE = PAGE_W - 2 * MARGIN;
    const FONT_PT = 12;
    const LINE_H = 6;                  // mm (~17 pt pour du 12 pt)
    const PARA_GAP = 2;                // mm
    const BASELINE0 = MARGIN + 4.2;    // première ligne de base sous la marge haute
    const LAST_BASELINE = PAGE_H - MARGIN - 1.2;

    const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    doc.setFontSize(FONT_PT);
    doc.setTextColor(0, 0, 0);

    const setStyle = (bold) => doc.setFont("helvetica", bold ? "bold" : "normal");
    let y = BASELINE0;
    let paragraphs = 0;

    function newLineIfNeeded() {
      if (y > LAST_BASELINE) { doc.addPage(); y = BASELINE0; }
    }

    function drawLine(runs) {
      newLineIfNeeded();
      let x = MARGIN;
      runs.forEach((run) => {
        setStyle(run.bold);
        const w = doc.getTextWidth(run.text);
        if (run.url) {
          doc.setTextColor(5, 99, 193);
          doc.textWithLink(run.text, x, y, { url: run.url });
          doc.setDrawColor(5, 99, 193);
          doc.setLineWidth(0.2);
          doc.line(x, y + 0.7, x + w, y + 0.7);
          doc.setTextColor(0, 0, 0);
        } else {
          doc.text(run.text, x, y);
        }
        x += w;
      });
      y += LINE_H;
    }

    // Un bloc (question ou réponse) : une ligne non vide = un paragraphe ; la 1re porte le label en gras.
    function writeBlock(text, label, gapAfter) {
    pdfSafeText(text).split("\n").filter((l) => l.trim()).forEach((line, index) => {
      const atoms = pdfAtoms(line);
      if (!atoms.length) return;
      if (index === 0) {
        atoms.unshift({ text: label, bold: true, url: null, space: false });
        atoms[1].space = true;
      }
      paragraphs++;

      let runs = [];
      let lineW = 0;

      function flush() {
        if (!runs.length) return;
        const last = runs[runs.length - 1];
        if (!last.url) last.text = last.text.replace(/\s+$/, ""); // pas d'espace en fin de ligne
        drawLine(runs);
        runs = [];
        lineW = 0;
      }

      function place(atom, withSpace) {
        setStyle(atom.bold);
        const spaceW = withSpace ? doc.getTextWidth(" ") : 0;
        const wordW = doc.getTextWidth(atom.text);
        if (runs.length && lineW + spaceW + wordW > USABLE) { flush(); withSpace = false; }

        const prev = runs[runs.length - 1];
        if (withSpace && prev && !prev.url && !atom.url && prev.bold === atom.bold) {
          prev.text += " " + atom.text;                       // même style : un seul bloc de texte
        } else {
          if (withSpace && prev && !prev.url) prev.text += " ";  // l'espace reste dans le bloc précédent
          else if (withSpace) runs.push({ text: " ", bold: false, url: null }); // après un lien
          runs.push({ text: atom.text, bold: atom.bold, url: atom.url });
        }
        lineW += (withSpace ? spaceW : 0) + wordW;
      }

      atoms.forEach((atom) => {
        setStyle(atom.bold);
        if (doc.getTextWidth(atom.text) <= USABLE) { place(atom, atom.space); return; }
        // mot plus large que la ligne (longue URL) : découpé par splitTextToSize
        doc.splitTextToSize(atom.text, USABLE - 2).forEach((piece, i) => { // -2 mm : splitTextToSize déborde parfois de ~1 mm
          if (i > 0 || (runs.length && !atom.space)) flush();
          place({ text: piece, bold: atom.bold, url: atom.url }, i === 0 && atom.space);
        });
      });
      flush();
      y += PARA_GAP;
    });
    if (paragraphs) y += gapAfter;
    }

    if (question) writeBlock(question, "Vous :", 6);   // espace visuel avant la réponse
    writeBlock(raw, "MAJESTÉ :", 0);

    if (!paragraphs) return null;

    // Mention de non-engagement : 8 pt, grise, séparée du contenu, jamais coupée entre deux pages.
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    const noticeLines = doc.splitTextToSize(pdfSafeText(exportNoticeText()), USABLE - 1);
    const NOTICE_LINE_H = 3.6;
    y += 8;
    if (y + (noticeLines.length - 1) * NOTICE_LINE_H > LAST_BASELINE) { doc.addPage(); y = BASELINE0; }
    doc.setTextColor(128, 128, 128);
    noticeLines.forEach((l) => { doc.text(l, MARGIN, y); y += NOTICE_LINE_H; });
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(FONT_PT);

    return doc;
  }

  function pdfFileName() {
    return wordFileName().replace(/\.docx$/, ".pdf");
  }

  async function downloadMessageAsPdf(bubble, btn) {
    const raw = bubble && bubble.dataset ? bubble.dataset.rawText : "";
    if (!raw || !raw.trim()) return; // ignoré sans rien afficher
    if (pdfBusy) return;             // pas de générations simultanées

    pdfBusy = true;
    if (btn) btn.disabled = true;
    try {
      let lib;
      try {
        lib = await loadJsPdf();
      } catch (err) {
        console.error(err);
        window.alert("Impossible de charger le générateur PDF. Vérifiez votre connexion.");
        return;
      }

      try {
        const doc = buildPdf(lib.jsPDF, raw, questionTextFor(bubble));
        if (!doc) return; // rien d'exportable (ex. uniquement des emojis)
        const url = URL.createObjectURL(doc.output("blob"));
        const a = document.createElement("a");
        a.href = url;
        a.download = pdfFileName();
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      } catch (err) {
        console.error(err);
        window.alert("Impossible de générer le document PDF.");
      }
    } finally {
      pdfBusy = false;
      if (btn) btn.disabled = false;
    }
  }

  // -------- Lecture du flux NDJSON de /api/chat --------
  // Ne lève jamais d'exception : tout échec affiche ERROR_TEXT dans la bulle.
  async function streamReply(response, bubble) {
    let gotDelta = false;
    let outcome = null; // "done" | "error"
    let finalReply = null;

    function showError() {
      bubble.className = "msg assistant";
      bubble.textContent = ERROR_TEXT;
      outcome = "error";
    }

    function handleLine(line) {
      line = line.trim();
      if (!line || outcome) return;
      const evt = JSON.parse(line);
      if (evt.type === "delta" && typeof evt.text === "string") {
        if (!gotDelta) {
          // premier fragment : on quitte l'indicateur « réfléchit... »
          gotDelta = true;
          bubble.className = "msg assistant";
          bubble.textContent = "";
        }
        // texte BRUT uniquement : un **gras** ou une URL peut être coupé entre deux fragments
        bubble.appendChild(document.createTextNode(evt.text));
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (evt.type === "done" && typeof evt.reply === "string") {
        bubble.className = "msg assistant";
        bubble.textContent = "";
        renderRich(bubble, evt.reply); // rendu final : liens cliquables + gras
        attachWordButton(bubble, evt.reply); // texte brut conservé + bouton Word (streamReply n'appelle pas addMessage)
        messagesEl.scrollTop = messagesEl.scrollHeight;
        finalReply = evt.reply;
        outcome = "done";
      } else if (evt.type === "error") {
        showError();
      }
    }

    try {
      if (!response.body) throw new Error("Flux indisponible");
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (!outcome) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n"); // une ligne JSON par \n (pas \n\n comme en SSE)
        buffer = lines.pop();
        for (const line of lines) handleLine(line);
      }
      if (!outcome) {
        buffer += decoder.decode();
        handleLine(buffer);
      } else {
        try { await reader.cancel(); } catch (e) { /* flux déjà terminé */ }
      }
    } catch (err) {
      console.error(err);
      if (outcome !== "done") showError();
    }

    // Flux terminé sans ligne "done" ni "error" : échec.
    if (!outcome) showError();

    // Texte final nettoyé en cas de succès, null sinon (utilisé par le mode vocal).
    return outcome === "done" ? finalReply : null;
  }

  // -------- Envoi d'un message --------
  // Renvoie le texte final de la réponse, ou null en cas d'échec (ignoré par les envois texte).
  async function sendMessage(text) {
    text = String(text || "").trim();
    if (!text || sending) return null;

    addMessage("user", text);
    sending = true;
    updateSendState();

    const thinkingEl = addMessage("assistant thinking", "MAJESTÉ réfléchit...");
    let result = null;

    try {
      const { headers } = await authHeaders({ "Content-Type": "application/json" });
      const response = await fetch(API + "/api/chat", {
        method: "POST",
        headers,
        body: JSON.stringify({ message: text, conversationId: conversationId || null })
      });

      const contentType = response.headers.get("content-type") || "";

      // X-Conversation-Id est présent dès les en-têtes, dans les deux familles de réponse.
      const newId = response.headers.get("X-Conversation-Id");
      if (newId) conversationId = newId;

      if (contentType.indexOf("application/x-ndjson") !== -1) {
        // Flux NDJSON : statut toujours 200, seule la dernière ligne (done/error) fait foi.
        result = await streamReply(response, thinkingEl);
      } else {
        // application/json : échecs détectés avant l'envoi (vrai code HTTP d'erreur).
        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        if (typeof data.reply !== "string") throw new Error("Réponse invalide : reply manquant");
        thinkingEl.remove();
        addMessage("assistant", data.reply);
        result = data.reply;
      }
    } catch (err) {
      console.error(err);
      thinkingEl.remove();
      addMessage("assistant notice", ERROR_TEXT);
      result = null;
    } finally {
      sending = false;
      updateSendState();
    }
    return result;
  }

  composer.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sending) return;
    input.value = "";
    autoGrow();
    updateSendState();
    sendMessage(text);
  });

  // Entrée = nouvelle ligne (mobile) ; seul le bouton ➤ envoie.
  function updateSendState() {
    sendBtn.disabled = sending || !input.value.trim();
  }

  // -------- Zone de texte extensible (vers le haut, comme WhatsApp) --------
  function autoGrow() {
    // Champ vide : on revient à la hauteur CSS (1 ligne) ; le placeholder
    // ne doit pas gonfler scrollHeight.
    if (!input.value) { input.style.height = ""; return; }
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 108) + "px";
  }
  input.addEventListener("input", () => { autoGrow(); updateSendState(); });

  // -------- Nouvelle conversation --------
  newChatBtn.addEventListener("click", () => {
    historyToken++;
    conversationId = null;
    resetMessages();
    showGreeting();
    closeHistory();
  });

  // -------- Historique --------
  function formatDate(value) {
    const d = new Date(value);
    if (!value || isNaN(d.getTime())) return "";
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((startOf(new Date()) - startOf(d)) / 86400000);
    if (days === 0) return "aujourd'hui";
    if (days === 1) return "hier";
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  }

  function openHistory() {
    historyOverlay.classList.add("open");
    historyPanel.classList.add("open");
    historyPanel.setAttribute("aria-hidden", "false");
    loadHistory();
  }

  function closeHistory() {
    historyOverlay.classList.remove("open");
    historyPanel.classList.remove("open");
    historyPanel.setAttribute("aria-hidden", "true");
  }

  historyBtn.addEventListener("click", openHistory);
  historyClose.addEventListener("click", closeHistory);
  historyOverlay.addEventListener("click", closeHistory);

  function setListMessage(text, withLoginLink) {
    historyList.textContent = "";
    const div = document.createElement("div");
    div.className = "hist-empty";
    div.appendChild(document.createTextNode(text));
    if (withLoginLink) {
      div.appendChild(document.createElement("br"));
      const a = document.createElement("a");
      a.href = LOGIN_URL;
      a.textContent = "Se connecter";
      div.appendChild(a);
    }
    historyList.appendChild(div);
  }

  async function loadHistory() {
    const token = ++historyToken;
    const { headers, hasSession } = await authHeaders({});
    if (!hasSession) {
      setListMessage("Connectez-vous pour conserver votre historique", true);
      return;
    }
    setListMessage("Chargement...", false);
    try {
      const res = await fetch(API + "/api/chat/history", { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.conversations)) throw new Error("Réponse invalide : conversations manquant");
      const items = data.conversations;
      if (token !== historyToken) return;
      renderHistory(items);
    } catch (err) {
      console.error(err);
      if (token === historyToken) setListMessage(ERROR_TEXT, false);
    }
  }

  function renderHistory(items) {
    historyList.textContent = "";
    if (!items.length) { setListMessage("Aucune conversation pour le moment.", false); return; }

    items.forEach((conv) => {
      if (!conv || conv.id == null) return;
      const row = document.createElement("div");
      row.className = "hist-item" + (String(conv.id) === String(conversationId) ? " current" : "");

      const open = document.createElement("button");
      open.type = "button";
      open.className = "hist-open";
      const title = document.createElement("span");
      title.className = "hist-title";
      title.textContent = conv.title || "Conversation";
      const date = document.createElement("span");
      date.className = "hist-date";
      date.textContent = formatDate(conv.updated_at);
      open.appendChild(title);
      open.appendChild(date);
      open.addEventListener("click", () => openConversation(conv.id));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "hist-del";
      del.title = "Supprimer";
      del.setAttribute("aria-label", "Supprimer la conversation");
      del.textContent = "🗑";
      del.addEventListener("click", () => deleteConversation(conv.id, row));

      row.appendChild(open);
      row.appendChild(del);
      historyList.appendChild(row);
    });
  }

  async function openConversation(id) {
    try {
      const { headers } = await authHeaders({});
      const res = await fetch(API + "/api/chat/history/" + encodeURIComponent(id), { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.messages)) throw new Error("Réponse invalide : messages manquant");
      const msgs = data.messages;
      conversationId = id;
      resetMessages();
      msgs.forEach((m) => {
        addMessage(m.role === "user" ? "user" : "assistant", m.content);
      });
      if (!messagesEl.childElementCount) showGreeting();
      closeHistory();
    } catch (err) {
      console.error(err);
      addMessage("assistant notice", ERROR_TEXT);
      closeHistory();
    }
  }

  async function deleteConversation(id, row) {
    if (!window.confirm("Supprimer cette conversation ?")) return;
    try {
      const { headers } = await authHeaders({});
      const res = await fetch(API + "/api/chat/history/" + encodeURIComponent(id), { method: "DELETE", headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      row.remove();
      if (String(id) === String(conversationId)) conversationId = null;
      if (!historyList.childElementCount) setListMessage("Aucune conversation pour le moment.", false);
    } catch (err) {
      console.error(err);
      window.alert(ERROR_TEXT);
    }
  }

  // -------- Conversation vocale mains libres --------
  // Un seul état actif à la fois : listening -> thinking -> speaking -> listening...
  // Réutilise sendMessage() (donc streamReply, conversationId, historique) sans le dupliquer.
  const voiceBtn = document.getElementById("voice-btn");
  const voiceOverlay = document.getElementById("voice-overlay");
  const voiceIcon = document.getElementById("voice-icon");
  const voiceStatus = document.getElementById("voice-status");
  const voiceStop = document.getElementById("voice-stop");

  const VOICE_STATES = {
    listening: { icon: "🎤", text: "Je vous écoute..." },
    thinking: { icon: "🧠", text: "MAJESTÉ réfléchit..." },
    speaking: { icon: "🔊", text: "MAJESTÉ parle..." },
    paused: { icon: "⏸️", text: "En pause" }
  };
  const VOICE_ERROR_SPOKEN = "Une erreur est survenue.";
  const SPEAK_CHUNK_MAX = 180;

  let voiceActive = false;
  let voicePhase = null;     // "listening" | "thinking" | "speaking"
  let voicePaused = false;   // page en arrière-plan
  let voiceRun = 0;          // invalide les callbacks d'un tour abandonné
  let recognition = null;
  let speakToken = 0;
  let pendingSpeak = null;   // réponse arrivée pendant l'arrière-plan
  let selectedVoice = null;  // voix choisie par pickVoice() ; null = voix par défaut du navigateur
  let voiceSelectionStarted = false;

  function getSpeechRecognition() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
  }

  function setVoiceState(state) {
    const view = VOICE_STATES[state];
    voiceOverlay.setAttribute("data-state", state);
    voiceIcon.textContent = view.icon;
    voiceStatus.textContent = view.text;
  }

  function setVoicePhase(phase) {
    voicePhase = phase;
    if (!voicePaused) setVoiceState(phase);
  }

  // Version « parlable » du texte (jamais utilisée pour l'affichage écrit).
  // Heuristique IMPARFAITE : le serveur ne transmet pas de marqueur de bloc de code,
  // on repère donc une ligne de code à sa densité de symboles (accolades, ;, (), =, <>...).
  // Elle peut se tromper dans les deux sens (code lu à voix haute, ou phrase prise pour du code).
  function looksLikeCode(line) {
    const compact = line.replace(/\s/g, "");
    if (!compact) return false;
    const symbols = (compact.match(/[{}()\[\];=<>$|&\\]/g) || []).length;
    if (/[{}()\[\];=<>]/.test(compact) && !/[A-Za-zÀ-ÿ0-9]/.test(compact)) return true; // ex. "});" ou "}"
    return symbols >= 3 && symbols / compact.length >= 0.12;
  }

  function toSpeakable(text) {
    // Prononciation (lecture uniquement, l'affichage écrit garde ses majuscules) :
    // 1) FCFA -> « francs CFA » (très fréquent, doit être fiable) ;
    // 2) toute suite de 2 majuscules ou plus (accents compris) -> casse normale, pour que la
    //    synthèse lise un mot (« Majesté ») et non un sigle épelé. « CFA » reste en majuscules
    //    après « franc(s) », car il se dit bien lettre par lettre.
    text = String(text)
      .replace(/\bFCFA\b/gi, "francs CFA")
      .replace(/(?<!francs? )(?<!\p{Lu})\p{Lu}{2,}/gu, (w) => w.charAt(0) + w.slice(1).toLowerCase());

    return text
      .split("\n")
      .map((line) => {
        if (/^\s*```/.test(line)) return "";                       // clôture de bloc : ignorée
        if (looksLikeCode(line)) return "un extrait de code";
        return line.replace(URL_RE, "un lien").replace(/\*\*/g, ""); // URL -> « un lien », pas d'astérisques
      })
      .filter((line) => line.trim())
      .join("\n");
  }

  // Voix : les voix se chargent de façon asynchrone sur Chrome ; filet de sécurité de 1500 ms.
  function loadVoices() {
    return new Promise((resolve) => {
      const synth = window.speechSynthesis;
      const read = () => { try { return synth.getVoices() || []; } catch (e) { return []; } };
      const first = read();
      if (first.length) { resolve(first); return; }

      let settled = false;
      let timer = null;
      const finish = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        synth.onvoiceschanged = null;
        resolve(read()); // même vide : on ne bloque jamais
      };
      synth.onvoiceschanged = finish;
      timer = setTimeout(finish, 1500);
    });
  }

  // Cascade qui ne peut jamais « ne rien trouver » : timbre masculin -> autre voix française
  // que la voix par défaut -> null (comportement d'origine, aucune voix précisée).
  // Le genre n'existe pas dans l'API Web Speech : on le déduit du NOM de la voix, heuristique imparfaite.
  const MALE_VOICE_HINT = /\b(male|masculin|homme|paul|thomas|nicolas|henri|antoine|mathieu|daniel|pierre|jean|louis|bruno|julien|olivier|guillaume)\b/i;

  function pickVoice(voices) {
    const lang = (v) => String(v.lang || "").replace("_", "-").toLowerCase(); // Android : "fr_FR"
    const french = (voices || []).filter((v) => lang(v).indexOf("fr") === 0);
    if (!french.length) return null;

    // fr-FR d'abord, puis fr-CA, fr-BE, fr-CH...
    const ordered = french.filter((v) => lang(v).indexOf("fr-fr") === 0)
      .concat(french.filter((v) => lang(v).indexOf("fr-fr") !== 0));

    const male = ordered.find((v) => MALE_VOICE_HINT.test(v.name || ""));
    if (male) return male;

    if (ordered.length > 1) return ordered.find((v) => !v.default) || null;
    return null;
  }

  // Découpe en morceaux (Chrome coupe parfois les lectures longues).
  function splitForSpeech(text) {
    const sentences = text.split(/(?<=[.!?…\n])\s+/);
    const chunks = [];
    let cur = "";
    sentences.forEach((sentence) => {
      if (cur && (cur + " " + sentence).length > SPEAK_CHUNK_MAX) { chunks.push(cur); cur = sentence; }
      else cur = cur ? cur + " " + sentence : sentence;
    });
    if (cur.trim()) chunks.push(cur);
    return chunks;
  }

  function stopSpeaking() {
    speakToken++; // les callbacks des utterances en cours deviennent sans effet
    try { window.speechSynthesis.cancel(); } catch (e) { /* ignoré */ }
  }

  function stopListening() {
    if (!recognition) return;
    const rec = recognition;
    recognition = null; // ses callbacks deviennent sans effet (aucune erreur visible)
    try { rec.abort(); } catch (e) { /* déjà arrêtée */ }
  }

  function closeVoice(message) {
    voiceActive = false;
    voicePhase = null;
    voicePaused = false;
    pendingSpeak = null;
    voiceRun++;
    stopListening();
    stopSpeaking();
    voiceOverlay.classList.remove("open");
    if (message) addMessage("assistant notice", message);
  }

  // PAROLE : le micro reste coupé pendant toute la lecture (pas d'interruption vocale).
  function speakText(text) {
    if (!voiceActive) return;
    const run = voiceRun;
    setVoicePhase("speaking");
    stopListening();

    const chunks = splitForSpeech(text);
    const token = ++speakToken;
    let i = 0;

    function next() {
      if (token !== speakToken || run !== voiceRun || !voiceActive) return;
      if (i >= chunks.length) { startListening(); return; } // fin naturelle -> réécoute
      const u = new SpeechSynthesisUtterance(chunks[i++]);
      u.lang = "fr-FR";
      if (selectedVoice) u.voice = selectedVoice; // sinon : voix par défaut, comme avant
      u.onend = next;
      u.onerror = (e) => {
        if (e && (e.error === "interrupted" || e.error === "canceled")) return;
        next();
      };
      try {
        window.speechSynthesis.speak(u);
      } catch (err) {
        console.error(err); // synthèse indisponible : on passe au morceau suivant, puis à la réécoute
        next();
      }
    }

    if (!chunks.length) { startListening(); return; }
    next();
  }

  // RÉFLEXION : micro coupé, même chemin d'envoi qu'un message tapé.
  async function handleTranscript(text) {
    if (!voiceActive) return;
    const run = voiceRun;
    setVoicePhase("thinking");
    stopListening();

    const reply = await sendMessage(text);
    if (!voiceActive || run !== voiceRun) return;

    const spoken = reply == null ? VOICE_ERROR_SPOKEN : toSpeakable(reply);
    if (voicePaused) { pendingSpeak = spoken; return; } // lu au retour au premier plan
    speakText(spoken);
  }

  // ÉCOUTE : un tour = une écoute (continuous:false), relancée automatiquement.
  function startListening() {
    if (!voiceActive || voicePaused) return;
    const SR = getSpeechRecognition();
    if (!SR) { closeVoice("La conversation vocale n'est pas disponible sur ce navigateur."); return; }

    stopListening();
    setVoicePhase("listening");

    const rec = new SR();
    recognition = rec;
    rec.lang = "fr-FR";
    rec.continuous = false;
    rec.interimResults = false;

    let transcript = "";
    let gotFinal = false;
    let errorCode = null;

    rec.onresult = (e) => {
      if (recognition !== rec) return;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) { transcript += e.results[i][0].transcript; gotFinal = true; }
      }
      if (gotFinal) {
        recognition = null;
        try { rec.stop(); } catch (err) { /* ignoré */ }
        const text = transcript.trim();
        if (text) handleTranscript(text);
        else startListening();
      }
    };

    rec.onerror = (e) => {
      if (recognition !== rec) return;
      errorCode = (e && e.error) || "unknown";
      if (errorCode === "no-speech" || errorCode === "aborted") return; // onend relance l'écoute
      // Erreur grave (permission refusée, micro absent, réseau...) : on quitte le mode.
      recognition = null;
      const denied = errorCode === "not-allowed" || errorCode === "service-not-allowed";
      closeVoice(denied
        ? "Le micro n'est pas autorisé. Autorisez-le dans les réglages du navigateur pour utiliser la conversation vocale."
        : "La reconnaissance vocale a rencontré un problème. Réessayez dans un instant.");
    };

    rec.onend = () => {
      if (recognition !== rec) return;
      recognition = null;
      if (gotFinal || !voiceActive || voicePaused) return;
      setTimeout(() => { if (voiceActive && voicePhase === "listening") startListening(); }, 250);
    };

    try {
      rec.start();
    } catch (err) {
      console.error(err);
      recognition = null;
      closeVoice("Impossible de démarrer le micro.");
    }
  }

  function openVoice() {
    if (!getSpeechRecognition() || !window.speechSynthesis) {
      window.alert("La conversation vocale n'est pas disponible sur ce navigateur.");
      return;
    }
    if (sending || voiceActive) return;
    if (!voiceSelectionStarted) {
      // une seule fois, en arrière-plan : n'attend pas, la première lecture peut utiliser la voix par défaut
      voiceSelectionStarted = true;
      loadVoices().then((voices) => { selectedVoice = pickVoice(voices); }).catch((err) => console.error(err));
    }
    input.blur();
    voiceActive = true;
    voicePaused = false;
    pendingSpeak = null;
    voiceRun++;
    voiceOverlay.classList.add("open");
    startListening();
  }

  // Arrière-plan : on coupe micro et synthèse sans erreur visible ; on ne réécoute qu'au retour.
  document.addEventListener("visibilitychange", () => {
    if (!voiceActive) return;
    if (document.hidden) {
      voicePaused = true;
      stopListening();
      if (voicePhase === "speaking") { stopSpeaking(); voicePhase = "listening"; } // lecture abandonnée
      if (voicePhase !== "thinking") setVoiceState("paused");
    } else {
      voicePaused = false;
      if (pendingSpeak != null) { const t = pendingSpeak; pendingSpeak = null; speakText(t); return; }
      if (voicePhase === "thinking") { setVoiceState("thinking"); return; } // la réponse arrivera
      startListening();
    }
  });

  voiceBtn.addEventListener("click", openVoice);
  voiceStop.addEventListener("click", () => closeVoice());

  // -------- Mise en page mobile : barre de nav fixe + clavier --------
  const navEl = document.querySelector("nav.bottom-nav");
  const rootStyle = document.documentElement.style;

  function updateNavHeight() {
    if (navEl && !document.body.classList.contains("typing")) {
      rootStyle.setProperty("--nav-h", navEl.offsetHeight + "px");
    }
  }

  function updateViewportHeight() {
    const vv = window.visualViewport;
    if (vv) rootStyle.setProperty("--app-h", vv.height + "px");
    window.scrollTo(0, 0);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  input.addEventListener("focus", () => document.body.classList.add("typing"));
  input.addEventListener("blur", () => {
    document.body.classList.remove("typing");
    updateNavHeight();
  });

  window.addEventListener("resize", updateNavHeight);
  if (window.ResizeObserver && navEl) new ResizeObserver(updateNavHeight).observe(navEl);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", updateViewportHeight);
  // Le composeur est dans le flux de #ai-app : quand il grandit (jusqu'à 4 lignes),
  // la liste des messages rétrécit seule. On garde simplement le bas visible.
  if (window.ResizeObserver) {
    new ResizeObserver(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }).observe(composer);
  }

  updateNavHeight();
  updateViewportHeight();

  showGreeting();

})();
</script>
<script src="pwa-install.js"></script>

</body>
</html>
