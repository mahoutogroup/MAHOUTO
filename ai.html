    const div = document.createElement("div");
    div.className = "hist-empty";
    div.appendChild(document.createTextNode(text));
    if (withLoginLink) {
      div.appendChild(document.createElement("br"));
      const a = document.createElement("a");
      a.href = LOGIN_URL;
      a.textContent = "Se connecter";
      div.appendChild(a);
    }
    historyList.appendChild(div);
  }

  async function loadHistory() {
    const token = ++historyToken;
    const { headers, hasSession } = await authHeaders({});
    if (!hasSession) {
      setListMessage("Connectez-vous pour conserver votre historique", true);
      return;
    }
    setListMessage("Chargement...", false);
    try {
      const res = await fetch(API + "/api/chat/history", { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.conversations)) throw new Error("Réponse invalide : conversations manquant");
      const items = data.conversations;
      if (token !== historyToken) return;
      renderHistory(items);
    } catch (err) {
      console.error(err);
      if (token === historyToken) setListMessage(ERROR_TEXT, false);
    }
  }

  function renderHistory(items) {
    historyList.textContent = "";
    if (!items.length) { setListMessage("Aucune conversation pour le moment.", false); return; }

    items.forEach((conv) => {
      if (!conv || conv.id == null) return;
      const row = document.createElement("div");
      row.className = "hist-item" + (String(conv.id) === String(conversationId) ? " current" : "");

      const open = document.createElement("button");
      open.type = "button";
      open.className = "hist-open";
      const title = document.createElement("span");
      title.className = "hist-title";
      title.textContent = conv.title || "Conversation";
      const date = document.createElement("span");
      date.className = "hist-date";
      date.textContent = formatDate(conv.updated_at);
      open.appendChild(title);
      open.appendChild(date);
      open.addEventListener("click", () => openConversation(conv.id));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "hist-del";
      del.title = "Supprimer";
      del.setAttribute("aria-label", "Supprimer la conversation");
      del.textContent = "🗑";
      del.addEventListener("click", () => deleteConversation(conv.id, row));

      row.appendChild(open);
      row.appendChild(del);
      historyList.appendChild(row);
    });
  }

  async function openConversation(id) {
    try {
      const { headers } = await authHeaders({});
      const res = await fetch(API + "/api/chat/history/" + encodeURIComponent(id), { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.messages)) throw new Error("Réponse invalide : messages manquant");
      const msgs = data.messages;
      conversationId = id;
      resetMessages();
      msgs.forEach((m) => {
        addMessage(m.role === "user" ? "user" : "assistant", m.content);
      });
      if (!messagesEl.childElementCount) showGreeting();
      closeHistory();
    } catch (err) {
      console.error(err);
      addMessage("assistant notice", ERROR_TEXT);
      closeHistory();
    }
  }

  async function deleteConversation(id, row) {
    if (!window.confirm("Supprimer cette conversation ?")) return;
    try {
      const { headers } = await authHeaders({});
      const res = await fetch(API + "/api/chat/history/" + encodeURIComponent(id), { method: "DELETE", headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      row.remove();
      if (String(id) === String(conversationId)) conversationId = null;
      if (!historyList.childElementCount) setListMessage("Aucune conversation pour le moment.", false);
    } catch (err) {
      console.error(err);
      window.alert(ERROR_TEXT);
    }
  }

  // -------- Conversation vocale mains libres --------
  // Un seul état actif à la fois : listening -> thinking -> speaking -> listening...
  // Réutilise sendMessage() (donc streamReply, conversationId, historique) sans le dupliquer.
  //
  // STREAMING VOCAL : en mode vocal, les fragments "delta" du flux NDJSON sont accumulés,
  // coupés en phrases, puis lus l'un après l'autre (voiceSpeakQueue) PENDANT que la suite
  // de la réponse est encore générée. On n'attend jamais la ligne "done" pour commencer à parler.
  const voiceBtn = document.getElementById("voice-btn");
  const voiceOverlay = document.getElementById("voice-overlay");
  const voiceIcon = document.getElementById("voice-icon");
  const voiceStatus = document.getElementById("voice-status");
  const voiceStop = document.getElementById("voice-stop");
  const voiceCut = document.getElementById("voice-cut");
  const voiceBarge = document.getElementById("voice-barge");

  const VOICE_STATES = {
    listening: { icon: "🎤", text: "Je vous écoute..." },
    thinking: { icon: "🧠", text: "MAJESTÉ Pro réfléchit..." },
    speaking: { icon: "🔊", text: "MAJESTÉ Pro parle..." },
    paused: { icon: "⏸️", text: "En pause" }
  };
  const VOICE_ERROR_SPOKEN = "Une erreur est survenue.";
  VOICE_STATES.interrupting = VOICE_STATES.listening; // transitoire : même affichage que l'écoute
  const SPEAK_CHUNK_MAX = 180; // découpe d'une réponse entière reçue sans streaming (voir finishVoiceStream)

  // Découpage en phrases pendant le streaming.
  const VOICE_SENTENCE_MAX = 200;      // longueur maximale de sécurité d'une phrase (caractères)
  const VOICE_FIRST_CLAUSE_MIN = 60;   // toute première phrase : si elle est longue...
  const VOICE_FIRST_CLAUSE_FROM = 40;  // ...on démarre à la première virgule située après ce rang
  const VOICE_TRAILING_FLUSH_MS = 300; // « phrase. » sans suite reçue : lue après ce délai

  // Fiabilité TTS Android/Chrome (voir flushVoiceQueue)
  const TTS_START_WAIT_MS = 800;   // si onstart n'arrive pas : resume(), puis après un 2e délai : relance propre
  const TTS_MIC_RELEASE_MS = 500;  // délai mini entre la FIN réelle de la reconnaissance (onend) et speak()
  const TTS_MIC_WAIT_MAX_MS = 1500; // attente maximale : si onend n'arrive jamais, on parle quand même
  // ---- Interruption vocale (« barge-in ») ---------------------------------------------------
  // STRATÉGIE : pendant que MAJESTÉ parle, une session de reconnaissance parallèle (résultats
  // intermédiaires) est ouverte APRÈS le début réel de la voix. Un texte capté n'interrompt que s'il
  // contient assez de mots « nouveaux » (absents du texte récemment lu) : c'est le filtre anti-écho.
  // Il est HEURISTIQUE et n'élimine pas l'écho (un casque reste la vraie solution). L'API Web Speech
  // ne donne accès ni au flux audio ni à l'annulation d'écho : on ne peut comparer que des textes.
  // Toutes ces valeurs peuvent être surchargées, sans toucher au code, avec
  // window.MAJESTE_VOICE_CONFIG = { bargeMinWords: 3, ... } défini AVANT ce script.
  const VOICE_CFG = Object.assign({
    bargeIn: true,             // interrupteur général (l'utilisateur peut aussi le couper : bouton de l'écran vocal)
    bargeStartDelayMs: 350,    // délai entre le début réel de la voix et l'ouverture du micro (Android : ne pas couper la voix qui démarre)
    bargeRestartDelayMs: 200,  // délai avant de rouvrir le micro quand une session se termine seule pendant la lecture
    bargeQuickFailMs: 500,     // session plus courte que ça, sans aucun résultat = échec
    bargeMaxQuickFails: 3,     // échecs consécutifs avant repli (interruption à la voix désactivée pour la session)
    bargeMinWords: 2,          // mots « nouveaux » (absents du texte lu) nécessaires pour déclarer une intervention
    bargeEchoRatio: 0.6,       // au-delà de cette part de mots déjà lus récemment, le texte capté est de l'écho
    bargeEchoWindowChars: 700, // taille de la fenêtre de texte récemment lu comparée au texte capté
    resumeWaitMaxMs: 700       // attente maximale de la fin d'une session avant d'en rouvrir une
  }, window.MAJESTE_VOICE_CONFIG || {});
  // Mots-commandes : ils déclenchent l'interruption seuls, et ne sont PAS envoyés à l'IA s'ils sont dits seuls.
  const VOICE_COMMAND_WORDS = new Set(["stop", "arrete", "arretes", "pause", "silence", "attends", "attend", "chut"]);
  const BARGE_PREF_KEY = "majeste.voice.bargein"; // "off" = désactivé par l'utilisateur (conservé entre les sessions)

  const TTS_MAX_ATTEMPTS = 3;      // 1 essai normal + 2 relances (la 2e et la 3e sans voix imposée)

  // LOGS DE PERFORMANCE TEMPORAIRES : mettre à false (ou supprimer) une fois la latence réglée.
  const VOICE_DEBUG = true;

  let voiceActive = false;
  let voicePhase = null;     // "listening" | "thinking" | "speaking"
  let voicePaused = false;   // page en arrière-plan
  let voiceWakeLock = null;  // verrou d'écran (Screen Wake Lock) tenu pendant la conversation vocale
  let voiceWakeLockPending = false;
  let voiceRun = 0;          // invalide les callbacks d'une session vocale fermée/rouverte
  let voiceTurn = 0;         // invalide les callbacks d'un tour vocal précédent
  let recognition = null;
  let speakToken = 0;
  let selectedVoice = null;  // voix choisie par pickVoice() ; null = voix par défaut du navigateur
  let ttsInitDone = false;   // écouteur "voiceschanged" posé une seule fois
  let voiceMicStopAt = 0;    // instant du dernier arrêt (puis de la fin réelle) du micro
  let voiceRecEnded = true;  // false entre l'arrêt demandé de la reconnaissance et son événement onend

  // File vocale (un tour = une réponse de MAJESTÉ)
  let voiceSpeakQueue = [];      // phrases prêtes, déjà passées dans toSpeakable()
  let voiceDeltaBuffer = "";     // fragments reçus, pas encore une phrase complète
  let voiceSpeaking = false;     // une phrase est en cours de lecture
  let voiceCurrentText = "";     // phrase en cours de lecture (relue si la page passe en arrière-plan)
  let voiceCurrentUtterance = null; // référence gardée : Chrome peut sinon supprimer l'utterance avant onend
  let voiceStreamDone = false;   // réponse entièrement reçue et tampon vidé
  let voiceTurnOpen = false;     // un tour est en cours (de la fin de la dictée à la réécoute)
  let voiceEnqueuedAny = false;  // au moins une phrase a été mise en file dans ce tour
  let voiceLastEnqueued = "";
  let voiceFlushTimer = null;

  // Interruption vocale
  let recognitionMode = null;     // "listen" | "barge" : mode de la session de reconnaissance en cours
  let voiceRequest = null;        // requête /api/chat du tour vocal : { controller, reader, done, aborted, turn }
  let voiceSpokenLog = [];        // dernières phrases lues (référence du filtre anti-écho)
  let voiceTurnSpoke = false;     // la voix a réellement démarré dans ce tour
  let bargeTimer = null;          // minuteur d'ouverture / de réouverture du micro pendant la lecture
  let bargeInRuntimeOff = false;  // repli automatique pour la session vocale en cours
  let bargeQuickFails = 0;        // sessions d'écoute consécutives mortes-nées pendant la lecture

  // Mesures de performance
  let voiceT0 = 0;               // instant du texte final de la reconnaissance vocale
  let voiceListenStartedAt = 0;  // instant du début de l'écoute
  let voiceTimings = null;
  const VOICE_STAGE_LABELS = { send: "Send start", fetch: "API start", headers: "Response headers" };

  function vlog(label, extra) {
    if (!VOICE_DEBUG) return;
    console.log("[VOICE] " + label + ": " + Math.round(performance.now() - voiceT0) + " ms" + (extra ? " " + extra : ""));
  }

  function tlog(msg) {
    if (VOICE_DEBUG) console.log("[VOICE-TTS] " + msg);
  }

  function getSpeechRecognition() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
  }

  function setVoiceState(state) {
    const view = VOICE_STATES[state];
    voiceOverlay.setAttribute("data-state", state);
    voiceIcon.textContent = view.icon;
    voiceStatus.textContent = view.text;
  }

  // Machine à états du mode vocal (voicePhase ; null = fermé) :
  //   listening -> thinking -> speaking -> listening                 (tour normal)
  //   thinking | speaking -> interrupting -> listening               (interruption : voix ou bouton « Couper »)
  //   n'importe quel état -> fermé                                    (closeVoice)
  // Les transitions inattendues sont journalisées (VOICE_DEBUG) mais JAMAIS refusées : refuser une
  // transition pourrait figer le mode vocal. Les jetons voiceRun / voiceTurn / speakToken invalident
  // les callbacks périmés.
  const VOICE_PHASE_FLOW = {
    closed: ["listening"],
    listening: ["listening", "thinking", "closed"],
    thinking: ["thinking", "speaking", "listening", "interrupting", "closed"],
    speaking: ["speaking", "listening", "interrupting", "closed"],
    interrupting: ["listening", "closed"]
  };

  function setVoicePhase(phase) {
    if (VOICE_DEBUG) {
      const from = voicePhase || "closed";
      if (from !== phase && (VOICE_PHASE_FLOW[from] || []).indexOf(phase) === -1) {
        tlog("unexpected phase transition " + from + " -> " + phase);
      }
    }
    voicePhase = phase;
    if (!voicePaused) setVoiceState(phase);
  }

  // Version « parlable » du texte (jamais utilisée pour l'affichage écrit).
  // Heuristique IMPARFAITE : le serveur ne transmet pas de marqueur de bloc de code,
  // on repère donc une ligne de code à sa densité de symboles (accolades, ;, (), =, <>...).
  // Elle peut se tromper dans les deux sens (code lu à voix haute, ou phrase prise pour du code).
  function looksLikeCode(line) {
    const compact = line.replace(/\s/g, "");
    if (!compact) return false;
    const symbols = (compact.match(/[{}();=<>$|&\\]/g) || []).length;
    if (/[{}();=<>]/.test(compact) && !/[A-Za-zÀ-ÿ0-9]/.test(compact)) return true; // ex. "});" ou "}"
    return symbols >= 3 && symbols / compact.length >= 0.12;
  }

  function toSpeakable(text) {
    // Prononciation (lecture uniquement, l'affichage écrit garde ses majuscules) :
    // 1) FCFA -> « francs CFA » (très fréquent, doit être fiable) ;
    // 2) toute suite de 2 majuscules ou plus (accents compris) -> casse normale, pour que la
    //    synthèse lise un mot (« Majesté ») et non un sigle épelé. « CFA » reste en majuscules
    //    après « franc(s) », car il se dit bien lettre par lettre.
    text = String(text)
      .replace(/\bFCFA\b/gi, "francs CFA")
      .replace(/(?<!francs? )(?<!\p{Lu})\p{Lu}{2,}/gu, (w) => w.charAt(0) + w.slice(1).toLowerCase());

    return text
      .split("\n")
      .map((line) => {
        if (/^\s*```/.test(line)) return "";                       // clôture de bloc : ignorée
        if (looksLikeCode(line)) return "un extrait de code";
        return line.replace(URL_RE, "un lien").replace(/\*\*/g, ""); // URL -> « un lien », pas d'astérisques
      })
      .filter((line) => line.trim())
      .join("\n");
  }

  // Initialisation TTS : vérifie speechSynthesis, lit les voix, écoute "voiceschanged" (chargement
  // tardif sur Android), choisit la voix. Ne bloque jamais : sans voix connue, selectedVoice reste null
  // et speak() utilise la voix par défaut du système avec lang = "fr-FR".
  function initSpeechSynthesis() {
    const synth = window.speechSynthesis;
    if (!synth) { tlog("speechSynthesis NOT available"); return false; }
    tlog("speechSynthesis available");

    const refresh = () => {
      let voices = [];
      try { voices = synth.getVoices() || []; } catch (e) { /* ignoré */ }
      tlog("voices loaded: " + voices.length);
      if (!voices.length) return;
      selectedVoice = pickVoice(voices);
      tlog("selected voice: " + (selectedVoice
        ? selectedVoice.name + " (" + selectedVoice.lang + ", " + (selectedVoice.localService === false ? "network" : "local") + ")"
        : "none -> system default voice with lang fr-FR"));
    };

    if (!ttsInitDone) {
      ttsInitDone = true;
      try { synth.addEventListener("voiceschanged", refresh); } catch (e) { synth.onvoiceschanged = refresh; }
    }
    refresh();
    return true;
  }

  // Cascade qui ne peut jamais « ne rien trouver » : timbre masculin -> autre voix française
  // que la voix par défaut -> null (comportement d'origine, aucune voix précisée).
  // Le genre n'existe pas dans l'API Web Speech : on le déduit du NOM de la voix, heuristique imparfaite.
  const MALE_VOICE_HINT = /\b(male|masculin|homme|paul|thomas|nicolas|henri|antoine|mathieu|daniel|pierre|jean|louis|bruno|julien|olivier|guillaume)\b/i;

  function pickVoice(voices) {
    const lang = (v) => String(v.lang || "").replace("_", "-").toLowerCase(); // Android : "fr_FR"
    const french = (voices || []).filter((v) => lang(v).indexOf("fr") === 0);
    if (!french.length) return null;

    // fr-FR d'abord, puis fr-CA, fr-BE, fr-CH...
    const ordered = french.filter((v) => lang(v).indexOf("fr-fr") === 0)
      .concat(french.filter((v) => lang(v).indexOf("fr-fr") !== 0));

    // Voix locales d'abord : une voix « réseau » indisponible produit un silence total sur Android.
    const local = ordered.filter((v) => v.localService !== false);
    const pool = local.length ? local : ordered;

    const male = pool.find((v) => MALE_VOICE_HINT.test(v.name || ""));
    if (male) return male;

    if (pool.length > 1) return pool.find((v) => !v.default) || null;
    return null;
  }

  // Découpe une réponse ENTIÈRE en morceaux (utilisé seulement si la réponse n'a pas été streamée).
  function splitForSpeech(text) {
    const sentences = text.split(/(?<=[.!?…\n])\s+/);
    const chunks = [];
    let cur = "";
    sentences.forEach((sentence) => {
      if (cur && (cur + " " + sentence).length > SPEAK_CHUNK_MAX) { chunks.push(cur); cur = sentence; }
      else cur = cur ? cur + " " + sentence : sentence;
    });
    if (cur.trim()) chunks.push(cur);
    return chunks;
  }

  function stopSpeaking() {
    speakToken++; // les callbacks des utterances en cours deviennent sans effet
    try { window.speechSynthesis.cancel(); } catch (e) { /* ignoré */ }
  }

  function stopListening() {
    if (!recognition) return;
    const rec = recognition;
    recognition = null; // ses callbacks deviennent sans effet (aucune erreur visible)
    voiceMicStopAt = performance.now();
    voiceRecEnded = false; // remis à true par onend
    try { rec.abort(); } catch (e) { /* déjà arrêtée */ }
  }

  // ---- File vocale ----

  // Vide complètement l'état du tour (file, tampon, minuteur, drapeaux).
  function resetVoiceQueue() {
    clearTimeout(voiceFlushTimer);
    voiceFlushTimer = null;
    clearTimeout(bargeTimer);
    bargeTimer = null;
    voiceSpokenLog = [];
    voiceTurnSpoke = false;
    voiceSpeakQueue = [];
    voiceDeltaBuffer = "";
    voiceSpeaking = false;
    voiceCurrentText = "";
    voiceCurrentUtterance = null;
    voiceStreamDone = false;
    voiceTurnOpen = false;
    voiceEnqueuedAny = false;
    voiceLastEnqueued = "";
  }

  // Nouveau tour vocal : tout callback d'un tour précédent devient sans effet.
  function beginVoiceTurn() {
    voiceTurn++;
    stopSpeaking(); // speakToken++ ET speechSynthesis.cancel() : aucune voix du tour précédent ne survit
    resetVoiceQueue();
    voiceTurnOpen = true;
  }

  // Extrait la première phrase complète du tampon (et la retire du tampon), ou null.
  // Fin de phrase : ! ? … (immédiat) ; . : ; (si suivis d'un espace, pour ne pas couper
  // « 3.5 » ni « https://… ») ; retour à la ligne. Sécurité : longueur maximale.
  function takeVoiceSentence() {
    const buf = voiceDeltaBuffer;

    for (let i = 0; i < buf.length; i++) {
      const ch = buf[i];
      let end = -1;

      if (ch === "\n") {
        end = i;
      } else if (ch === "!" || ch === "?" || ch === "…") {
        end = i;
        while (end + 1 < buf.length && /[!?….»”"')\]]/.test(buf[end + 1])) end++; // « ?! », « !!! », « ?» »
      } else if (ch === "." || ch === ":" || ch === ";") {
        const next = buf[i + 1];
        if (next === undefined) continue;   // on attend le fragment suivant (voir minuteur de pushVoiceDelta)
        if (/\s/.test(next)) end = i;
      }

      if (end < 0) continue;

      const text = buf.slice(0, end + 1).trim();
      if (/^\d{1,3}[.:;]$/.test(text)) continue;   // numérotation de liste « 1. » : on ne coupe pas ici

      voiceDeltaBuffer = buf.slice(end + 1);
      return text || takeVoiceSentence();           // tampon commençant par un séparateur : on continue
    }

    // Toute première phrase longue : démarrer plus tôt, à la première virgule raisonnable.
    if (!voiceEnqueuedAny && buf.length >= VOICE_FIRST_CLAUSE_MIN) {
      const idx = buf.slice(VOICE_FIRST_CLAUSE_FROM).search(/,\s/);
      if (idx >= 0) {
        const cut = VOICE_FIRST_CLAUSE_FROM + idx;
        voiceDeltaBuffer = buf.slice(cut + 1);
        return buf.slice(0, cut + 1).trim();
      }
    }

    // Sécurité : phrase trop longue sans ponctuation.
    if (buf.length > VOICE_SENTENCE_MAX) {
      let cut = buf.lastIndexOf(", ", VOICE_SENTENCE_MAX);
      if (cut < 80) cut = buf.lastIndexOf(" ", VOICE_SENTENCE_MAX);
      if (cut <= 0) cut = VOICE_SENTENCE_MAX;
      voiceDeltaBuffer = buf.slice(cut + 1);
      return buf.slice(0, cut + 1).trim() || null;
    }

    return null;
  }

  // Ajoute une phrase à la file. toSpeakable() est appliqué ICI, à chaque phrase,
  // sans jamais toucher au texte affiché dans la bulle.
  function enqueueVoiceText(text) {
    if (!voiceActive) return;
    const spoken = toSpeakable(text).replace(/\s+/g, " ").trim();
    if (!spoken) return;
    if (spoken === "un extrait de code" && voiceLastEnqueued === spoken) return; // pas de répétition pour chaque ligne de code

    voiceLastEnqueued = spoken;
    voiceEnqueuedAny = true;
    voiceSpeakQueue.push(spoken);

    if (VOICE_DEBUG && voiceTimings && !voiceTimings.sentence) {
      voiceTimings.sentence = true;
      vlog("first sentence ready");
    }
    flushVoiceQueue();
  }

  // Reçoit un fragment "delta" : l'accumule puis met en file chaque phrase devenue complète.
  function pushVoiceDelta(chunk) {
    voiceDeltaBuffer += chunk;

    let sentence;
    while ((sentence = takeVoiceSentence()) !== null) {
      if (sentence) enqueueVoiceText(sentence);
    }

    // Phrase qui se termine par « . : ; » sans fragment suivant : on ne reste pas bloqué,
    // elle est lue après un court délai si rien d'autre n'arrive.
    clearTimeout(voiceFlushTimer);
    voiceFlushTimer = null;
    if (/[.:;]\s*$/.test(voiceDeltaBuffer)) {
      const run = voiceRun;
      const turn = voiceTurn;
      voiceFlushTimer = setTimeout(() => {
        voiceFlushTimer = null;
        if (!voiceActive || run !== voiceRun || turn !== voiceTurn) return;
        const rest = voiceDeltaBuffer.trim();
        if (!rest || /^\d{1,3}[.:;]$/.test(rest)) return; // vide, ou simple numéro de liste : on attend la suite
        voiceDeltaBuffer = "";
        enqueueVoiceText(rest);
      }, VOICE_TRAILING_FLUSH_MS);
    }
  }

  // Lit la file, une phrase à la fois. Le micro reste coupé pendant toute la lecture.
  // Quand la file est vide ET que la réponse est entièrement reçue : réécoute.
  //
  // Fiabilité Android : « MAJESTÉ parle » n'est affiché qu'à l'événement onstart (ou si
  // speechSynthesis.speaking passe à true). Si rien ne démarre : resume(), puis annulation propre
  // et relance de la MÊME phrase sans voix imposée (jamais deux utterances en même temps).
  function flushVoiceQueue() {
    if (!voiceActive || voicePaused || voiceSpeaking) return;

    if (!voiceSpeakQueue.length) {
      if (voiceStreamDone && voiceTurnOpen) {
        voiceTurnOpen = false;
        if (VOICE_DEBUG && voiceTimings) vlog("TTS finished");
        resumeListening(); // fin de toutes les phrases (referme aussi la session d'interruption)
      }
      return;
    }

    const synth = window.speechSynthesis;
    const run = voiceRun;
    const turn = voiceTurn;
    const token = speakToken;
    const text = voiceSpeakQueue.shift();
    voiceSpokenLog.push(text); // référence du filtre anti-écho
    if (voiceSpokenLog.length > 6) voiceSpokenLog.shift();

    voiceSpeaking = true;   // verrouille la file dès maintenant (aucun second speak possible)
    voiceCurrentText = text;
    // Mode interruption : la session d'écoute reste ouverte entre deux phrases (sinon elle serait
    // fermée puis rouverte à chaque phrase).
    if (!(recognition && recognitionMode === "barge")) stopListening(); // sans effet si le micro est déjà coupé

    const stale = () => token !== speakToken || run !== voiceRun || turn !== voiceTurn || !voiceActive;
    let finished = false;
    let started = false;
    let attempt = 0;
    let current = null;     // utterance valide ; les callbacks des autres sont ignorés
    let startedAt = 0;
    let watch = null;
    let poll = null;

    const clearTimers = () => { clearTimeout(watch); clearInterval(poll); watch = null; poll = null; };

    const finish = () => {
      if (finished) return;
      finished = true;
      clearTimers();
      if (stale()) return;
      voiceSpeaking = false;
      voiceCurrentText = "";
      voiceCurrentUtterance = null;
      flushVoiceQueue();
    };

    const markStarted = (source) => {
      if (started || finished || stale()) return;
      started = true;
      startedAt = performance.now();
      clearTimeout(watch);
      watch = null;
      tlog(source);
      setVoicePhase("speaking"); // seulement maintenant : la voix a réellement démarré
      voiceTurnSpoke = true;
      scheduleBargeIn(); // micro d'interruption : APRÈS le début réel de la voix (jamais avant)
      if (VOICE_DEBUG && voiceTimings && !voiceTimings.ttsAudio) {
        voiceTimings.ttsAudio = true;
        vlog("First TTS audio started");
      }
      // Filet : certains moteurs Android n'envoient jamais onend.
      poll = setInterval(() => {
        if (stale()) { clearTimers(); return; }
        if (!synth.speaking && !synth.pending && performance.now() - startedAt > 800) {
          tlog("onend never received -> considered finished");
          finish();
        }
      }, 600);
    };

    const recover = (reason) => {
      if (finished || stale()) return;
      clearTimers();
      tlog("recovery triggered (" + reason + "), attempt " + attempt + "/" + TTS_MAX_ATTEMPTS);
      if (attempt >= TTS_MAX_ATTEMPTS) {
        tlog("giving up on this sentence");
        finish(); // on passe à la suite : la file (puis la réécoute) ne reste jamais bloquée
        return;
      }
      current = null; // les callbacks de l'ancienne utterance deviennent sans effet
      started = false;
      try { synth.cancel(); } catch (e) { /* ignoré */ }
      setTimeout(() => attemptSpeak(false), 150); // relance sans voix imposée (voix système par défaut)
    };

    const armWatch = () => {
      let resumed = false;
      const tick = () => {
        watch = null;
        if (finished || stale() || started) return;
        if (synth.speaking) { markStarted("speaking=true without onstart event"); return; }
        if (!resumed) {
          resumed = true;
          tlog("recovery triggered (resume), speaking=" + synth.speaking + " pending=" + synth.pending + " paused=" + synth.paused);
          try { synth.resume(); } catch (e) { /* ignoré */ }
          watch = setTimeout(tick, TTS_START_WAIT_MS);
          return;
        }
        recover("no start");
      };
      watch = setTimeout(tick, TTS_START_WAIT_MS);
    };

    function attemptSpeak(useVoice) {
      if (finished || stale()) return;
      attempt++;

      if (useVoice && !selectedVoice) { // voix chargées tardivement (Android)
        try { selectedVoice = pickVoice(synth.getVoices() || []); } catch (e) { /* ignoré */ }
      }

      const u = new SpeechSynthesisUtterance(text);
      current = u;
      voiceCurrentUtterance = u; // référence gardée : Chrome peut sinon supprimer l'utterance avant onend
      u.lang = "fr-FR";
      if (useVoice && selectedVoice) u.voice = selectedVoice;
      u.rate = 1;
      u.pitch = 1;
      u.volume = 1;

      u.onstart = () => { if (current === u) markStarted("utterance onstart"); };
      u.onend = () => {
        if (current !== u) return;
        tlog("utterance onend");
        finish();
      };
      u.onerror = (e) => {
        if (current !== u || finished) return;
        tlog("utterance onerror: " + ((e && e.error) || "unknown"));
        if (stale()) return; // annulation volontaire (pause, fermeture, nouveau tour)
        recover("error");
      };

      try {
        if (synth.paused) synth.resume(); // état « pause » résiduel : speak() resterait muet
        tlog("speaking before: " + synth.speaking + " (pending=" + synth.pending + ", paused=" + synth.paused + ")");
        if (VOICE_DEBUG && voiceTimings && !voiceTimings.tts) {
          voiceTimings.tts = true;
          vlog("first TTS", "(speechSynthesis.speak)");
        }
        tlog("speak() called (attempt " + attempt + ", voice: " + (u.voice ? u.voice.name : "default") + ")");
        synth.speak(u);
        armWatch();
      } catch (err) {
        console.error(err);
        tlog("speak() threw: " + err);
        recover("exception");
      }
    }

    // Android : tant que le micro n'est pas réellement libéré, une voix peut « démarrer » sans être
    // entendue (surtout une réponse très courte). On attend onend + TTS_MIC_RELEASE_MS, au plus TTS_MIC_WAIT_MAX_MS.
    // Voix déjà démarrée dans ce tour avec l'interruption active : le micro n'a plus à être « libéré »
    // avant chaque phrase (l'attente ne sert qu'avant la toute première phrase).
    if (voiceTurnSpoke && bargeInEnabled()) { attemptSpeak(true); return; }

    const waitFrom = performance.now();
    const waitForMic = () => {
      if (finished || stale()) return;
      const now = performance.now();
      const ready = voiceRecEnded && now - voiceMicStopAt >= TTS_MIC_RELEASE_MS;
      if (ready || now - waitFrom >= TTS_MIC_WAIT_MAX_MS) {
        if (!ready) tlog("mic release wait timed out -> speaking anyway");
        attemptSpeak(true);
      } else {
        setTimeout(waitForMic, 60);
      }
    };
    waitForMic();
  }

  // Fin de la réponse : vide le tampon restant dans la file, puis laisse la file se terminer.
  // Appelée à la ligne "done" ET à la fin de sendMessage() ; la seconde fois est sans effet.
  // reply === null : échec du flux.
  function finishVoiceStream(reply) {
    if (!voiceActive || voiceStreamDone) return;

    clearTimeout(voiceFlushTimer);
    voiceFlushTimer = null;

    if (reply == null) {
      voiceDeltaBuffer = "";
      if (VOICE_DEBUG && voiceTimings) vlog("stream done", "(erreur)");
      enqueueVoiceText(VOICE_ERROR_SPOKEN);
    } else {
      if (VOICE_DEBUG && voiceTimings) vlog("stream done");
      const rest = voiceDeltaBuffer.trim();
      voiceDeltaBuffer = "";
      if (rest) enqueueVoiceText(rest);

      // Aucun fragment n'est arrivé en streaming (réponse JSON complète) : on lit la réponse entière.
      if (!voiceEnqueuedAny) splitForSpeech(reply).forEach(enqueueVoiceText);
    }

    voiceStreamDone = true;
    flushVoiceQueue();
  }

  // Garde l'écran allumé pendant la conversation vocale : sans cela, le verrouillage automatique du
  // téléphone suspend micro et synthèse. Facultatif : si l'API est absente ou refusée, le mode vocal marche sans.
  async function requestVoiceWakeLock() {
    if (!voiceActive || voiceWakeLock || voiceWakeLockPending || document.hidden) return;
    if (!navigator.wakeLock || typeof navigator.wakeLock.request !== "function") return;
    voiceWakeLockPending = true;
    try {
      const lock = await navigator.wakeLock.request("screen");
      if (!voiceActive) { lock.release().catch(() => {}); return; } // mode fermé pendant la demande
      voiceWakeLock = lock;
      // Le navigateur le libère seul quand la page passe en arrière-plan : on le redemandera au retour.
      lock.addEventListener("release", () => { if (voiceWakeLock === lock) voiceWakeLock = null; });
    } catch (err) {
      console.error(err);
    } finally {
      voiceWakeLockPending = false;
    }
  }

  function releaseVoiceWakeLock() {
    const lock = voiceWakeLock;
    voiceWakeLock = null;
    if (lock) { try { lock.release().catch(() => {}); } catch (err) { /* déjà libéré */ } }
  }

  // ---- Interruption vocale -----------------------------------------------------------------

  function bargeInPref() {
    try { return window.localStorage.getItem(BARGE_PREF_KEY) !== "off"; } catch (e) { return true; }
  }

  function setBargeInPref(on) {
    try { window.localStorage.setItem(BARGE_PREF_KEY, on ? "on" : "off"); } catch (e) { /* stockage indisponible */ }
  }

  function bargeInEnabled() {
    return !!VOICE_CFG.bargeIn && bargeInPref() && !bargeInRuntimeOff;
  }

  function updateBargeToggle() {
    const on = bargeInEnabled();
    voiceBarge.textContent = bargeInRuntimeOff
      ? "Interruption à la voix : indisponible"
      : "Interruption à la voix : " + (on ? "activée" : "désactivée");
    voiceBarge.setAttribute("aria-pressed", on ? "true" : "false");
  }

  // Repli propre : plus aucune session d'interruption pour cette session vocale. La lecture en cours
  // continue ; les phrases suivantes reprennent le fonctionnement d'origine (micro coupé pendant la
  // lecture, écoute à la fin) et le bouton « Couper » reste disponible.
  function disableBargeIn(reason) {
    bargeInRuntimeOff = true;
    tlog("barge-in disabled (" + reason + ")");
    clearTimeout(bargeTimer);
    bargeTimer = null;
    if (recognition && recognitionMode === "barge") stopListening();
    updateBargeToggle();
  }

  // Ouvre (ou rouvre) la session d'interruption pendant la lecture.
  function scheduleBargeIn(delay) {
    if (!bargeInEnabled() || !voiceActive || voicePaused || recognition) return;
    clearTimeout(bargeTimer);
    const run = voiceRun;
    const turn = voiceTurn;
    bargeTimer = setTimeout(() => {
      bargeTimer = null;
      if (!bargeInEnabled() || !voiceActive || voicePaused || recognition) return;
      if (run !== voiceRun || turn !== voiceTurn || voicePhase !== "speaking") return;
      startListening("barge");
    }, delay == null ? VOICE_CFG.bargeStartDelayMs : delay);
  }

  // Une session d'interruption qui se termine d'elle-même (silence prolongé) est rouverte ; si elles
  // meurent toutes aussitôt sans rien capter, le moteur refuse probablement de capter pendant la voix.
  function scheduleBargeRestart(startedAt, heardAny) {
    if (!heardAny && performance.now() - startedAt < VOICE_CFG.bargeQuickFailMs) {
      bargeQuickFails++;
      if (bargeQuickFails >= VOICE_CFG.bargeMaxQuickFails) { disableBargeIn("sessions too short"); return; }
    } else {
      bargeQuickFails = 0;
    }
    scheduleBargeIn(VOICE_CFG.bargeRestartDelayMs);
  }

  // ---- Filtre anti-écho (heuristique textuelle) ----
  function bargeWords(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, " ").trim().split(" ").filter(Boolean);
  }

  // Texte récemment lu (+ phrases à venir) : ce que le micro peut légitimement recapter par écho.
  function bargeEchoReference() {
    const parts = voiceSpokenLog.slice(-4).concat(voiceSpeakQueue.slice(0, 2));
    if (voiceCurrentText) parts.push(voiceCurrentText);
    return parts.join(" ").slice(-VOICE_CFG.bargeEchoWindowChars);
  }

  // words : mots captés ; fresh : mots absents du texte lu ; ratio : part des mots (>= 3 lettres) déjà lus.
  function analyzeBarge(heard, ref) {
    const words = bargeWords(heard);
    const refSet = new Set(bargeWords(ref));
    const significant = words.filter((w) => w.length >= 3);
    const base = significant.length ? significant : words;
    const known = base.filter((w) => refSet.has(w)).length;
    const joined = words.join(" ");
    return {
      words: words,
      fresh: words.filter((w) => w.length >= 2 && !refSet.has(w)),
      ratio: base.length ? known / base.length : 0,
      commandOnly: words.length > 0 && words.length <= 2 &&
        (words.every((w) => VOICE_COMMAND_WORDS.has(w)) || joined === "tais toi" || joined === "ca suffit")
    };
  }

  // Vraie intervention ? Assez de mots nouveaux (ou un mot-commande) ET texte qui ne ressemble pas à l'écho.
  function shouldInterrupt(v) {
    if (v.ratio >= VOICE_CFG.bargeEchoRatio) return false;
    const command = v.fresh.some((w) => VOICE_COMMAND_WORDS.has(w)) || v.fresh.join(" ").indexOf("tais toi") !== -1;
    return v.fresh.length >= VOICE_CFG.bargeMinWords || command;
  }

  // Phrase finale d'une session d'interruption à ne PAS envoyer : mot-commande seul (« stop ») ou écho pur.
  function discardBargeTranscript(text, ref) {
    const v = analyzeBarge(text, ref);
    return v.commandOnly || v.ratio >= VOICE_CFG.bargeEchoRatio;
  }

  function joinResults(results) {
    let s = "";
    for (let i = 0; i < results.length; i++) s += " " + results[i][0].transcript;
    return s.trim();
  }

  // ---- Annulation du tour en cours ----

  // Annule la requête du tour vocal (fetch + lecture du flux). Ne garantit PAS que le serveur arrête de
  // générer ni qu'il n'enregistre pas la réponse. Retourne true si une requête était réellement en cours.
  function abortVoiceRequest() {
    const req = voiceRequest;
    voiceRequest = null;
    if (!req || req.done) return false;
    req.aborted = true;
    try { req.controller.abort(); } catch (e) { /* déjà annulée */ }
    if (req.reader) {
      try { req.reader.cancel().catch(() => {}); } catch (e) { /* déjà fermé */ }
    }
    // L'ancien sendMessage ne touchera plus à `sending` (voir sendSeq) : le prochain tour peut partir.
    sending = false;
    updateSendState();
    return true;
  }

  // Interrompt le tour en cours (réflexion ou lecture), SANS toucher à la reconnaissance : l'appelant
  // décide de la suite (garder la session qui a détecté la voix, ou rouvrir l'écoute pour le bouton).
  function interruptVoiceTurn(reason) {
    if (!voiceActive || (voicePhase !== "thinking" && voicePhase !== "speaking")) return false;
    tlog("interrupt (" + reason + ")");
    setVoicePhase("interrupting");
    voiceTurn++;           // invalide tout callback du tour : flux, minuteurs, file, utterances
    abortVoiceRequest();
    resetVoiceQueue();     // file, tampon, minuteurs (dont celui du micro d'interruption)
    stopSpeaking();        // speakToken++ puis speechSynthesis.cancel()
    return true;
  }

  // Rouvre l'écoute normale : ferme la session en cours, attend sa fin réelle (au plus resumeWaitMaxMs),
  // puis écoute. Remplace l'appel direct à startListening() en fin de tour et après « Couper ».
  function resumeListening() {
    if (!voiceActive || voicePaused) return;
    const run = voiceRun;
    stopListening();
    setVoicePhase("listening");
    const t0 = performance.now();
    const go = () => {
      if (!voiceActive || voicePaused || run !== voiceRun || recognition) return;
      if (voicePhase !== "listening") return; // l'état a changé entre-temps
      if (voiceRecEnded || performance.now() - t0 >= VOICE_CFG.resumeWaitMaxMs) startListening();
      else setTimeout(go, 50);
    };
    go();
  }

  function closeVoice(message) {
    voiceActive = false;
    voicePhase = null;
    voicePaused = false;
    voiceRun++;
    voiceTurn++;
    resetVoiceQueue();
    // La requête en cours n'est PAS annulée à la fermeture : la réponse écrite continue d'arriver dans le
    // chat (comportement existant). Seule la référence vocale est oubliée.
    voiceRequest = null;
    stopListening();
    stopSpeaking();
    releaseVoiceWakeLock();
    voiceOverlay.classList.remove("open");
    if (message) addMessage("assistant notice", message);
  }

  // RÉFLEXION + PAROLE : micro coupé ; même chemin d'envoi qu'un message tapé, mais les fragments
  // reçus alimentent la file vocale dès leur arrivée. La requête est annulable (voiceRequest) :
  // interruptVoiceTurn() l'annule quand l'utilisateur reprend la parole ou appuie sur « Couper ».
  async function handleTranscript(text) {
    if (!voiceActive) return;
    if (voicePhase === "thinking") return; // transcription en double : un seul envoi par tour
    const run = voiceRun;
    setVoicePhase("thinking");
    stopListening();
    beginVoiceTurn();
    const turn = voiceTurn;
    const stale = () => !voiceActive || run !== voiceRun || turn !== voiceTurn;

    const controller = new AbortController();
    const request = { controller: controller, reader: null, done: false, aborted: false, turn: turn };
    voiceRequest = request;

    if (VOICE_DEBUG) {
      const now = performance.now();
      voiceTimings = { delta: false, sentence: false, tts: false, ttsAudio: false };
      // Le contenu de la phrase n'est volontairement PAS journalisé (donnée vocale).
      console.log("[VOICE] STT final: " + Math.round(now - voiceListenStartedAt) +
        " ms (début d'écoute -> texte final)");
      voiceT0 = now; // les mesures suivantes sont comptées depuis le texte final
    }

    const reply = await sendMessage(text, {
      voice: true,
      signal: controller.signal,
      onReader: (reader) => { if (voiceRequest === request) request.reader = reader; },
      onStage: (name) => { if (!stale()) vlog(VOICE_STAGE_LABELS[name] || name); },
      onDelta: (chunk) => {
        if (stale()) return;
        if (VOICE_DEBUG && voiceTimings && !voiceTimings.delta) {
          voiceTimings.delta = true;
          vlog("first delta");
        }
        pushVoiceDelta(chunk);
      },
      onDone: (full) => {
        if (stale()) return;
        // streamReply vient d'ajouter la ligne Word/PDF juste après la bulle : inutile sous une réponse très courte.
        const last = messagesEl.lastElementChild;
        if (last && last.classList.contains("msg-actions") && String(full).length < 300) last.remove();
        finishVoiceStream(full);
      }
    });

    request.done = true;
    if (voiceRequest === request) voiceRequest = null;

    if (stale()) return; // tour interrompu ou mode fermé : rien à lire, aucune erreur parlée
    finishVoiceStream(reply); // sans effet si la ligne "done" a déjà été traitée
  }

  // ÉCOUTE : un tour = une écoute (continuous:false), relancée automatiquement.
  // mode "barge" : session ouverte PENDANT la lecture (résultats intermédiaires). Elle ne fait rien tant
  // que le texte capté ressemble à l'écho de MAJESTÉ ; dès qu'une vraie intervention est détectée, le tour
  // est interrompu et CETTE MÊME session devient l'écoute normale : le début de la phrase n'est pas perdu.
  function startListening(mode) {
    const isBarge = mode === "barge";
    if (!voiceActive || voicePaused) return;
    const SR = getSpeechRecognition();
    if (!SR) { closeVoice("La conversation vocale n'est pas disponible sur ce navigateur."); return; }

    stopListening();
    if (!isBarge) setVoicePhase("listening");

    const rec = new SR();
    recognition = rec;
    recognitionMode = isBarge ? "barge" : "listen";
    rec.lang = "fr-FR";
    rec.continuous = false;
    rec.interimResults = isBarge; // intermédiaires : uniquement pour détecter le début d'une intervention

    const startedAt = performance.now();
    const startTurn = voiceTurn;
    let adopted = !isBarge;  // session « barge » : devient une écoute normale à la première vraie intervention
    let refSnapshot = "";    // texte lu au moment de l'interruption (pour écarter un écho pur en fin de phrase)
    let heardAny = false;
    let transcript = "";
    let gotFinal = false;
    let errorCode = null;

    rec.onresult = (e) => {
      if (recognition !== rec) return;
      heardAny = true;

      if (!adopted) {
        // Résultat périmé (tour fini, interrompu, mode fermé) : ignoré.
        if (voicePhase !== "speaking" || startTurn !== voiceTurn) return;
        const ref = bargeEchoReference();
        if (!shouldInterrupt(analyzeBarge(joinResults(e.results), ref))) return; // écho, bruit ou parole trop courte
        refSnapshot = ref;
        tlog("barge-in detected (voice)");
        interruptVoiceTurn("voice");
        adopted = true;
        setVoicePhase("listening");
      }

      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) { transcript += e.results[i][0].transcript; gotFinal = true; }
      }
      if (gotFinal) {
        recognition = null;
        voiceMicStopAt = performance.now();
        voiceRecEnded = false; // remis à true par onend
        try { rec.stop(); } catch (err) { /* ignoré */ }
        const text = transcript.trim();
        if (text && !(isBarge && discardBargeTranscript(text, refSnapshot))) handleTranscript(text);
        else if (isBarge) resumeListening(); // « stop » seul ou écho pur : rien à envoyer, on réécoute
        else startListening();
      }
    };

    rec.onerror = (e) => {
      if (recognition !== rec) return;
      errorCode = (e && e.error) || "unknown";
      if (errorCode === "no-speech" || errorCode === "aborted") return; // onend relance l'écoute
      if (isBarge && !adopted) {
        // Pendant la lecture, une erreur du micro ne ferme JAMAIS le mode vocal : repli propre.
        recognition = null;
        disableBargeIn("recognition error " + errorCode);
        return;
      }
      // Erreur grave (permission refusée, micro absent, réseau...) : on quitte le mode.
      recognition = null;
      const denied = errorCode === "not-allowed" || errorCode === "service-not-allowed";
      closeVoice(denied
        ? "Le micro n'est pas autorisé. Autorisez-le dans les réglages du navigateur pour utiliser la conversation vocale."
        : "La reconnaissance vocale a rencontré un problème. Réessayez dans un instant.");
    };

    rec.onend = () => {
      voiceRecEnded = true; // le micro est réellement libéré (mesuré AVANT la garde ci-dessous)
      voiceMicStopAt = performance.now();
      if (recognition !== rec) return;
      recognition = null;
      if (isBarge && !adopted) { scheduleBargeRestart(startedAt, heardAny); return; }
      if (gotFinal || !voiceActive || voicePaused) return;
      setTimeout(() => { if (voiceActive && voicePhase === "listening") startListening(); }, 250);
    };

    try {
      if (!isBarge) voiceListenStartedAt = performance.now();
      rec.start();
    } catch (err) {
      console.error(err);
      recognition = null;
      if (isBarge) { disableBargeIn("start failed"); return; }
      closeVoice("Impossible de démarrer le micro.");
    }
  }

  function openVoice() {
    if (!getSpeechRecognition() || !window.speechSynthesis) {
      window.alert("La conversation vocale n'est pas disponible sur ce navigateur.");
      return;
    }
    if (sending || voiceActive) return;
    initSpeechSynthesis(); // n'attend rien : sans voix connue, la voix système par défaut est utilisée
    input.blur();
    voiceActive = true;
    voicePaused = false;
    voiceRun++;
    voiceTurn++;
    resetVoiceQueue();
    voiceRequest = null;
    bargeInRuntimeOff = false; // nouvel essai à chaque ouverture du mode vocal
    bargeQuickFails = 0;
    updateBargeToggle();
    voiceOverlay.classList.add("open");
    requestVoiceWakeLock();
    startListening();
  }

  // Arrière-plan : on coupe micro et synthèse sans erreur visible. La réponse en cours n'est pas
  // perdue : les phrases continuent d'arriver dans la file, et la phrase interrompue sera relue.
  // Au retour au premier plan : lecture de la file, ou réécoute si le tour est terminé.
  document.addEventListener("visibilitychange", () => {
    if (!voiceActive) return;
    if (document.hidden) {
      voicePaused = true;
      stopListening();
      if (voiceSpeaking) {
        if (voiceCurrentText) voiceSpeakQueue.unshift(voiceCurrentText); // sera relue au retour
        voiceSpeaking = false;
        voiceCurrentText = "";
        voiceCurrentUtterance = null;
      }
      stopSpeaking();
      if (voicePhase !== "thinking") setVoiceState("paused");
    } else {
      voicePaused = false;
      requestVoiceWakeLock(); // le verrou est perdu en arrière-plan : on le reprend
      if (voiceTurnOpen) {
        setVoiceState(voicePhase || "thinking");
        flushVoiceQueue(); // lit ce qui attend, ou réécoute si tout est déjà lu et reçu
      } else {
        startListening();
      }
    }
  });

  voiceBtn.addEventListener("click", openVoice);
  voiceStop.addEventListener("click", () => closeVoice());

  // « Couper » : arrête la réponse en cours (voix + requête) SANS fermer le mode vocal, puis réécoute.
  voiceCut.addEventListener("click", () => {
    if (interruptVoiceTurn("manual")) resumeListening();
  });

  // Bascule de l'interruption à la voix (préférence conservée) : repli manuel si la voix est coupée
  // par le micro sur certains appareils Android.
  voiceBarge.addEventListener("click", () => {
    if (bargeInEnabled()) {
      setBargeInPref(false);
      clearTimeout(bargeTimer);
      bargeTimer = null;
      if (recognition && recognitionMode === "barge") stopListening();
    } else {
      setBargeInPref(true);
      bargeInRuntimeOff = false;
      bargeQuickFails = 0;
      if (voicePhase === "speaking") scheduleBargeIn();
    }
    updateBargeToggle();
  });
  updateBargeToggle();

  // -------- Mise en page mobile : barre de nav fixe + clavier --------
  const navEl = document.querySelector("nav.bottom-nav");
  const rootStyle = document.documentElement.style;

  function updateNavHeight() {
    if (navEl && !document.body.classList.contains("typing")) {
      rootStyle.setProperty("--nav-h", navEl.offsetHeight + "px");
    }
  }

  function updateViewportHeight() {
    const vv = window.visualViewport;
    if (vv) rootStyle.setProperty("--app-h", vv.height + "px");
    window.scrollTo(0, 0);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  input.addEventListener("focus", () => document.body.classList.add("typing"));
  input.addEventListener("blur", () => {
    document.body.classList.remove("typing");
    updateNavHeight();
  });

  window.addEventListener("resize", updateNavHeight);
  if (window.ResizeObserver && navEl) new ResizeObserver(updateNavHeight).observe(navEl);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", updateViewportHeight);
  // Le composeur est dans le flux de #ai-app : quand il grandit (jusqu'à 4 lignes),
  // la liste des messages rétrécit seule. On garde simplement le bas visible.
  if (window.ResizeObserver) {
    new ResizeObserver(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }).observe(composer);
  }

  updateNavHeight();
  updateViewportHeight();

  showGreeting();

})();
</script>

<script src="pwa-install.js"></script>
