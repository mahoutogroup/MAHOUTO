<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHOUTO AI — MAHOUTO+</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/logo-mahouto-plus.png">
<link rel="stylesheet" href="theme.css">
<script src="theme-toggle.js"></script>
<style>
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    padding-right: 60px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }

  header h1 { font-size: 17px; color: var(--gold); flex: 1; }
  header .settings-btn { font-size: 20px; background: none; border: none; color: var(--text-muted); cursor: pointer; }

  select#model-select {
    background: var(--bg-card);
    color: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px;
  }

  #ai-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    align-self: flex-start;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #0A0A0A;
    align-self: flex-end;
    border: none;
  }

  .msg.thinking { color: var(--text-dim); font-style: italic; }

  form#ai-composer {
    display: flex;
    gap: 10px;
    padding: 14px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
  }

  #ai-composer textarea {
    flex: 1;
    resize: none;
    max-height: 100px;
    padding: 12px 16px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--white);
    font-size: 14.5px;
    font-family: inherit;
  }

  #ai-composer textarea:focus { outline: none; border-color: var(--gold); }

  #ai-composer button { padding: 0 20px; border: none; border-radius: 18px; background: var(--gold-bright); font-weight: bold; cursor: pointer; }
  #ai-composer button:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Écran de configuration de la clé ---------- */
  #key-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 28px;
    text-align: center;
    z-index: 40;
  }

  #key-screen h2 { color: var(--gold); font-size: 21px; }
  #key-screen p { color: var(--text-muted); font-size: 13.5px; max-width: 320px; line-height: 1.6; }
  #key-screen a { color: var(--gold); }

  #key-screen input {
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--white);
    width: 100%;
    max-width: 300px;
    font-size: 14px;
  }

  #key-status { color: var(--text-dim); font-size: 12.5px; min-height: 16px; }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div id="key-screen">
  <h2>🧠 MAHOUTO AI</h2>
  <p>
    Colle ta clé API <strong>OpenRouter</strong> pour activer l'assistant.
    Elle reste sur ton appareil (jamais envoyée à MAHOUTO+).
    <br><a href="https://openrouter.ai/keys" target="_blank" rel="noopener">Obtenir une clé gratuite →</a>
  </p>
  <input id="key-input" type="password" placeholder="sk-or-v1-...">
  <button class="btn-gold" id="save-key-btn">Activer l'assistant</button>
  <div id="key-status"></div>
</div>

<div id="ai-app" class="hidden" style="display:flex; flex-direction:column; flex:1;">

  <header>
    <h1>🧠 MAHOUTO AI</h1>
    <select id="model-select">
      <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (gratuit)</option>
      <option value="google/gemini-flash-1.5">Gemini Flash 1.5</option>
      <option value="openai/gpt-4o-mini">GPT-4o mini</option>
      <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
    </select>
    <button class="settings-btn" id="settings-btn" title="Changer de clé">⚙️</button>
  </header>

  <div id="ai-messages"></div>

  <form id="ai-composer">
    <textarea id="ai-input" rows="1" placeholder="Pose ta question à MAHOUTO AI..."></textarea>
    <button type="submit" id="ai-send-btn">Envoyer</button>
  </form>

</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="icon">🏠</span>Accueil</a>
  <a class="nav-item" href="discussions.html"><span class="icon">💬</span>Messages</a>
  <a class="nav-item active" href="ai.html"><span class="icon">🧠</span>MAHOUTO AI</a>
  <a class="nav-item" href="school.html"><span class="icon">🎓</span>School</a>
  <a class="nav-item" href="profil.html"><span class="icon">👤</span>Profil</a>
</nav>

<script>
(function () {
  const STORAGE_KEY = "mahouto_openrouter_key";
  const keyScreen = document.getElementById("key-screen");
  const keyInput = document.getElementById("key-input");
  const saveKeyBtn = document.getElementById("save-key-btn");
  const keyStatus = document.getElementById("key-status");
  const aiApp = document.getElementById("ai-app");
  const messagesEl = document.getElementById("ai-messages");
  const composer = document.getElementById("ai-composer");
  const input = document.getElementById("ai-input");
  const sendBtn = document.getElementById("ai-send-btn");
  const modelSelect = document.getElementById("model-select");
  const settingsBtn = document.getElementById("settings-btn");

  let history = []; // { role, content }

  function getKey() { return localStorage.getItem(STORAGE_KEY); }

  function showApp() {
    keyScreen.classList.add("hidden");
    aiApp.classList.remove("hidden");
    if (!messagesEl.childElementCount) {
      addMessage("assistant", "Bonjour 👋 Je suis MAHOUTO AI. Pose-moi une question, demande du code, ou colle un texte à analyser.");
    }
  }

  function addMessage(role, content) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = content;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  saveKeyBtn.addEventListener("click", () => {
    const key = keyInput.value.trim();
    if (!key) { keyStatus.textContent = "Colle une clé valide."; return; }
    localStorage.setItem(STORAGE_KEY, key);
    showApp();
  });

  settingsBtn.addEventListener("click", () => {
    keyInput.value = getKey() || "";
    aiApp.classList.add("hidden");
    keyScreen.classList.remove("hidden");
  });

  composer.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    const key = getKey();
    if (!key) { settingsBtn.click(); return; }

    addMessage("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    sendBtn.disabled = true;

    const thinkingEl = addMessage("assistant thinking", "MAHOUTO AI réfléchit...");

    try {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + key,
          "HTTP-Referer": window.location.origin,
          "X-Title": "MAHOUTO+"
        },
        body: JSON.stringify({
          model: modelSelect.value,
          messages: history
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error((data.error && data.error.message) || "Erreur OpenRouter");
      }

      const reply = data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content
        : "(Réponse vide)";

      thinkingEl.remove();
      addMessage("assistant", reply);
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      thinkingEl.remove();
      addMessage("assistant", "⚠️ " + err.message);
      console.error(err);
    } finally {
      sendBtn.disabled = false;
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      composer.dispatchEvent(new Event("submit"));
    }
  });

  if (getKey()) showApp();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => console.log(err));
    });
  }
})();
</script>

</body>
</html>
