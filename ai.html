<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>MAJESTÉ — MAHOUTO+</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/logo-mahouto-plus.png">
<link rel="stylesheet" href="theme.css">
<script src="theme-toggle.js"></script>
<style>
  html, body { overflow: hidden; }

  /* #ai-app occupe la hauteur visible (hors clavier) ; son padding-bottom
     réserve la hauteur MESURÉE de nav.bottom-nav (fixe, hors flux). */
  #ai-app {
    height: var(--app-h, 100dvh);
    min-height: 0;
    flex: none;
    padding-bottom: var(--nav-h, 72px);
  }

  /* Clavier ouvert : la barre de navigation s'efface, le composeur
     reste juste au-dessus du clavier. */
  body.typing nav.bottom-nav { display: none; }
  body.typing #ai-app { padding-bottom: 0; }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 10px 16px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }

  .hdr-title { flex: 1; min-width: 0; }
  header h1 { font-size: 17px; color: var(--gold); white-space: nowrap; line-height: 1.2; }
  .hdr-sub { display: block; font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 3 boutons ronds identiques (le bouton thème est déplacé dans le header) */
  header .icon-btn,
  header .theme-toggle-fab {
    position: static;
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--white);
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }

  header .icon-btn:active { transform: scale(.92); }

  #ai-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    align-self: flex-start;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .msg a { color: var(--gold-bright); text-decoration: underline; }

  .msg.user {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #0A0A0A;
    align-self: flex-end;
    border: none;
  }

  .msg.thinking { color: var(--text-dim); font-style: italic; }

  /* ---------- Écran d'accueil (conversation vide) ---------- */
  #ai-welcome {
    margin: auto;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }

  #ai-welcome .w-logo { font-size: 52px; line-height: 1; }
  #ai-welcome .w-text { color: var(--text-muted); font-size: 14.5px; line-height: 1.5; max-width: 320px; margin-bottom: 8px; }

  .w-cards { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .w-card {
    min-height: 64px;
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--white);
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.35;
    cursor: pointer;
  }

  .w-card:active { transform: scale(.97); border-color: var(--gold); }

  form#ai-composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex: none;
    padding: 10px 12px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    box-shadow: 0 -6px 14px rgba(0,0,0,.28);
    position: relative;
  }

  #ai-composer .c-btn,
  #ai-composer #ai-send-btn {
    flex: none;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--white);
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  #ai-composer .c-btn:disabled { opacity: .4; cursor: not-allowed; }

  #ai-composer #ai-send-btn {
    background: var(--gold-bright);
    border: none;
    color: #0A0A0A;
    font-size: 18px;
    font-weight: bold;
  }

  #ai-composer #ai-send-btn:disabled { opacity: .4; cursor: not-allowed; }

  #ai-composer textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    height: 44px;
    max-height: 108px; /* 4 lignes : 4 x 22px + 2 x 10px de padding */
    padding: 10px 16px;
    border-radius: 22px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--white);
    font-size: 16px;
    line-height: 22px;
    font-family: inherit;
    overflow-y: auto;
  }

  #ai-composer textarea:focus { outline: none; border-color: var(--gold); }

  /* ---------- Panneau historique ---------- */
  #history-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 50;
  }

  #history-overlay { display: none; }
  #history-overlay.open { display: block; }

  #history-panel {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: min(86vw, 340px);
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    z-index: 51;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform .22s ease;
    pointer-events: none;
  }

  #history-panel.open { transform: translateX(0); pointer-events: auto; }

  .hist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    color: var(--gold);
    font-weight: bold;
  }

  .hist-head button { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; width: 44px; height: 44px; }

  #history-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  .hist-empty { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; padding: 14px 8px; text-align: center; }
  .hist-empty a { color: var(--gold); }

  .hist-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 4px 4px 12px;
  }

  .hist-item.current { border-color: var(--gold); }

  .hist-open {
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    color: var(--white);
    padding: 8px 0;
    cursor: pointer;
    font-family: inherit;
  }

  .hist-title { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-date { display: block; font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  .hist-del { background: none; border: none; font-size: 17px; width: 44px; height: 44px; flex: none; cursor: pointer; }
</style>
</head>
<body>

<div id="ai-app" style="display:flex; flex-direction:column; flex:1;">

  <header>
    <div class="hdr-title">
      <h1>🧠 MAJESTÉ</h1>
      <span class="hdr-sub">Développé par MAJESTÉ PRESSE</span>
    </div>
    <button type="button" class="icon-btn" id="history-btn" aria-label="Historique" title="Historique">🕘</button>
    <button type="button" class="icon-btn" id="new-chat-btn" aria-label="Nouvelle conversation" title="Nouvelle conversation">✏️</button>
    <button id="theme-toggle-btn" class="theme-toggle-fab" aria-label="Changer de thème" title="Thème">🌙</button>
  </header>

  <div id="ai-messages"></div>

  <form id="ai-composer">
    <button type="button" class="c-btn" disabled title="Bientôt" aria-label="Joindre un fichier (bientôt)">📎</button>
    <button type="button" class="c-btn" disabled title="Bientôt" aria-label="Dictée vocale (bientôt)">🎤</button>
    <textarea id="ai-input" rows="1" placeholder="Écris à MAJESTÉ..."></textarea>
    <button type="submit" id="ai-send-btn" aria-label="Envoyer" title="Envoyer" disabled>➤</button>
  </form>

</div>

<div id="history-overlay"></div>
<aside id="history-panel" aria-hidden="true">
  <div class="hist-head">
    <span>🕘 Historique</span>
    <button type="button" id="history-close" aria-label="Fermer">✕</button>
  </div>
  <div id="history-list"></div>
</aside>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="icon">🏠</span>Accueil</a>
  <a class="nav-item" href="discussions.html"><span class="icon">💬</span>Messages</a>
  <a class="nav-item active" href="ai.html"><span class="icon">🧠</span>MAHOUTO AI</a>
  <a class="nav-item" href="school.html"><span class="icon">🎓</span>School</a>
  <a class="nav-item" href="profil.html"><span class="icon">👤</span>Profil</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  const API = "https://ai.majestepresse.com";
  const ERROR_TEXT = "Une erreur est survenue, veuillez réessayer";
  const LOGIN_URL = "index.html"; // la connexion (modal Google) vit sur la page d'accueil

  const messagesEl = document.getElementById("ai-messages");
  const composer = document.getElementById("ai-composer");
  const input = document.getElementById("ai-input");
  const sendBtn = document.getElementById("ai-send-btn");
  const newChatBtn = document.getElementById("new-chat-btn");
  const historyBtn = document.getElementById("history-btn");
  const historyClose = document.getElementById("history-close");
  const historyPanel = document.getElementById("history-panel");
  const historyOverlay = document.getElementById("history-overlay");
  const historyList = document.getElementById("history-list");

  const GREETING = "Bonjour 👋 Je suis MAJESTÉ. Pose-moi une question, demande du code, ou colle un texte à analyser.";
  const SUGGESTIONS = [
    "Écris-moi un code HTML/CSS",
    "Explique-moi un concept",
    "Analyse ce texte",
    "Aide-moi à créer une affiche"
  ];
  let sending = false;

  let conversationId = null;
  let historyToken = 0; // invalide les réponses d'historique périmées

  // -------- Supabase (même pattern que share.html) --------
  let supabaseClient = null;
  try {
    const cfg = window.MAHOUTO_CONFIG;
    if (window.supabase && cfg && cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY) {
      supabaseClient = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    }
  } catch (err) {
    console.error("Supabase indisponible :", err);
  }

  async function getSession() {
    if (!supabaseClient) return null;
    try {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) { console.error("Erreur session:", error); return null; }
      return (data && data.session) || null;
    } catch (err) {
      console.error("Erreur session:", err);
      return null;
    }
  }

  async function authHeaders(base) {
    const headers = Object.assign({}, base);
    const session = await getSession();
    if (session && session.access_token) {
      headers["Authorization"] = "Bearer " + session.access_token;
    }
    return { headers, hasSession: !!(session && session.access_token) };
  }

  // -------- Rendu sécurisé : jamais d'innerHTML --------
  const URL_RE = /https?:\/\/[^\s<>"']+/g;

  function appendText(parent, text) {
    // les "**" orphelins ne doivent jamais rester visibles
    const clean = text.replace(/\*\*/g, "");
    if (clean) parent.appendChild(document.createTextNode(clean));
  }

  function appendLinkified(parent, text) {
    let last = 0;
    let m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text)) !== null) {
      let url = m[0];
      let trailing = "";
      const t = url.match(/[.,;:!?)\]]+$/);
      if (t) { trailing = t[0]; url = url.slice(0, -trailing.length); }
      appendText(parent, text.slice(last, m.index));
      if (url.length > 8) {
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = url;
        parent.appendChild(a);
      } else {
        appendText(parent, url);
      }
      appendText(parent, trailing);
      last = m.index + m[0].length;
    }
    appendText(parent, text.slice(last));
  }

  function renderRich(target, text) {
    const re = /\*\*([\s\S]+?)\*\*/g;
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      appendLinkified(target, text.slice(last, m.index));
      const strong = document.createElement("strong");
      appendLinkified(strong, m[1]);
      target.appendChild(strong);
      last = m.index + m[0].length;
    }
    appendLinkified(target, text.slice(last));
  }

  function addMessage(role, content) {
    const welcome = document.getElementById("ai-welcome");
    if (welcome) welcome.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    const text = String(content == null ? "" : content);
    if (role.indexOf("assistant") !== -1 && role.indexOf("thinking") === -1) {
      renderRich(div, text);
    } else {
      div.textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function resetMessages() {
    messagesEl.textContent = "";
  }

  function showGreeting() {
    const box = document.createElement("div");
    box.id = "ai-welcome";

    const logo = document.createElement("div");
    logo.className = "w-logo";
    logo.textContent = "🧠";
    const text = document.createElement("p");
    text.className = "w-text";
    text.textContent = GREETING;
    const cards = document.createElement("div");
    cards.className = "w-cards";
    SUGGESTIONS.forEach((label) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "w-card";
      b.textContent = label;
      b.addEventListener("click", () => sendMessage(label));
      cards.appendChild(b);
    });

    box.appendChild(logo);
    box.appendChild(text);
    box.appendChild(cards);
    messagesEl.appendChild(box);
  }

  // -------- Envoi d'un message --------
  async function sendMessage(text) {
    text = String(text || "").trim();
    if (!text || sending) return;

    addMessage("user", text);
    sending = true;
    updateSendState();

    const thinkingEl = addMessage("assistant thinking", "MAJESTÉ réfléchit...");

    try {
      const { headers } = await authHeaders({ "Content-Type": "application/json" });
      const response = await fetch(API + "/api/chat", {
        method: "POST",
        headers,
        body: JSON.stringify({ message: text, conversationId: conversationId || null })
      });

      if (!response.ok) throw new Error("HTTP " + response.status);

      const newId = response.headers.get("X-Conversation-Id");
      if (newId) conversationId = newId;

      const data = await response.json();
      if (typeof data.reply !== "string") throw new Error("Réponse invalide : reply manquant");
      thinkingEl.remove();
      addMessage("assistant", data.reply);
    } catch (err) {
      console.error(err);
      thinkingEl.remove();
      addMessage("assistant", ERROR_TEXT);
    } finally {
      sending = false;
      updateSendState();
    }
  }

  composer.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sending) return;
    input.value = "";
    autoGrow();
    updateSendState();
    sendMessage(text);
  });

  // Entrée = nouvelle ligne (mobile) ; seul le bouton ➤ envoie.
  function updateSendState() {
    sendBtn.disabled = sending || !input.value.trim();
  }

  // -------- Zone de texte extensible (vers le haut, comme WhatsApp) --------
  function autoGrow() {
    // Champ vide : on revient à la hauteur CSS (1 ligne) ; le placeholder
    // ne doit pas gonfler scrollHeight.
    if (!input.value) { input.style.height = ""; return; }
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 108) + "px";
  }
  input.addEventListener("input", () => { autoGrow(); updateSendState(); });

  // -------- Nouvelle conversation --------
  newChatBtn.addEventListener("click", () => {
    historyToken++;
    conversationId = null;
    resetMessages();
    showGreeting();
    closeHistory();
  });

  // -------- Historique --------
  function formatDate(value) {
    const d = new Date(value);
    if (!value || isNaN(d.getTime())) return "";
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((startOf(new Date()) - startOf(d)) / 86400000);
    if (days === 0) return "aujourd'hui";
    if (days === 1) return "hier";
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  }

  function openHistory() {
    historyOverlay.classList.add("open");
    historyPanel.classList.add("open");
    historyPanel.setAttribute("aria-hidden", "false");
    loadHistory();
  }

  function closeHistory() {
    historyOverlay.classList.remove("open");
    historyPanel.classList.remove("open");
    historyPanel.setAttribute("aria-hidden", "true");
  }

  historyBtn.addEventListener("click", openHistory);
  historyClose.addEventListener("click", closeHistory);
  historyOverlay.addEventListener("click", closeHistory);

  function setListMessage(text, withLoginLink) {
    historyList.textContent = "";
    const div = document.createElement("div");
    div.className = "hist-empty";
    div.appendChild(document.createTextNode(text));
    if (withLoginLink) {
      div.appendChild(document.createElement("br"));
      const a = document.createElement("a");
      a.href = LOGIN_URL;
      a.textContent = "Se connecter";
      div.appendChild(a);
    }
    historyList.appendChild(div);
  }

  async function loadHistory() {
    const token = ++historyToken;
    const { headers, hasSession } = await authHeaders({});
    if (!hasSession) {
      setListMessage("Connectez-vous pour conserver votre historique", true);
      return;
    }
    setListMessage("Chargement...", false);
    try {
      const res = await fetch(API + "/api/chat/history", { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.conversations)) throw new Error("Réponse invalide : conversations manquant");
      const items = data.conversations;
      if (token !== historyToken) return;
      renderHistory(items);
    } catch (err) {
      console.error(err);
      if (token === historyToken) setListMessage(ERROR_TEXT, false);
    }
  }

  function renderHistory(items) {
    historyList.textContent = "";
    if (!items.length) { setListMessage("Aucune conversation pour le moment.", false); return; }

    items.forEach((conv) => {
      if (!conv || conv.id == null) return;
      const row = document.createElement("div");
      row.className = "hist-item" + (String(conv.id) === String(conversationId) ? " current" : "");

      const open = document.createElement("button");
      open.type = "button";
      open.className = "hist-open";
      const title = document.createElement("span");
      title.className = "hist-title";
      title.textContent = conv.title || "Conversation";
      const date = document.createElement("span");
      date.className = "hist-date";
      date.textContent = formatDate(conv.updated_at);
      open.appendChild(title);
      open.appendChild(date);
      open.addEventListener("click", () => openConversation(conv.id));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "hist-del";
      del.title = "Supprimer";
      del.setAttribute("aria-label", "Supprimer la conversation");
      del.textContent = "🗑";
      del.addEventListener("click", () => deleteConversation(conv.id, row));

      row.appendChild(open);
      row.appendChild(del);
      historyList.appendChild(row);
    });
  }

  async function openConversation(id) {
    try {
      const { headers } = await authHeaders({});
      const res = await fetch(API + "/api/chat/history/" + encodeURIComponent(id), { headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.messages)) throw new Error("Réponse invalide : messages manquant");
      const msgs = data.messages;
      conversationId = id;
      resetMessages();
      msgs.forEach((m) => {
        addMessage(m.role === "user" ? "user" : "assistant", m.content);
      });
      if (!messagesEl.childElementCount) showGreeting();
      closeHistory();
    } catch (err) {
      console.error(err);
      addMessage("assistant", ERROR_TEXT);
      closeHistory();
    }
  }

  async function deleteConversation(id, row) {
    if (!window.confirm("Supprimer cette conversation ?")) return;
    try {
      const { headers } = await authHeaders({});
      const res = await fetch(API + "/api/chat/history/" + encodeURIComponent(id), { method: "DELETE", headers });
      if (!res.ok) throw new Error("HTTP " + res.status);
      row.remove();
      if (String(id) === String(conversationId)) conversationId = null;
      if (!historyList.childElementCount) setListMessage("Aucune conversation pour le moment.", false);
    } catch (err) {
      console.error(err);
      window.alert(ERROR_TEXT);
    }
  }

  // -------- Mise en page mobile : barre de nav fixe + clavier --------
  const navEl = document.querySelector("nav.bottom-nav");
  const rootStyle = document.documentElement.style;

  function updateNavHeight() {
    if (navEl && !document.body.classList.contains("typing")) {
      rootStyle.setProperty("--nav-h", navEl.offsetHeight + "px");
    }
  }

  function updateViewportHeight() {
    const vv = window.visualViewport;
    if (vv) rootStyle.setProperty("--app-h", vv.height + "px");
    window.scrollTo(0, 0);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  input.addEventListener("focus", () => document.body.classList.add("typing"));
  input.addEventListener("blur", () => {
    document.body.classList.remove("typing");
    updateNavHeight();
  });

  window.addEventListener("resize", updateNavHeight);
  if (window.ResizeObserver && navEl) new ResizeObserver(updateNavHeight).observe(navEl);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", updateViewportHeight);
  // Le composeur est dans le flux de #ai-app : quand il grandit (jusqu'à 4 lignes),
  // la liste des messages rétrécit seule. On garde simplement le bas visible.
  if (window.ResizeObserver) {
    new ResizeObserver(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }).observe(composer);
  }

  updateNavHeight();
  updateViewportHeight();

  showGreeting();

})();
</script>
<script src="pwa-install.js"></script>

</body>
</html>
