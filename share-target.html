<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partager vers MAHOUTO+</title>
<style>
  body { background: #0A0A0A; color: #fff; font-family: system-ui; margin: 0; padding: 16px; }
  h2 { color: #FFC107; margin: 0 0 8px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
  .grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; background: #222; }
  .dest { padding: 12px; background: #1A1A1A; border-radius: 8px; margin: 8px 0; cursor: pointer; }
  .dest.active { border: 2px solid #FFC107; }
  textarea { width: 100%; background: #1A1A1A; border: 1px solid #333; color: #fff; border-radius: 8px; padding: 12px; box-sizing: border-box; }
  button { width: 100%; background: #FFC107; color: #000; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 16px; }
</style>
</head>
<body>

<h2>📦 Partager vers MAHOUTO+</h2>
<p id="count">0/10 fichiers</p>

<div class="grid" id="preview"></div>

<textarea id="text" rows="2" placeholder="Ajouter une légende..."></textarea>

<h3>💬 DESTINATION</h3>
<div id="destinations">
  <div class="dest" data-dest="support">Support</div>
  <div class="dest" data-dest="general">Général</div>
  <div class="dest" data-dest="annonces">Annonces MAJESTÉ PRESSE</div>
  <div class="dest" data-dest="serigraphes">LES SÉRIGRAPHES</div>
</div>

<button id="send">Envoyer vers MAHOUTO+</button>

<script>
let selectedFiles = [];
let selectedDest = null;

window.addEventListener('load', async () => {
  // Etape 1: Récupérer les fichiers envoyés par Android
  const formData = await new Request(window.location.href, {method: 'POST'}).formData().catch(() => new FormData());
  selectedFiles = formData.getAll('files');

  // Si rien en POST, on essaie l'URL
  if(selectedFiles.length === 0) {
    const params = new URLSearchParams(window.location.search);
    document.getElementById('text').value = params.get('text') || '';
  }

  // Etape 2: Afficher les miniatures + compteur
  document.getElementById('count').textContent = `${selectedFiles.length}/10 fichiers`;
  const preview = document.getElementById('preview');
  
  selectedFiles.forEach(file => {
    if(file.type.startsWith('image/')){
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    }
  });

  // Etape 3: Sélection destination
  document.querySelectorAll('.dest').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('.dest').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      selectedDest = el.dataset.dest;
    }
  });

  // Etape 4: Envoi
  document.getElementById('send').onclick = async () => {
    if(!selectedDest) return alert('Choisis une destination');
    if(selectedFiles.length === 0) return alert('Aucun fichier');

    const data = new FormData();
    data.append('destination', selectedDest);
    data.append('text', document.getElementById('text').value);
    selectedFiles.forEach(f => data.append('files', f));

    const res = await fetch('/api/upload', { method: 'POST', body: data });
    if(res.ok) alert('Envoyé !');
    else alert('Erreur envoi');
  };
});
</script>
</body>
</html>
