<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partager vers MAHOUTO+</title>
<style>
  body { background: #0A0A0A; color: #fff; font-family: sans-serif; margin: 0; padding: 16px; }
  h2 { color: #FFC107; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
  .grid img, .grid video { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; background: #222; }
  .file { padding: 8px; background: #1A1A1A; border-radius: 8px; margin: 4px 0; font-size: 12px; }
  textarea { width: 100%; background: #1A1A1A; border: 1px solid #333; color: #fff; border-radius: 8px; padding: 12px; }
  button { width: 100%; background: #FFC107; color: #000; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 16px; }
</style>
</head>
<body>

<h2>📦 Partager vers MAHOUTO+</h2>
<p id="count">Chargement...</p>

<div class="grid" id="preview"></div>

<textarea id="text" rows="3" placeholder="Ajouter une légende..."></textarea>

<h3>💬 DESTINATION</h3>
<div id="destinations">
  <div class="file">Support</div>
  <div class="file">Général</div>
  <div class="file">Annonces MAJESTÉ PRESSE</div>
  <div class="file">LES SÉRIGRAPHES</div>
</div>

<button id="send">Envoyer vers Mahouto</button>

<script>
window.addEventListener('DOMContentLoaded', async () => {
  if (window.location.pathname !== '/share-target.html') return;

  const url = new URL(window.location);
  const formData = new FormData();

  // Récupérer les fichiers partagés
  const files = [];
  for (const [key, value] of new URLSearchParams(url.search).entries()) {
    if (key === 'text') document.getElementById('text').value = value;
  }

  // Android envoie les fichiers en POST. On doit les récupérer
  if (navigator.share && navigator.canShare) {
    // Cas 1: Partage via Web Share Target API
    const sharedFiles = window.shareTargetFiles || [];
  }

  // Cas 2: Récupération via POST
  const form = await new Request(window.location, {method: 'POST'}).formData().catch(()=>new FormData());
  
  // Méthode qui marche sur 99% des Android :
  const shared = await navigator.shareTarget?.files || [];
  
  // Fallback : on parse l'URL
  const params = new URLSearchParams(window.location.search);
  
  // LA VRAIE METHODE : le navigateur a mis les fichiers dans le body
  const data = await fetch(window.location, {method: 'POST'}).then(r=>r.formData()).catch(()=>new FormData());
  const allFiles = data.getAll('files');

  const preview = document.getElementById('preview');
  document.getElementById('count').textContent = `${allFiles.length}/10 fichiers`;

  allFiles.forEach(file => {
    const url = URL.createObjectURL(file);
    
    if (file.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = url;
      preview.appendChild(img);
    } 
    else if (file.type.startsWith('video/')) {
      const vid = document.createElement('video');
      vid.src = url;
      vid.controls = true;
      preview.appendChild(vid);
    }
    else {
      const div = document.createElement('div');
      div.className = 'file';
      div.textContent = `📄 ${file.name}`;
      preview.appendChild(div);
    }
  });

  // Quand on clique envoyer
  document.getElementById('send').onclick = () => {
    const finalData = new FormData();
    finalData.append('text', document.getElementById('text').value);
    allFiles.forEach(f => finalData.append('files', f));
    
    fetch('/api/upload', { method: 'POST', body: finalData })
      .then(() => alert('Envoyé !'))
      .catch(() => alert('Erreur envoi'));
  };
});
</script>
</body>
</html>
