<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — MAHOUTO+</title>
<meta name="description" content="Profil public MAHOUTO+.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#FFC107">
<link rel="manifest" href="/manifest.json">
<script src="/brand.js"></script>
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/theme-toggle.js"></script>
<style>
  .pub { max-width: 560px; margin: 0 auto; padding: 20px 20px 110px; }
  .pub .back { display: inline-block; font-size: 13px; color: var(--gold); margin-bottom: 16px; }
  .pub .notice {
    font-size: 12.5px; line-height: 1.6; color: var(--text-muted);
    border: 1px solid var(--border); border-left: 3px solid var(--gold);
    background: var(--bg-elevated); border-radius: var(--radius-sm);
    padding: 10px 12px; margin-bottom: 16px;
  }
  .pub .card {
    border: 1px solid var(--border); background: var(--bg-card);
    border-radius: var(--radius-md); padding: 22px 18px; text-align: center;
  }
  .pub .avatar { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 12px; overflow: hidden; background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: var(--gold); }
  .pub .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pub h1 { font-size: 22px; line-height: 1.25; color: var(--white); margin-bottom: 4px; overflow-wrap: anywhere; }
  .pub .metier { font-size: 15px; color: var(--gold); margin-bottom: 4px; overflow-wrap: anywhere; }
  .pub .lieu { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; overflow-wrap: anywhere; }
  .pub .presentation { font-size: 14.5px; line-height: 1.7; color: var(--text-muted); margin: 12px 0 16px; overflow-wrap: anywhere; white-space: pre-line; }
  .pub .contact {
    display: inline-block; max-width: 100%; padding: 12px 20px; border-radius: var(--radius-md);
    background: var(--gold-bright); color: #0A0A0A; font-weight: 700; font-size: 15px; text-decoration: none; overflow-wrap: anywhere;
  }
  .pub .contact-note { font-size: 12px; color: var(--text-dim); margin-top: 8px; overflow-wrap: anywhere; }
  .pub .msg { text-align: center; padding: 30px 10px; }
  .pub .msg h1 { font-size: 18px; color: var(--white); }
  .pub .ecrire { margin-top: 18px; }
  .pub .btn-ecrire {
    display: inline-block; max-width: 100%; padding: 11px 22px; border-radius: var(--radius-md); border: 1px solid var(--gold);
    background: transparent; color: var(--gold); font-family: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer;
  }
  .pub .btn-ecrire:disabled { opacity: .5; cursor: not-allowed; }
  .pub .ecrire-aide { font-size: 12px; color: var(--text-dim); margin-top: 8px; overflow-wrap: anywhere; }
  .pub .ecrire-etat { font-size: 13px; line-height: 1.5; margin-top: 8px; color: var(--accent-green); overflow-wrap: anywhere; }
  .pub .ecrire-etat.erreur { color: #F87171; }
  .pub .signalement { margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--border); }
  .pub .sg-link { background: none; border: none; padding: 6px 4px; font-family: inherit; font-size: 12.5px; color: var(--text-dim); text-decoration: underline; cursor: pointer; }
  #sg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 90; display: flex; align-items: flex-end; justify-content: center; }
  #sg-overlay .sg-sheet { width: 100%; max-width: 480px; background: var(--bg-elevated); color: var(--white); border-radius: 20px 20px 0 0; padding: 16px 20px max(16px, env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; }
  #sg-overlay h2 { font-size: 16px; margin: 0 0 4px; }
  #sg-overlay .sg-help { font-size: 13px; color: var(--text-muted); margin: 0 0 10px; }
  #sg-overlay .sg-warning { font-size: 13px; font-weight: 600; color: var(--gold); margin: 0 0 10px; }
  #sg-overlay label.sg-option { display: flex; align-items: center; gap: 10px; padding: 9px 4px; font-size: 15px; cursor: pointer; }
  #sg-overlay textarea { width: 100%; min-height: 80px; resize: vertical; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--white); font-family: inherit; font-size: 15px; }
  #sg-overlay .sg-count { font-size: 12px; color: var(--text-dim); margin: 4px 0; }
  #sg-overlay .sg-status { min-height: 18px; font-size: 13px; margin: 8px 0; color: var(--accent-green); }
  #sg-overlay .sg-status.sg-error { color: #F87171; }
  #sg-overlay .sg-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  #sg-overlay .sg-actions button { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--white); font-family: inherit; font-size: 14px; cursor: pointer; }
  #sg-overlay .sg-actions button.sg-send { background: var(--gold-bright); color: #0A0A0A; border-color: var(--gold-bright); font-weight: 700; }
  #sg-overlay .sg-actions button:disabled { opacity: .5; cursor: not-allowed; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div class="page-content">
<main class="pub">
  <a class="back" href="/index.html">← Retour à l'accueil</a>
  <p class="notice hidden" id="bandeau" role="status"></p>

  <section class="msg" id="chargement"><p>Chargement…</p></section>

  <section class="msg hidden" id="etat"><h1 id="etat-titre"></h1></section>

  <article class="card hidden" id="profil">
    <div class="avatar" id="avatar"></div>
    <h1 id="nom"></h1>
    <div class="metier hidden" id="metier"></div>
    <div class="lieu hidden" id="lieu"></div>
    <p class="presentation hidden" id="presentation"></p>
    <div id="contact-zone"></div>
    <div class="ecrire hidden" id="ecrire-zone">
      <button type="button" class="btn-ecrire hidden" id="btn-ecrire">Écrire un message</button>
      <button type="button" class="sg-link hidden" id="btn-connexion-ecrire">Connectez-vous pour écrire à cette personne</button>
      <p class="ecrire-aide hidden" id="ecrire-aide">Votre message sera lu par cette personne. Restez respectueux.</p>
      <p class="ecrire-etat hidden" id="ecrire-etat" role="status"></p>
    </div>
    <div class="signalement hidden" id="signalement-zone">
      <button type="button" class="sg-link hidden" id="btn-signaler">Signaler cette page</button>
      <button type="button" class="sg-link hidden" id="btn-connexion-signaler">Connectez-vous pour signaler cette page</button>
    </div>
  </article>
</main>
</div>
