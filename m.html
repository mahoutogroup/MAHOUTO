<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — MAHOUTO+</title>
<meta name="description" content="Profil public MAHOUTO+.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#FFC107">
<link rel="manifest" href="/manifest.json">
<script src="/brand.js"></script>
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/theme-toggle.js"></script>
<style>
  .pub { max-width: 560px; margin: 0 auto; padding: 20px 20px 110px; }
  .pub .back { display: inline-block; font-size: 13px; color: var(--gold); margin-bottom: 16px; }
  .pub .notice {
    font-size: 12.5px; line-height: 1.6; color: var(--text-muted);
    border: 1px solid var(--border); border-left: 3px solid var(--gold);
    background: var(--bg-elevated); border-radius: var(--radius-sm);
    padding: 10px 12px; margin-bottom: 16px;
  }
  .pub .card {
    border: 1px solid var(--border); background: var(--bg-card);
    border-radius: var(--radius-md); padding: 22px 18px; text-align: center;
  }
  .pub .avatar { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 12px; overflow: hidden; background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: var(--gold); }
  .pub .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pub h1 { font-size: 22px; line-height: 1.25; color: var(--white); margin-bottom: 4px; overflow-wrap: anywhere; }
  .pub .metier { font-size: 15px; color: var(--gold); margin-bottom: 4px; overflow-wrap: anywhere; }
  .pub .lieu { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; overflow-wrap: anywhere; }
  .pub .presentation { font-size: 14.5px; line-height: 1.7; color: var(--text-muted); margin: 12px 0 16px; overflow-wrap: anywhere; white-space: pre-line; }
  .pub .contact {
    display: inline-block; max-width: 100%; padding: 12px 20px; border-radius: var(--radius-md);
    background: var(--gold-bright); color: #0A0A0A; font-weight: 700; font-size: 15px; text-decoration: none; overflow-wrap: anywhere;
  }
  .pub .contact-note { font-size: 12px; color: var(--text-dim); margin-top: 8px; overflow-wrap: anywhere; }
  .pub .msg { text-align: center; padding: 30px 10px; }
  .pub .msg h1 { font-size: 18px; color: var(--white); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div class="page-content">
<main class="pub">
  <a class="back" href="/index.html">← Retour à l'accueil</a>
  <p class="notice hidden" id="bandeau" role="status"></p>

  <section class="msg" id="chargement"><p>Chargement…</p></section>

  <section class="msg hidden" id="etat"><h1 id="etat-titre"></h1></section>

  <article class="card hidden" id="profil">
    <div class="avatar" id="avatar"></div>
    <h1 id="nom"></h1>
    <div class="metier hidden" id="metier"></div>
    <div class="lieu hidden" id="lieu"></div>
    <p class="presentation hidden" id="presentation"></p>
    <div id="contact-zone"></div>
  </article>
</main>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="/index.html"><span class="icon">🏠</span>Accueil</a>
  <a class="nav-item" href="/discussions.html"><span class="icon">💬</span>Messages</a>
  <a class="nav-item" href="/ai.html"><span class="icon">🧠</span>MAHOUTO AI</a>
  <a class="nav-item" href="/school.html"><span class="icon">🎓</span>School</a>
  <a class="nav-item" href="/profil.html"><span class="icon">👤</span>Profil</a>
</nav>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/profil-public-utils.js"></script>
<script src="/m.js"></script>
<script src="/pwa-install.js"></script>
</body>
</html>
