<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit — MAHOUTO+</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css">
<script src="theme-toggle.js"></script>
<style>
  #loading-state, #error-state { text-align: center; color: var(--text-dim); padding: 80px 24px; font-size: 14px; }

  .cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: linear-gradient(135deg, rgba(212,175,55,.25), rgba(0,0,0,.4)); display: flex; align-items: center; justify-content: center; font-size: 60px; }

  .detail-body { padding: 18px 20px 110px; display: flex; flex-direction: column; gap: 14px; }
  .badge { align-self: flex-start; font-size: 11px; font-weight: 700; color: #0A0A0A; background: var(--gold-bright); padding: 4px 12px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
  .detail-body h1 { font-size: 22px; line-height: 1.3; }

  .meta-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-muted); }
  .meta-row span { display: flex; align-items: center; gap: 5px; }

  .price-block { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .price-block .old { text-decoration: line-through; color: var(--text-dim); font-size: 14px; }
  .price-block .now { font-size: 24px; font-weight: bold; color: var(--gold); }

  .section-block { display: flex; flex-direction: column; gap: 8px; }
  .section-block h2 { font-size: 14.5px; color: var(--gold); }
  .section-block p { font-size: 13.5px; color: var(--text-muted); line-height: 1.7; }

  .owned-banner { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--accent-green); background: rgba(34,197,94,.12); padding: 10px 14px; border-radius: 12px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 0; }
  .share-btn { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--gold); background: rgba(212,175,55,.12); border: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .share-btn:active { opacity: .7; }

  .sticky-buy {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    background: var(--bg-elevated); border-top: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center;
  }
  .sticky-buy .sticky-price { font-size: 15px; font-weight: bold; color: var(--gold); flex: none; }
  .sticky-buy button { flex: 1; font-size: 14.5px; font-weight: bold; background: var(--gold-bright); color: #0A0A0A; border: none; border-radius: 12px; padding: 14px; cursor: pointer; }
  .sticky-buy button.owned { background: rgba(34,197,94,.18); color: var(--accent-green); }
  .sticky-buy button:disabled { opacity: .6; cursor: wait; }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div class="page-content">
  <div id="loading-state">Chargement du produit...</div>
  <div id="error-state" class="hidden">Produit introuvable.</div>
  <div id="detail-content" class="hidden"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const cfg = window.MAHOUTO_CONFIG;
  const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  const TYPE_LABELS = { pdf: "PDF", ebook: "EBOOK", video: "VIDÉO", audio: "AUDIO", zip: "ZIP", template: "TEMPLATE", document: "DOCUMENT", other: "AUTRE" };
  const TYPE_EMOJI = { pdf: "📕", ebook: "📚", video: "🎬", audio: "🎧", zip: "📦", template: "🎨", document: "📄", other: "📁" };
  const ACCESS_LABEL = { video: "▶️ Accéder à la vidéo", audio: "▶️ Accéder à l'audio" };

  const loadingEl = document.getElementById("loading-state");
  const errorEl = document.getElementById("error-state");
  const contentEl = document.getElementById("detail-content");

  function money(xof) { return Number(xof).toLocaleString("fr-FR") + " FCFA"; }
  function formatSize(bytes) {
    if (!bytes) return "";
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " Ko";
    return (bytes / (1024 * 1024)).toFixed(1) + " Mo";
  }
  function optimizedImageUrl(url, width) {
    if (!url || !url.includes("/upload/")) return url;
    return url.replace("/upload/", `/upload/f_auto,q_auto,w_${width},c_limit/`);
  }

  let currentUser = null;

  async function ensureLoggedIn() {
    const { data } = await supabase.auth.getSession();
    if (data && data.session && data.session.user) { currentUser = data.session.user; return true; }
    return false;
  }

  async function checkOwned(productId) {
    if (!currentUser) return false;
    const { data } = await supabase
      .from("purchases").select("id").eq("user_id", currentUser.id)
      .eq("course_id", productId).eq("product_type", "digital_product").eq("status", "paid").maybeSingle();
    return !!data;
  }

  async function buy(productId, btn) {
    if (!(await ensureLoggedIn())) {
      alert("Connecte-toi d'abord pour acheter ce produit.");
      window.location.href = "index.html";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Redirection...";
    try {
      const { data: sessionData } = await supabase.auth.getSession();
      const accessToken = sessionData && sessionData.session ? sessionData.session.access_token : null;
      if (!accessToken) throw new Error("Session expirée, reconnecte-toi.");

      const resp = await fetch("/api/fedapay-checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + accessToken },
        body: JSON.stringify({ courseId: productId, productType: "digital_product" })
      });
      const data = await resp.json();
      if (!resp.ok || !data.checkoutUrl) throw new Error(data.error || "Réponse de paiement invalide.");
      window.location.href = data.checkoutUrl;
    } catch (err) {
      console.error(err);
      alert("Paiement indisponible : " + err.message);
      btn.disabled = false;
      btn.textContent = "🔒 Acheter maintenant";
    }
  }

  async function accessProduct(productId, btn, productType) {
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = "Préparation de votre téléchargement...";

    try {
      const { data: sessionData } = await supabase.auth.getSession();
      const accessToken = sessionData && sessionData.session ? sessionData.session.access_token : null;
      if (!accessToken) throw new Error("Session expirée, reconnecte-toi.");

      const resp = await fetch("/api/digital-products-download", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + accessToken },
        body: JSON.stringify({ productId })
      });
      const data = await resp.json();
      if (!resp.ok || !data.url) throw new Error(data.error || "Lien indisponible.");

      btn.textContent = "Votre fichier est prêt.";
      window.location.href = data.url;
      setTimeout(() => { btn.disabled = false; btn.textContent = originalText; }, 1500);
    } catch (err) {
      console.error(err);
      alert("Accès impossible : " + err.message);
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  function shareUrlFor(productId) {
    return `${window.location.origin}/p/${encodeURIComponent(productId)}`;
  }

  async function shareProduct(productId, product) {
    const amount = product.promotion ?? product.prix;
    const url = shareUrlFor(productId);
    const text = `${product.nom} — ${money(amount)}`;

    if (navigator.share) {
      try {
        await navigator.share({ title: product.nom, text, url });
        return;
      } catch (err) {
        // L'utilisateur a annulé le partage natif : pas d'erreur à afficher.
        if (err && err.name === "AbortError") return;
      }
    }

    // Repli (desktop / navigateurs sans Web Share API) :
    // on ouvre WhatsApp Web avec le message pré-rempli, et on copie
    // aussi le lien dans le presse-papier au cas où.
    try {
      await navigator.clipboard.writeText(`${text}\n${url}`);
    } catch (err) { /* presse-papier indisponible, on continue quand même */ }

    window.open(`https://wa.me/?text=${encodeURIComponent(text + "\n" + url)}`, "_blank");
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    if (!productId) {
      loadingEl.classList.add("hidden");
      errorEl.classList.remove("hidden");
      return;
    }

    const { data: product, error } = await supabase
      .from("digital_products").select("*").eq("id", productId).maybeSingle();

    if (error || !product) {
      loadingEl.classList.add("hidden");
      errorEl.classList.remove("hidden");
      return;
    }

    await ensureLoggedIn();
    const owned = await checkOwned(productId);

    const amount = product.promotion ?? product.prix;
    const originalAmount = product.promotion ? product.prix : null;

    contentEl.innerHTML = `
      <div class="top-bar">
        <a href="produits.html" style="font-size:12.5px;color:var(--text-muted);text-decoration:none;">← Retour à la boutique</a>
        <button id="share-btn" class="share-btn" type="button">📤 Partager</button>
      </div>

      ${product.image_url
        ? `<img class="cover" src="${optimizedImageUrl(product.image_url, 1000)}" alt="${product.nom}">`
        : `<div class="cover">${TYPE_EMOJI[product.type] || "📁"}</div>`}

      <div class="detail-body">
        <span class="badge">${TYPE_LABELS[product.type] || product.type}</span>
        <h1>${product.nom}</h1>

        <div class="meta-row">
          ${product.domaine ? `<span>🏷️ ${product.domaine}</span>` : ""}
          ${product.file_size ? `<span>💾 ${formatSize(product.file_size)}</span>` : ""}
        </div>

        <div class="price-block">
          ${originalAmount ? `<span class="old">${money(originalAmount)}</span>` : ""}
          <span class="now">${money(amount)}</span>
        </div>

        ${owned ? `<div class="owned-banner">✓ Vous possédez déjà ce produit</div>` : ""}

        <div class="section-block">
          <h2>📝 Description</h2>
          <p>${(product.description_longue || product.description || "").replace(/\n/g, "<br>")}</p>
        </div>
      </div>
    `;

    loadingEl.classList.add("hidden");
    contentEl.classList.remove("hidden");

    const shareBtn = document.getElementById("share-btn");
    if (shareBtn) shareBtn.addEventListener("click", () => shareProduct(productId, product));

    const sticky = document.createElement("div");
    sticky.className = "sticky-buy";

    const accessLabel = ACCESS_LABEL[product.type] || "📥 Télécharger";
    const buyLabel = product.disponible ? "🔒 Acheter maintenant" : "Indisponible";

    sticky.innerHTML = `
      <div class="sticky-price">${money(amount)}</div>
      <button id="action-btn" class="${owned ? "owned" : ""}" ${!product.disponible && !owned ? "disabled" : ""}>
        ${owned ? accessLabel : buyLabel}
      </button>
    `;
    document.body.appendChild(sticky);

    const actionBtn = document.getElementById("action-btn");
    if (owned) {
      actionBtn.addEventListener("click", () => accessProduct(productId, actionBtn, product.type));
    } else if (product.disponible) {
      actionBtn.addEventListener("click", () => buy(productId, actionBtn));
    }
  }

  init();
})();
</script>
<script src="pwa-install.js"></script>

</body>
</html>
