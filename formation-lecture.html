<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formation — MAHOUTO+</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css">
<script src="theme-toggle.js"></script>
<style>
  #loading-state, #error-state {
    text-align: center; color: var(--text-dim); padding: 80px 24px; font-size: 14px;
  }

  header.top { padding: 14px 20px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
  header.top a.back { font-size: 12.5px; color: var(--text-muted); text-decoration: none; }
  header.top h1 { font-size: 16.5px; margin-top: 6px; }

  .player-wrap {
    width: 100%; aspect-ratio: 16/9; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .player-wrap video { width: 100%; height: 100%; }
  .player-placeholder { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px; }

  .quiz-container { padding: 16px; }
  .quiz-title { font-size: 16px; margin-bottom: 10px; }
  .quiz-already-passed { font-size: 12.5px; color: var(--accent-green); margin-bottom: 14px; }
  .quiz-question { margin-bottom: 18px; }
  .quiz-question-text { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .quiz-choice {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px;
    cursor: pointer; font-size: 13.5px;
  }
  .quiz-choice input { accent-color: var(--gold); }
  .quiz-submit-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: var(--gold-bright); color: #0A0A0A; font-weight: bold; font-size: 14px;
    cursor: pointer; font-family: inherit; margin-top: 6px;
  }
  .quiz-submit-btn:disabled { opacity: .6; }
  .quiz-result { margin-top: 14px; padding: 12px; border-radius: 10px; font-weight: bold; text-align: center; }
  .quiz-result.quiz-passed { background: rgba(34,197,94,.15); color: var(--accent-green); }
  .quiz-result.quiz-failed { background: rgba(248,113,113,.15); color: #F87171; }

  .current-lesson-bar {
    padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .current-lesson-bar .titre { font-size: 14px; font-weight: 600; }
  .mark-done-btn {
    font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 10px;
    border: none; background: var(--gold-bright); color: #0A0A0A; cursor: pointer; white-space: nowrap;
  }
  .mark-done-btn.done { background: rgba(34,197,94,.18); color: var(--accent-green); }
  .mark-done-btn:disabled { opacity: .6; cursor: wait; }
  .cast-btn {
    width: 34px; height: 34px; flex: none; border-radius: 50%; border: none;
    background: var(--bg-card); color: var(--white); font-size: 14px; cursor: pointer;
  }
  .cast-btn.hidden { display: none; }
  .cast-btn.cast-active { background: var(--gold-bright); color: #0A0A0A; }

  .modules-area { padding: 12px 20px 100px; }
  .module-block { margin-bottom: 18px; }
  .module-block h2 { font-size: 13.5px; color: var(--gold); margin-bottom: 8px; }

  .lesson-item {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--bg-card);
    margin-bottom: 8px; cursor: pointer;
  }
  .lesson-item.active { border-color: var(--gold); }
  .lesson-item .check {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    border: 1px solid var(--border); color: var(--text-dim);
  }
  .lesson-item.completed .check { background: var(--accent-green); border-color: var(--accent-green); color: #0A0A0A; }
  .lesson-item .titre { font-size: 13.5px; flex: 1; }
  .lesson-item .preview-tag { font-size: 10px; color: var(--gold); font-weight: 700; flex: none; }

  .lesson-item.locked { opacity: .7; }
  .lesson-item.locked .check { color: var(--gold); border-color: var(--gold); }

  .locked-msg {
    text-align: center; color: var(--text-dim); font-size: 13px; padding: 60px 24px;
  }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div class="page-content">
  <div id="loading-state">Chargement de la formation...</div>
  <div id="error-state" class="hidden">Formation introuvable ou accès non autorisé.</div>
  <div id="content" class="hidden"></div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="icon">🏠</span>Accueil</a>
  <a class="nav-item" href="discussions.html"><span class="icon">💬</span>Messages</a>
  <a class="nav-item" href="https://ai.majestepresse.com/chat" target="_blank" rel="noopener"><span class="icon">🧠</span>MAHOUTO AI</a>
  <a class="nav-item active" href="school.html"><span class="icon">🎓</span>School</a>
  <a class="nav-item" href="profil.html"><span class="icon">👤</span>Profil</a>
</nav>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const cfg = window.MAHOUTO_CONFIG;
  const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  const loadingEl = document.getElementById("loading-state");
  const errorEl = document.getElementById("error-state");
  const contentEl = document.getElementById("content");

  const params = new URLSearchParams(window.location.search);
  const courseId = params.get("course");

  let currentUser = null;
  let allLessons = []; // à plat, avec module_titre
  let progressMap = new Map(); // lesson_id -> completed
  let currentLessonId = null;
  let formationTitle = "";

  // ---------- Google Cast (même mécanisme validé pour les salons —
  // cast-prototype.html, 24/09/2026 — Default Media Receiver de
  // Google, aucun récepteur personnalisé nécessaire) ----------
  let currentVideoUrl = null;
  let currentLessonTitleForCast = "";
  let castContext = null;
  let castAvailable = false;

  window["__onGCastApiAvailable"] = function (isAvailable) {
    if (!isAvailable) return;
    castContext = cast.framework.CastContext.getInstance();
    castContext.setOptions({
      receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
    });
    castAvailable = true;
    const btn = document.getElementById("cast-btn");
    if (btn && currentVideoUrl) btn.classList.remove("hidden");

    castContext.addEventListener(
      cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
      (e) => {
        const connected = e.sessionState === cast.framework.SessionState.SESSION_STARTED
          || e.sessionState === cast.framework.SessionState.SESSION_RESUMED;
        const b = document.getElementById("cast-btn");
        if (b) b.classList.toggle("cast-active", connected);
      }
    );
  };

  function castCurrentLesson() {
    const session = castContext.getCurrentSession();
    if (!session || !currentVideoUrl) return;
    const mediaInfo = new chrome.cast.media.MediaInfo(currentVideoUrl, "video/mp4");
    mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
    mediaInfo.metadata.title = currentLessonTitleForCast;
    session.loadMedia(new chrome.cast.media.LoadRequest(mediaInfo)).then(
      () => {
        const v = document.querySelector("#player-wrap video");
        if (v) v.pause(); // évite la double lecture (local + TV)
      },
      (err) => console.error("[COURSE] Cast : échec de l'envoi à la TV", err)
    );
  }

  document.addEventListener("click", (e) => {
    if (e.target && e.target.id === "cast-btn") {
      if (!castAvailable || !castContext) return;
      const session = castContext.getCurrentSession();
      if (session) castCurrentLesson();
      else castContext.requestSession().then(() => castCurrentLesson(), () => {});
    }
  });

  async function getAccessToken() {
    const { data } = await supabase.auth.getSession();
    return data && data.session ? data.session.access_token : null;
  }

  // Point d'entrée serveur unique pour MAHOUTO SCHOOL — voir /api/course.js
  async function callCourseApi(action, payload) {
    const token = await getAccessToken();
    const resp = await fetch("/api/course", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ action, ...payload })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Erreur serveur.");
    return data;
  }

  async function ensureLoggedIn() {
    const { data } = await supabase.auth.getSession();
    if (data && data.session && data.session.user) {
      currentUser = data.session.user;
      return true;
    }
    return false;
  }

  async function checkOwned() {
    const { data } = await supabase
      .from("purchases")
      .select("id")
      .eq("user_id", currentUser.id)
      .eq("course_id", courseId)
      .eq("product_type", "formation")
      .eq("status", "paid")
      .maybeSingle();
    return !!data;
  }

  // NOTE SÉCURITÉ : cette valeur ne sert qu'à l'affichage (cadenas,
  // message avant clic). L'autorité réelle reste /api/course.js, qui
  // revérifie systématiquement l'achat côté serveur avant de délivrer
  // une URL vidéo — même si ce flag client était falsifié, la vidéo
  // resterait inaccessible.
  let userOwnsFormation = false;

  async function loadContent(formation) {
    formationTitle = formation.nom;
    const { data: modules } = await supabase
      .from("formation_modules")
      .select("*")
      .eq("formation_id", courseId)
      .order("ordre", { ascending: true });

    allLessons = [];
    const moduleBlocks = [];

    for (const mod of (modules || [])) {
      const { data: lessons } = await supabase
        .from("formation_lessons")
        .select("*")
        .eq("module_id", mod.id)
        .order("ordre", { ascending: true });

      (lessons || []).forEach((l) => allLessons.push(l));
      moduleBlocks.push({ module: mod, lessons: lessons || [] });
    }

    if (currentUser) {
      const lessonIds = allLessons.map((l) => l.id);
      if (lessonIds.length) {
        const { data: progress } = await supabase
          .from("course_progress")
          .select("lesson_id, completed")
          .eq("user_id", currentUser.id)
          .in("lesson_id", lessonIds);
        (progress || []).forEach((p) => progressMap.set(p.lesson_id, p.completed));
      }
    }

    renderLayout(formation, moduleBlocks);
  }

  function renderLayout(formation, moduleBlocks) {
    contentEl.innerHTML = `
      <header class="top">
        <a class="back" href="formation-detail.html?course=${encodeURIComponent(courseId)}">← Retour à la formation</a>
        <h1 id="formation-h1"></h1>
      </header>

      <div class="player-wrap" id="player-wrap">
        <div class="player-placeholder">Sélectionnez une leçon ci-dessous pour commencer.</div>
      </div>

      <div class="current-lesson-bar hidden" id="current-lesson-bar">
        <span class="titre" id="current-lesson-title"></span>
        <button class="cast-btn hidden" id="cast-btn" title="Caster sur une TV">📺</button>
        <button class="mark-done-btn" id="mark-done-btn">Marquer comme terminée</button>
      </div>

      <div class="modules-area" id="modules-area"></div>
    `;

    // formation.nom vient de la base : jamais interpolé dans du HTML,
    // toujours affecté via textContent.
    document.getElementById("formation-h1").textContent = formation.nom;

    const modulesArea = document.getElementById("modules-area");
    moduleBlocks.forEach(({ module: mod, lessons }) => {
      const block = document.createElement("div");
      block.className = "module-block";

      const h2 = document.createElement("h2");
      h2.textContent = mod.titre; // donnée Supabase : textContent, jamais innerHTML
      block.appendChild(h2);

      lessons.forEach((lesson) => {
        const completed = !!progressMap.get(lesson.id);
        const locked = !lesson.is_preview && !userOwnsFormation;

        const item = document.createElement("div");
        item.className = "lesson-item" + (completed ? " completed" : "") + (locked ? " locked" : "");
        item.dataset.lessonId = lesson.id;

        const checkSpan = document.createElement("span");
        checkSpan.className = "check";
        checkSpan.textContent = completed ? "✓" : locked ? "🔒" : "";
        item.appendChild(checkSpan);

        const titreSpan = document.createElement("span");
        titreSpan.className = "titre";
        titreSpan.textContent = lesson.titre; // donnée Supabase : textContent, jamais innerHTML
        item.appendChild(titreSpan);

        if (lesson.is_preview) {
          const previewTag = document.createElement("span");
          previewTag.className = "preview-tag";
          previewTag.textContent = "APERÇU"; // texte fixe, sans donnée utilisateur
          item.appendChild(previewTag);
        }

        item.addEventListener("click", () => playLesson(lesson, locked));
        block.appendChild(item);
      });

      modulesArea.appendChild(block);
    });

    document.getElementById("mark-done-btn").addEventListener("click", markCurrentDone);
  }

  async function playLesson(lesson, locked) {
    currentLessonId = lesson.id;

    document.querySelectorAll(".lesson-item").forEach((el) => {
      el.classList.toggle("active", Number(el.dataset.lessonId) === lesson.id);
    });

    const playerWrap = document.getElementById("player-wrap");
    const barEl = document.getElementById("current-lesson-bar");

    if (locked) {
      // Court-circuit d'affichage uniquement : même sans ceci, un
      // clic forcé appellerait course.js, qui refuserait avec 403.
      playerWrap.innerHTML = `
        <div class="player-placeholder">
          🔒 Cette leçon fait partie du contenu payant.<br>
          <a href="formation-detail.html?course=${encodeURIComponent(courseId)}" style="color:var(--gold);">Acheter la formation pour la débloquer</a>
        </div>`;
      barEl.classList.add("hidden");
      currentVideoUrl = null;
      document.getElementById("cast-btn") && document.getElementById("cast-btn").classList.add("hidden");
      return;
    }

    if (lesson.type === "quiz") {
      // Le quiz gère sa propre validation (grade_quiz, côté serveur) —
      // pas de bouton "Marquer comme terminée" ni de Cast pour ce type
      // de leçon.
      barEl.classList.add("hidden");
      document.getElementById("cast-btn") && document.getElementById("cast-btn").classList.add("hidden");
      currentVideoUrl = null;
      await playQuiz(lesson);
      return;
    }

    playerWrap.innerHTML = `<div class="player-placeholder">⏳ Chargement de la vidéo...</div>`;

    barEl.classList.remove("hidden");
    document.getElementById("current-lesson-title").textContent = lesson.titre;

    const btn = document.getElementById("mark-done-btn");
    const completed = !!progressMap.get(lesson.id);
    btn.className = "mark-done-btn" + (completed ? " done" : "");
    btn.textContent = completed ? "✓ Terminée" : "Marquer comme terminée";

    try {
      const data = await callCourseApi("lesson-video-url", { lessonId: lesson.id });
      playerWrap.innerHTML = ""; // vide le conteneur (placeholder statique, sans donnée)
      const videoEl = document.createElement("video");
      videoEl.controls = true;
      videoEl.playsInline = true;
      videoEl.src = data.url; // affecté en propriété, jamais interpolé dans du HTML
      playerWrap.appendChild(videoEl);

      // Pour le bouton Cast : mêmes règles d'accès, même URL signée
      // Cloudinary que celle déjà affectée à la balise <video> ci-dessus
      // — rien de dupliqué ni de recalculé séparément.
      currentVideoUrl = data.url;
      currentLessonTitleForCast = lesson.titre || "Leçon";
      if (castAvailable) document.getElementById("cast-btn").classList.remove("hidden");
    } catch (err) {
      console.error(err);
      playerWrap.innerHTML = "";
      const errDiv = document.createElement("div");
      errDiv.className = "player-placeholder";
      errDiv.textContent = "❌ " + err.message; // jamais interpolé dans du HTML
      playerWrap.appendChild(errDiv);
      currentVideoUrl = null;
      document.getElementById("cast-btn").classList.add("hidden");
    }
  }

  // -------- Quiz --------
  // Les questions arrivent SANS la bonne réponse (get_quiz_questions
  // ne l'expose jamais). La correction se fait entièrement côté
  // serveur (grade_quiz) — impossible de tricher en lisant le réseau
  // ou en modifiant le JavaScript de cette page.
  async function playQuiz(lesson) {
    const playerWrap = document.getElementById("player-wrap");
    playerWrap.innerHTML = `<div class="player-placeholder">⏳ Chargement du quiz...</div>`;

    const { data: questions, error } = await supabase.rpc("get_quiz_questions", { p_lesson_id: lesson.id });
    if (error || !questions || !questions.length) {
      playerWrap.innerHTML = "";
      const errDiv = document.createElement("div");
      errDiv.className = "player-placeholder";
      errDiv.textContent = "❌ Impossible de charger ce quiz pour le moment.";
      playerWrap.appendChild(errDiv);
      console.error(error);
      return;
    }

    renderQuizForm(lesson, questions);
  }

  function renderQuizForm(lesson, questions) {
    const playerWrap = document.getElementById("player-wrap");
    playerWrap.innerHTML = "";

    const container = document.createElement("div");
    container.className = "quiz-container";

    const title = document.createElement("h2");
    title.className = "quiz-title";
    title.textContent = lesson.titre; // donnée Supabase : textContent uniquement
    container.appendChild(title);

    const alreadyDone = !!progressMap.get(lesson.id);
    if (alreadyDone) {
      const badge = document.createElement("div");
      badge.className = "quiz-already-passed";
      badge.textContent = "✓ Déjà réussi — vous pouvez repasser le quiz si vous le souhaitez.";
      container.appendChild(badge);
    }

    questions.forEach((q, qIndex) => {
      const block = document.createElement("div");
      block.className = "quiz-question";

      const qText = document.createElement("div");
      qText.className = "quiz-question-text";
      qText.textContent = (qIndex + 1) + ". " + q.question; // textContent uniquement
      block.appendChild(qText);

      const choices = Array.isArray(q.choices) ? q.choices : [];
      choices.forEach((choiceText, cIndex) => {
        const label = document.createElement("label");
        label.className = "quiz-choice";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "quiz-q-" + qIndex;
        radio.value = String(cIndex);

        const span = document.createElement("span");
        span.textContent = choiceText; // textContent uniquement — jamais innerHTML

        label.appendChild(radio);
        label.appendChild(span);
        block.appendChild(label);
      });

      container.appendChild(block);
    });

    const submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.className = "quiz-submit-btn";
    submitBtn.textContent = "Valider mes réponses";

    const resultDiv = document.createElement("div");
    resultDiv.className = "quiz-result hidden";

    submitBtn.addEventListener("click", async () => {
      const answers = questions.map((_, qIndex) => {
        const checked = container.querySelector(`input[name="quiz-q-${qIndex}"]:checked`);
        return checked ? parseInt(checked.value, 10) : -1;
      });

      if (answers.includes(-1)) {
        alert("Merci de répondre à toutes les questions avant de valider.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Correction en cours...";

      const { data, error } = await supabase.rpc("grade_quiz", {
        p_lesson_id: lesson.id,
        p_answers: answers
      });

      submitBtn.disabled = false;
      submitBtn.textContent = "Valider mes réponses";

      if (error) {
        alert("Impossible de corriger le quiz : " + error.message);
        console.error(error);
        return;
      }

      const result = Array.isArray(data) ? data[0] : data;
      resultDiv.classList.remove("hidden");
      resultDiv.className = "quiz-result " + (result.passed ? "quiz-passed" : "quiz-failed");
      resultDiv.textContent = result.passed
        ? `✓ Réussi ! Score : ${result.score}/${result.total}`
        : `✗ Pas encore — Score : ${result.score}/${result.total} (70% requis). Vous pouvez réessayer.`;

      if (result.passed) {
        progressMap.set(lesson.id, true);
        const item = document.querySelector(`.lesson-item[data-lesson-id="${lesson.id}"]`);
        if (item) {
          item.classList.add("completed");
          const check = item.querySelector(".check");
          if (check) check.textContent = "✓";
        }
        await maybeIssueCertificate();
      }
    });

    container.appendChild(submitBtn);
    container.appendChild(resultDiv);
    playerWrap.appendChild(container);
  }

  async function markCurrentDone() {
    if (!currentLessonId || !currentUser) return;
    const btn = document.getElementById("mark-done-btn");
    btn.disabled = true;

    const { error } = await supabase.from("course_progress").upsert({
      user_id: currentUser.id,
      lesson_id: currentLessonId,
      completed: true,
      updated_at: new Date().toISOString()
    });

    btn.disabled = false;

    if (error) {
      alert("Erreur : " + error.message);
      return;
    }

    progressMap.set(currentLessonId, true);
    btn.className = "mark-done-btn done";
    btn.textContent = "✓ Terminée";
    const item = document.querySelector(`.lesson-item[data-lesson-id="${currentLessonId}"]`);
    if (item) {
      item.classList.add("completed");
      item.querySelector(".check").textContent = "✓";
    }

    maybeIssueCertificate();
  }

  // Délivrance automatique du certificat : uniquement si TOUTES les
  // leçons de la formation sont maintenant marquées terminées. La
  // vraie vérification est faite côté serveur par la policy RLS
  // "certificates_insert_auto" (voir sql/2026-09-certificates.sql) —
  // ce contrôle client n'est qu'une optimisation pour éviter une
  // tentative d'insertion inutile, jamais la source d'autorité.
  async function maybeIssueCertificate() {
    if (!currentUser || !courseId || !allLessons.length) return;
    const allDone = allLessons.every((l) => progressMap.get(l.id) === true);
    if (!allDone) return;

    // Le code de vérification est désormais généré par PostgreSQL
    // (valeur par défaut de la colonne) — jamais par le navigateur,
    // pour éliminer tout risque de collision ou de manipulation.
    const { error } = await supabase.from("certificates").insert({
      user_id: currentUser.id,
      formation_id: courseId,
      formation_title: formationTitle || "Formation MAHOUTO School",
      issued_by: "auto",
      status: "issued"
    });

    // Une erreur ici est normale et silencieuse si le certificat
    // existe déjà (contrainte unique user_id+formation_id) — pas la
    // peine de déranger l'utilisateur pour ce cas.
    if (!error) {
      console.log("[CERTIFICAT] délivré automatiquement pour", formationTitle);
    }
  }

  async function init() {
    if (!courseId) {
      loadingEl.classList.add("hidden");
      errorEl.classList.remove("hidden");
      return;
    }

    if (!(await ensureLoggedIn())) {
      window.location.href = "formation-detail.html?course=" + encodeURIComponent(courseId);
      return;
    }

    // Ne bloque plus l'accès à la page : un utilisateur non-acheteur
    // doit pouvoir ouvrir formation-lecture.html pour voir les leçons
    // en aperçu gratuit (is_preview = true). L'accès à chaque leçon
    // payante reste vérifié par /api/course.js, jamais ici.
    userOwnsFormation = await checkOwned();

    const { data: formation, error } = await supabase
      .from("formations").select("*").eq("id", courseId).maybeSingle();

    if (error || !formation) {
      loadingEl.classList.add("hidden");
      errorEl.classList.remove("hidden");
      return;
    }
