<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devenir vendeur — Le Sérigraphe by MAJESTÉ PRESSE</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<script src="brand.js"></script>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css">
<script src="theme-toggle.js"></script>
<style>
  header { padding: 20px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 20px; color: var(--gold); }
  header p { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }

  .top-bar { display: flex; align-items: center; padding: 14px 20px 0; }
  .back-link { font-size: 12.5px; font-weight: 700; color: var(--gold); }

  #loading-state { text-align: center; color: var(--text-dim); padding: 60px 24px; font-size: 14px; }

  .panel { margin: 18px 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .panel h2 { font-size: 15px; color: var(--gold); }
  .panel p { font-size: 13.5px; color: var(--text-muted); line-height: 1.7; }
  .panel .shop-recap { font-size: 12.5px; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 10px; line-height: 1.6; }

  .status-pill { align-self: flex-start; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
  .status-pill.pending { background: rgba(212,175,55,.15); color: var(--gold); }
  .status-pill.approved { background: rgba(34,197,94,.15); color: var(--accent-green); }
  .status-pill.rejected, .status-pill.suspended { background: rgba(239,68,68,.15); color: #F87171; }

  .action-link { align-self: flex-start; font-size: 13px; font-weight: bold; padding: 11px 18px; border-radius: 12px; background: var(--gold-bright); color: #0A0A0A; }
  .action-link.wa { background: #25D366; color: #fff; }
  button.action-link { border: none; cursor: pointer; font-family: inherit; }

  #vendor-form label { font-size: 11.5px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  #vendor-form input, #vendor-form textarea {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--white); font-size: 14px; font-family: inherit;
  }
  #vendor-form textarea { resize: vertical; min-height: 90px; }
  #vendor-form button[type="submit"] { margin-top: 4px; background: var(--gold-bright); color: #0A0A0A; border: none; border-radius: 12px; padding: 13px; font-weight: bold; font-size: 14.5px; cursor: pointer; }
  #vendor-form button[type="submit"]:disabled { opacity: .5; cursor: wait; }
  #form-status { font-size: 12.5px; min-height: 16px; color: var(--accent-green); }
  #form-status.error { color: #F87171; }
  .hint { font-size: 11px; color: var(--text-dim); }

  .stats-panel .stats-head { display: flex; flex-direction: column; gap: 4px; }
  .stats-panel .stats-head p { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
  .stats-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .stats-chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .stats-chip.active { background: var(--gold-bright); color: #0A0A0A; border-color: var(--gold-bright); }
  .stats-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stats-kpi { padding: 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--border); text-align: center; }
  .stats-kpi.wide { grid-column: 1 / -1; }
  .stats-kpi .value { font-size: 22px; font-weight: bold; color: var(--gold); overflow-wrap: anywhere; }
  .stats-kpi.wide .value { font-size: 15px; }
  .stats-kpi .label { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .stats-chart { width: 100%; height: 150px; display: block; }
  .stats-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .stats-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-muted); flex-wrap: wrap; }
  .stats-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .stats-empty { font-size: 12.5px; color: var(--text-dim); text-align: center; padding: 8px 0; }
  .stats-error { padding: 12px 14px; border-radius: 12px; background: rgba(239,68,68,.12); color: #F87171; font-size: 13px; line-height: 1.5; }

  .sg-footer { text-align: center; color: var(--text-dim); font-size: 11.5px; padding: 18px 20px 20px; }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div class="page-content">

  <div class="top-bar"><a class="back-link" href="serigraphie.html">← Catalogue</a></div>

  <header>
    <h1>🎨 Devenir vendeur</h1>
    <p>Rejoignez Le Sérigraphe by MAJESTÉ PRESSE : publiez vos produits et recevez des commandes.</p>
    <p><a href="conditions-vendeurs.html" style="color:var(--gold);text-decoration:underline;font-size:13px;">Lire les conditions vendeurs</a></p>
  </header>

  <div id="loading-state">Chargement...</div>
  <div id="view" class="hidden"></div>

  <footer class="sg-footer">© 2026 Le Sérigraphe by MAJESTÉ PRESSE</footer>

</div>

<script src="config.js"></script>
<script src="analytics.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const cfg = window.MAHOUTO_CONFIG;
  const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  const WA_NUMBER = "22996097644"; // +229 96 09 76 44

  // Messages exacts (validés)
  const MESSAGES = {
    pending: "Merci pour votre demande. L'équipe MAJESTÉ PRESSE étudie votre dossier et vous répond sous 48 heures par WhatsApp.",
    rejected: "Merci de votre intérêt pour Le Sérigraphe by MAJESTÉ PRESSE. Après étude, nous ne pouvons pas valider votre demande pour le moment. Vous pouvez nous contacter sur WhatsApp au +229 96 09 76 44 pour en savoir plus ou déposer une nouvelle demande plus tard.",
    suspended: "Votre boutique est temporairement suspendue. Contactez-nous sur WhatsApp au +229 96 09 76 44 pour régler la situation.",
    approved: "Votre boutique est approuvée. Vous pouvez publier vos produits."
  };
  const STATUS_LABELS = { pending: "En cours d'étude", approved: "Approuvée", rejected: "Refusée", suspended: "Suspendue" };

  const loadingEl = document.getElementById("loading-state");
  const viewEl = document.getElementById("view");

  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else n.setAttribute(k, v);
    }
    kids.flat().forEach((c) => { if (c != null) n.append(c); });
    return n;
  }
  function setView(...nodes) {
    viewEl.textContent = "";
    nodes.forEach((n) => viewEl.append(n));
    loadingEl.classList.add("hidden");
    viewEl.classList.remove("hidden");
  }
  function waLink(label) {
    return el("a", { class: "action-link wa", href: "https://wa.me/" + WA_NUMBER, target: "_blank", rel: "noopener noreferrer", text: label });
  }

  function renderLoggedOut() {
    setView(el("div", { class: "card panel" },
      el("h2", { text: "Connexion requise" }),
      el("p", { text: "Connectez-vous à votre compte pour déposer une demande de vendeur." }),
      el("a", { class: "action-link", href: "index.html", text: "Se connecter" })
    ));
  }

  // ---------- « Mes statistiques » (boutique approuvée) ----------
  // RPC vendor_page_views_summary : visites de SES produits uniquement (la base impose la restriction).
  // Dates explicites à l'heure du Bénin (UTC+1, sans heure d'été), quel que soit le fuseau de l'appareil.
  const DAY_MS = 86400000, WAT_MS = 3600000;
  const nf = new Intl.NumberFormat("fr-FR");
  let statsRequest = 0;

  function startOfTodayWat() { return Math.floor((Date.now() + WAT_MS) / DAY_MS) * DAY_MS - WAT_MS; }
  function statsRange(period) {
    const days = period === "today" ? 0 : parseInt(period, 10) - 1;
    return { from: new Date(startOfTodayWat() - days * DAY_MS).toISOString(), to: new Date(Date.now() + 60000).toISOString() };
  }
  function dayLabel(iso) { const p = String(iso).split("-"); return p.length === 3 ? p[2] + "/" + p[1] : String(iso); }

  // Message clair selon l'erreur : fonction absente (SQL pas encore installé), droits, ou autre
  function statsErrorMessage(error) {
    const text = String((error && (error.message || error.details)) || "");
    const code = String((error && error.code) || "");
    if (code === "PGRST202" || code === "42883" || /could not find the function|does not exist|schema cache/i.test(text)) {
      return "Les statistiques ne sont pas encore disponibles. Réessayez plus tard.";
    }
    if (code === "42501" || /réservé|connexion requise|permission denied/i.test(text)) {
      return "Les statistiques sont réservées aux boutiques approuvées.";
    }
    return "Impossible de charger vos statistiques pour le moment. Réessayez dans un instant.";
  }

  function renderStatsChart(wrap, axisFrom, axisTo, days) {
    wrap.textContent = "";
    axisFrom.textContent = days.length ? dayLabel(days[0].day) : "";
    axisTo.textContent = days.length > 1 ? dayLabel(days[days.length - 1].day) : "";
    if (!days.length || !days.some((d) => d.views > 0)) {
      wrap.append(el("div", { class: "stats-empty", text: "Aucune visite sur cette période." }));
      return;
    }
    const NS = "http://www.w3.org/2000/svg";
    const W = 340, H = 150, padTop = 14;
    const max = Math.max(1, ...days.map((d) => d.views));
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("class", "stats-chart");
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Visites et visiteurs uniques par jour");
    const slot = W / days.length, barW = Math.max(2, Math.min(26, slot * 0.7)), innerH = H - padTop - 2;
    days.forEach((d, i) => {
      const x = i * slot + (slot - barW) / 2;
      const g = document.createElementNS(NS, "g");
      const title = document.createElementNS(NS, "title");
      title.textContent = dayLabel(d.day) + " : " + nf.format(d.views) + " visites, " + nf.format(d.visitors) + " visiteurs";
      g.append(title);
      [[d.views, barW, "var(--gold-bright)"], [d.visitors, Math.max(1, barW * 0.5), "var(--accent-green)"]].forEach(([value, w, color]) => {
        const h = value > 0 ? Math.max(1, Math.round((value / max) * innerH)) : 0;
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", String(x + (barW - w) / 2));
        r.setAttribute("y", String(H - 2 - h));
        r.setAttribute("width", String(w));
        r.setAttribute("height", String(h));
        r.setAttribute("rx", "2");
        r.setAttribute("style", "fill:" + color);
        g.append(r);
      });
      svg.append(g);
    });
    const label = document.createElementNS(NS, "text");
    label.setAttribute("x", "2"); label.setAttribute("y", "10");
    label.setAttribute("style", "fill:var(--text-dim);font-size:10px");
    label.textContent = "max " + nf.format(max);
    svg.append(label);
    wrap.append(svg);
  }

  function buildStatsCard() {
    const errorBox = el("div", { class: "stats-error hidden", role: "alert" });
    const kViews = el("div", { class: "value", text: "–" });
    const kVisitors = el("div", { class: "value", text: "–" });
    const kTop = el("div", { class: "value", text: "–" });
    const kTopLabel = el("div", { class: "label", text: "Produit le plus vu" });
    const chartWrap = el("div", {});
    const axisFrom = el("span", {}), axisTo = el("span", {});
    const chips = [["today", "Aujourd'hui"], ["7", "7 jours"], ["30", "30 jours"]].map(([key, label]) => {
      const b = el("button", { type: "button", class: "stats-chip" + (key === "7" ? " active" : ""), text: label });
      b.dataset.period = key;
      return b;
    });

    function showError(message) {
      errorBox.textContent = message || "";
      errorBox.classList.toggle("hidden", !message);
    }
    function reset() {
      kViews.textContent = "–"; kVisitors.textContent = "–"; kTop.textContent = "–";
      kTopLabel.textContent = "Produit le plus vu";
      chartWrap.textContent = ""; axisFrom.textContent = ""; axisTo.textContent = "";
    }

    async function load(period) {
      const mine = ++statsRequest;
      showError("");
      const range = statsRange(period);
      let result;
      try {
        result = await supabase.rpc("vendor_page_views_summary", { p_from: range.from, p_to: range.to });
      } catch (err) {
        result = { data: null, error: err || { message: "réseau" } };
      }
      if (mine !== statsRequest) return;   // une réponse plus récente est déjà arrivée

      if (result.error || !result.data) {
        if (result.error) console.error(result.error);
        reset();
        showError(statsErrorMessage(result.error));
        return;
      }

      const d = result.data;
      kViews.textContent = nf.format(d.total_views || 0);
      kVisitors.textContent = nf.format(d.unique_visitors || 0);
      const top = Array.isArray(d.top_products) && d.top_products.length ? d.top_products[0] : null;
      kTop.textContent = top ? String(top.name) : "–";
      kTopLabel.textContent = top ? "Produit le plus vu (" + nf.format(top.views) + " visites)" : "Produit le plus vu";
      renderStatsChart(chartWrap, axisFrom, axisTo, Array.isArray(d.by_day) ? d.by_day : []);
    }

    chips.forEach((chip) => chip.addEventListener("click", () => {
      chips.forEach((c) => c.classList.toggle("active", c === chip));
      load(chip.dataset.period);
    }));

    const card = el("div", { class: "card panel stats-panel" },
      el("div", { class: "stats-head" },
        el("h2", { text: "📊 Mes statistiques" }),
        el("p", { text: "Visites de vos fiches produit, comptées de façon anonyme (une visite par visiteur et par produit toutes les 30 minutes)." })),
      el("div", { class: "stats-chips", role: "group", "aria-label": "Période" }, chips),
      errorBox,
      el("div", { class: "stats-kpis" },
        el("div", { class: "stats-kpi" }, kViews, el("div", { class: "label", text: "Visites" })),
        el("div", { class: "stats-kpi" }, kVisitors, el("div", { class: "label", text: "Visiteurs uniques" })),
        el("div", { class: "stats-kpi wide" }, kTop, kTopLabel)),
      el("div", {}, chartWrap, el("div", { class: "stats-axis" }, axisFrom, axisTo)),
      el("div", { class: "stats-legend" },
        el("span", {}, el("i", { style: "background:var(--gold-bright)" }), "Visites"),
        el("span", {}, el("i", { style: "background:var(--accent-green)" }), "Visiteurs uniques"))
    );
    load("7");
    return card;
  }

  function renderStatus(vendor) {
    const status = MESSAGES[vendor.status] ? vendor.status : "pending";
    const panel = el("div", { class: "card panel" },
      el("span", { class: "status-pill " + status, text: STATUS_LABELS[status] }),
      el("h2", { text: vendor.shop_name }),
      el("p", { text: MESSAGES[status] })
    );
    if (status === "approved") {
      panel.append(el("a", { class: "action-link", href: "admin/serigraphie-produits.html", text: "Gérer mes produits" }));
    } else if (status === "rejected") {
      // Demande refusée : le propriétaire peut redéposer (rejected -> pending, seule transition permise par la base)
      const again = el("button", { class: "action-link", type: "button", id: "resubmit-btn", text: "Déposer une nouvelle demande" });
      again.addEventListener("click", () => renderForm(currentUser, vendor));
      panel.append(again, waLink("Écrire sur WhatsApp"));
    } else if (status === "suspended") {
      panel.append(waLink("Écrire sur WhatsApp"));
    }
    panel.append(el("div", { class: "shop-recap", text: "Boutique : " + vendor.shop_name + " · " + vendor.city + " · WhatsApp : " + vendor.whatsapp }));
    if (status === "approved") setView(panel, buildStatsCard());
    else setView(panel);
  }

  let currentUser = null;

  // vendor = null : première demande (insertion) ; vendor refusé : nouvelle demande (mise à jour -> pending)
  function renderForm(user, vendor) {
    const resubmit = !!vendor;
    const statusEl = el("div", { id: "form-status", role: "status" });
    const shopName = el("input", { type: "text", id: "f-shop", required: "required", minlength: "2", maxlength: "80", placeholder: "Ex : Atelier Sérigraphie Cotonou", autocomplete: "organization" });
    const whatsapp = el("input", { type: "tel", id: "f-wa", required: "required", maxlength: "25", placeholder: "Ex : +229 01 02 03 04", autocomplete: "tel" });
    const city = el("input", { type: "text", id: "f-city", required: "required", minlength: "2", maxlength: "80", placeholder: "Ex : Cotonou", autocomplete: "address-level2" });
    const desc = el("textarea", { id: "f-desc", maxlength: "1000", placeholder: "Présentez votre atelier, votre expérience, vos produits..." });
    const submit = el("button", { type: "submit", text: resubmit ? "Envoyer ma nouvelle demande" : "Envoyer ma demande" });
    if (resubmit) {
      shopName.value = vendor.shop_name || ""; whatsapp.value = vendor.whatsapp || "";
      city.value = vendor.city || ""; desc.value = vendor.description || "";
    }

    const form = el("form", { id: "vendor-form", class: "card panel", novalidate: "novalidate" },
      el("h2", { text: resubmit ? "Nouvelle demande" : "Votre boutique" }),
      el("div", {}, el("label", { for: "f-shop", text: "Nom de la boutique" }), shopName),
      el("div", {}, el("label", { for: "f-wa", text: "Numéro WhatsApp" }), whatsapp, el("div", { class: "hint", text: "Avec l'indicatif du pays, par exemple +229." })),
      el("div", {}, el("label", { for: "f-city", text: "Ville" }), city),
      el("div", {}, el("label", { for: "f-desc", text: "Description" }), desc),
      submit,
      resubmit ? el("button", { type: "button", class: "action-link", id: "cancel-resubmit", text: "Annuler", style: "background:var(--bg);color:var(--text-muted);border:1px solid var(--border);" }) : null,
      statusEl
    );
    if (resubmit) form.querySelector("#cancel-resubmit").addEventListener("click", () => renderStatus(vendor));

    function fail(msg) { statusEl.className = "error"; statusEl.id = "form-status"; statusEl.textContent = msg; }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.className = ""; statusEl.textContent = "";

      const payload = {
        shop_name: shopName.value.trim(),
        whatsapp: whatsapp.value.trim(),
        city: city.value.trim(),
        description: desc.value.trim() || null
      };
      if (payload.shop_name.length < 2 || payload.shop_name.length > 80) return fail("Indiquez le nom de votre boutique (2 à 80 caractères).");
      if (!/^\+?[0-9 ().-]{6,25}$/.test(payload.whatsapp)) return fail("Numéro WhatsApp invalide. Exemple : +229 01 02 03 04.");
      if (payload.city.length < 2 || payload.city.length > 80) return fail("Indiquez votre ville.");

      submit.disabled = true;
      statusEl.textContent = "Envoi en cours...";
      let data, error;
      if (resubmit) {
        // Seul champ « sensible » envoyé : status = 'pending' (le trigger n'autorise que rejected -> pending)
        ({ data, error } = await supabase.from("serigraphie_vendors")
          .update(Object.assign({ status: "pending" }, payload)).eq("id", vendor.id).select().single());
      } else {
        // la base impose user_id = utilisateur connecté et status = 'pending'
        ({ data, error } = await supabase.from("serigraphie_vendors")
          .insert(Object.assign({ user_id: user.id }, payload)).select().single());
      }
      submit.disabled = false;

      if (error) {
        console.error(error);
        if (error.code === "23505") { await load(); return; } // demande déjà déposée : on affiche son état
        return fail("Impossible d'envoyer la demande : " + error.message);
      }
      renderStatus(data);
    });

    setView(form);
  }

  async function load() {
    const { data: sessionData } = await supabase.auth.getSession();
    const user = sessionData && sessionData.session ? sessionData.session.user : null;
    if (!user) { renderLoggedOut(); return; }

    const { data: vendor, error } = await supabase
      .from("serigraphie_vendors").select("*").eq("user_id", user.id).maybeSingle();
    if (error) {
      console.error(error);
      setView(el("div", { class: "card panel" }, el("p", { text: "Impossible de charger votre dossier. Réessayez dans un instant." })));
      return;
    }
    currentUser = user;
    if (vendor) renderStatus(vendor); else renderForm(user, null);
  }

  load();
})();
</script>
<script src="pwa-install.js"></script>

</body>
</html>
