<body>

  <main class="share-container">

    <div class="brand">
      <h1>
        MAHOUTO<span>+</span>
      </h1>

      <div>
        Partager dans un salon
      </div>
    </div>

    <!-- CHARGEMENT -->
    <section
      id="loading-box"
      class="card"
    >
      <div style="text-align:center;padding:30px 10px;">
        <div style="font-size:40px;margin-bottom:15px;">
          ⏳
        </div>

        <h2>
          Préparation du partage...
        </h2>

        <p id="loading-text">
          Réception du fichier en cours.
        </p>
      </div>
    </section>

    <!-- PARTAGE -->
    <section
      id="share-card"
      class="card hidden"
    >

      <div class="preview">

        <div
          id="preview-icon"
          class="preview-icon"
        >
          📎
        </div>

        <div>

          <div
            id="filename"
            class="filename"
          >
            Fichier
          </div>

          <div
            id="filesize"
            class="filesize"
          >
            —
          </div>

        </div>

      </div>

      <div class="field">

        <label for="room-select">
          Choisir le salon
        </label>

        <select id="room-select">

          <option value="">
            Chargement des salons...
          </option>

        </select>

      </div>

      <div class="field">

        <label for="caption">
          Message
        </label>

        <textarea
          id="caption"
          maxlength="2000"
          placeholder="Ajouter un message..."
        ></textarea>

      </div>

      <button
        id="publish-btn"
        disabled
      >
        Publier dans le salon
      </button>

    </section>

    <!-- CONNEXION -->
    <section
      id="login-box"
      class="card hidden"
    >

      <h2>
        Connexion nécessaire
      </h2>

      <p>
        Connecte-toi à MAHOUTO+ pour publier ce fichier.
      </p>

      <br>

      <button id="login-btn">
        Se connecter avec Google
      </button>

    </section>

    <!-- STATUS -->
    <div id="status"></div>

    <!-- SUCCÈS -->
    <section
      id="success-box"
      class="card success hidden"
    >

      <div class="success-icon">
        ✅
      </div>

      <h2>
        Publication réussie
      </h2>

      <p id="success-text">
        Ton fichier a été publié.
      </p>

      <br>

      <button
        onclick="window.location.href='discussions.html'"
      >
        Voir les discussions
      </button>

    </section>

    <!-- ERREUR -->
    <section
      id="error-box"
      class="card error hidden"
    >

      <h3>
        Impossible de terminer le partage
      </h3>

      <p id="error-text"></p>

      <br>

      <button
        onclick="window.location.reload()"
      >
        Réessayer
      </button>

    </section>

  </main>

  <script src="config.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>

    const cfg =
      window.MAHOUTO_CONFIG;

    const supabase =
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_ANON_KEY
      );

    // =========================================================
    // ELEMENTS
    // =========================================================

    const loadingBox =
      document.getElementById(
        "loading-box"
      );

    const loadingText =
      document.getElementById(
        "loading-text"
      );

    const shareCard =
      document.getElementById(
        "share-card"
      );

    const loginBox =
      document.getElementById(
        "login-box"
      );

    const successBox =
      document.getElementById(
        "success-box"
      );

    const errorBox =
      document.getElementById(
        "error-box"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const roomSelect =
      document.getElementById(
        "room-select"
      );

    const captionEl =
      document.getElementById(
        "caption"
      );

    const publishBtn =
      document.getElementById(
        "publish-btn"
      );

    const filenameEl =
      document.getElementById(
        "filename"
      );

    const filesizeEl =
      document.getElementById(
        "filesize"
      );

    const previewIcon =
      document.getElementById(
        "preview-icon"
      );

    // =========================================================
    // SHARE ID
    // =========================================================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const shareId =
      params.get("id");

    let currentShare = null;
    let currentUser = null;

    // =========================================================
    // UTILS
    // =========================================================

    function setStatus(text) {
      statusEl.textContent =
        text || "";
    }

    function formatSize(bytes) {

      if (!bytes) {
        return "Taille inconnue";
      }

      if (bytes < 1024) {
        return `${bytes} o`;
      }

      if (
        bytes <
        1024 * 1024
      ) {
        return (
          (bytes / 1024)
            .toFixed(1) +
          " Ko"
        );
      }

      return (
        (bytes /
          (1024 * 1024)
        ).toFixed(1) +
        " Mo"
      );
    }

    function iconForMime(mime) {

      if (
        mime.startsWith(
          "image/"
        )
      ) {
        return "🖼️";
      }

      if (
        mime.startsWith(
          "video/"
        )
      ) {
        return "🎥";
      }

      if (
        mime.startsWith(
          "audio/"
        )
      ) {
        return "🎵";
      }

      if (
        mime.includes("pdf")
      ) {
        return "📕";
      }

      if (
        mime.includes("word")
      ) {
        return "📘";
      }

      return "📎";
    }

    // =========================================================
    // ERROR
    // =========================================================

    function showError(message) {

      loadingBox.classList.add(
        "hidden"
      );

      shareCard.classList.add(
        "hidden"
      );

      loginBox.classList.add(
        "hidden"
      );

      successBox.classList.add(
        "hidden"
      );

      errorBox.classList.remove(
        "hidden"
      );

      document.getElementById(
        "error-text"
      ).textContent =
        message ||
        "Une erreur est survenue.";
    }

    // =========================================================
    // LOAD SHARE
    // =========================================================

    async function loadShare() {

      if (!shareId) {
        throw new Error(
          "Identifiant du partage manquant."
        );
      }

      loadingText.textContent =
        "Chargement du fichier partagé...";

      const response =
        await fetch(
          `/api/share-pending?id=${encodeURIComponent(
            shareId
          )}`,
          {
            cache: "no-store"
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {
        throw new Error(
          data.error ||
          "Impossible de charger le partage."
        );
      }

      currentShare =
        data.share;

      filenameEl.textContent =
        currentShare.filename ||
        "Fichier";

      filesizeEl.textContent =
        formatSize(
          currentShare.file_size
        );

      previewIcon.textContent =
        iconForMime(
          currentShare.mime_type ||
          ""
        );

      captionEl.value =
        currentShare.caption ||
        "";

      loadingBox.classList.add(
        "hidden"
      );

      shareCard.classList.remove(
        "hidden"
      );
    }

    // =========================================================
    // CURRENT USER
    // =========================================================

    async function getCurrentUser() {

      const {
        data,
        error
      } =
        await supabase.auth.getUser();

      if (error) {
        console.error(error);
        return null;
      }

      return data?.user || null;
    }

    // =========================================================
    // ROOMS
    // =========================================================

    async function loadRooms() {

      roomSelect.innerHTML =
        `<option value="">
          Chargement...
        </option>`;

      const {
        data: rooms,
        error
      } =
        await supabase
          .from("rooms")
          .select(
            "id,name,emoji,color"
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );

      if (error) {

        console.error(error);

        throw new Error(
          "Impossible de charger les salons."
        );
      }

      if (
        !rooms ||
        !rooms.length
      ) {
        throw new Error(
          "Aucun salon disponible."
        );
      }

      roomSelect.innerHTML =
        `<option value="">
          Choisir un salon...
        </option>`;

      rooms.forEach(room => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          room.id;

        option.textContent =
          `${room.emoji || "💬"} ${room.name}`;

        roomSelect.appendChild(
          option
        );
      });

      updatePublishButton();
    }

    // =========================================================
    // BUTTON
    // =========================================================

    function updatePublishButton() {

      publishBtn.disabled =
        !currentUser ||
        !currentShare ||
        !roomSelect.value;
    }

    roomSelect.addEventListener(
      "change",
      updatePublishButton
    );

    // =========================================================
    // PUBLISH
    // =========================================================

    publishBtn.addEventListener(
      "click",
      publishShare
    );

    async function publishShare() {

      if (
        !currentUser ||
        !currentShare ||
        !roomSelect.value
      ) {
        return;
      }

      publishBtn.disabled =
        true;

      setStatus(
        "Publication en cours..."
      );

      try {

        const {
          data:
            sessionData
        } =
          await supabase.auth.getSession();

        const session =
          sessionData?.session;

        if (!session) {

          throw new Error(
            "Ta session a expiré. Reconnecte-toi."
          );
        }

        const response =
          await fetch(
            "/api/share-finalize",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                Authorization:
                  `Bearer ${session.access_token}`
              },

              body:
                JSON.stringify({
                  share_id:
                    currentShare.id,

                  room_id:
                    roomSelect.value,

                  caption:
                    captionEl.value
                      .trim()
                })
            }
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.error ||
            "La publication a échoué."
          );
        }

        shareCard.classList.add(
          "hidden"
        );

        loginBox.classList.add(
          "hidden"
        );

        errorBox.classList.add(
          "hidden"
        );

        successBox.classList.remove(
          "hidden"
        );

        document.getElementById(
          "success-text"
        ).textContent =
          `Publié dans « ${data.room.name} ».`;

        setStatus("");

      } catch (error) {

        console.error(error);

        setStatus("");

        publishBtn.disabled =
          false;

        showError(
          error.message
        );
      }
    }

    // =========================================================
    // GOOGLE LOGIN
    // =========================================================

    document
      .getElementById(
        "login-btn"
      )
      .addEventListener(
        "click",
        async () => {

          const {
            error
          } =
            await supabase.auth
              .signInWithOAuth({
                provider:
                  "google",

                options: {
                  redirectTo:
                    window.location.href
                }
              });

          if (error) {
            showError(
              error.message
            );
          }
        }
      );

    // =========================================================
    // INIT
    // =========================================================

    async function init() {

      try {

        if (!shareId) {

          throw new Error(
            "Lien de partage invalide."
          );
        }

        await loadShare();

        currentUser =
          await getCurrentUser();

        if (!currentUser) {

          shareCard.classList.add(
            "hidden"
          );

          loginBox.classList.remove(
            "hidden"
          );

          setStatus(
            "Connecte-toi pour continuer."
          );

          return;
        }

        await loadRooms();

        updatePublishButton();

      } catch (error) {

        console.error(error);

        showError(
          error.message
        );
      }
    }

    // =========================================================
    // AUTH STATE
    // =========================================================

    supabase.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        if (
          session &&
          session.user
        ) {

          currentUser =
            session.user;

          loginBox.classList.add(
            "hidden"
          );

          shareCard.classList.remove(
            "hidden"
          );

          try {

            await loadRooms();

          } catch (error) {

            showError(
              error.message
            );
          }

          updatePublishButton();
        }
      }
    );

    init();

  </script>

</body>
</html>
