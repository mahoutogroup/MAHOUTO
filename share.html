<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0A0A0A"
  >

  <title>Partager dans un salon — MAHOUTO+</title>

  <!-- =========================================================
       CSS AUTONOME
       ========================================================= -->
  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #0A0A0A;
      color: #F5F5F5;
    }

    body {
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    .share-container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* =========================================================
       BRAND
       ========================================================= */

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand h1 span {
      color: #FFC107;
    }

    .brand-subtitle {
      margin-top: 6px;
      color: #BDBDBD;
      font-size: 15px;
    }

    /* =========================================================
       CARDS
       ========================================================= */

    .card {
      width: 100%;
      background: #151515;
      border: 1px solid #2B2B2B;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* =========================================================
       LOADING
       ========================================================= */

    .loading-content {
      text-align: center;
      padding: 24px 8px;
    }

    .loading-icon {
      font-size: 44px;
      margin-bottom: 14px;
    }

    .loading-content h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .loading-content p {
      margin: 0;
      color: #BDBDBD;
      line-height: 1.5;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 18px auto 0;
      border: 4px solid #333;
      border-top-color: #FFC107;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       FILE PREVIEW
       ========================================================= */

    .preview {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      background: #0F0F0F;
      border: 1px solid #292929;
      border-radius: 14px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .preview-icon {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #222;
      font-size: 27px;
    }

    .file-info {
      min-width: 0;
      flex: 1;
    }

    .filename {
      font-size: 16px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filesize {
      margin-top: 5px;
      color: #999;
      font-size: 13px;
    }

    /* =========================================================
       FORM
       ========================================================= */

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #DADADA;
      font-size: 14px;
      font-weight: 600;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid #3A3A3A;
      border-radius: 12px;
      background: #0E0E0E;
      color: #FFFFFF;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: #FFC107;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.45;
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      background: #FFC107;
      color: #111111;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition:
        opacity 0.2s ease,
        transform 0.1s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .google-btn {
      background: #FFFFFF;
      color: #111111;
    }

    /* =========================================================
       STATUS
       ========================================================= */

    #status {
      min-height: 20px;
      margin: 4px 0 14px;
      text-align: center;
      color: #FFC107;
      font-size: 14px;
    }

    /* =========================================================
       SUCCESS
       ========================================================= */

    .success {
      text-align: center;
      border-color: #245A36;
    }

    .success-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .success h2 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    .success p {
      color: #BDBDBD;
      line-height: 1.5;
    }

    /* =========================================================
       ERROR
       ========================================================= */

    .error {
      border-color: #6B2929;
    }

    .error h3 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .error p {
      color: #D0D0D0;
      line-height: 1.5;
      word-break: break-word;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 480px) {

      .share-container {
        padding: 18px 12px 30px;
      }

      .card {
        padding: 18px;
        border-radius: 15px;
      }

      .brand h1 {
        font-size: 28px;
      }

      .filename {
        font-size: 15px;
      }
    }

  </style>
</head>

<body>

  <main class="share-container">

    <!-- =======================================================
         MARQUE
         ======================================================= -->

    <div class="brand">

      <h1>
        MAHOUTO<span>+</span>
      </h1>

      <div class="brand-subtitle">
        Partager dans un salon
      </div>

    </div>


    <!-- =======================================================
         CHARGEMENT
         ======================================================= -->

    <section
      id="loading-box"
      class="card"
    >

      <div class="loading-content">

        <div class="loading-icon">
          ⏳
        </div>

        <h2 id="loading-title">
          Préparation du partage...
        </h2>

        <p id="loading-text">
          Réception du fichier en cours.
        </p>

        <div
          id="loader"
          class="loader"
        ></div>

      </div>

    </section>


    <!-- =======================================================
         PARTAGE
         ======================================================= -->

    <section
      id="share-card"
      class="card hidden"
    >

      <div class="preview">

        <div
          id="preview-icon"
          class="preview-icon"
        >
          📎
        </div>

        <div class="file-info">

          <div
            id="filename"
            class="filename"
          >
            Fichier
          </div>

          <div
            id="filesize"
            class="filesize"
          >
            —
          </div>

        </div>

      </div>


      <!-- SALON -->

      <div class="field">

        <label for="room-select">
          Choisir le salon
        </label>

        <select id="room-select">

          <option value="">
            Chargement des salons...
          </option>

        </select>

      </div>


      <!-- MESSAGE -->

      <div class="field">

        <label for="caption">
          Message
        </label>

        <textarea
          id="caption"
          maxlength="2000"
          placeholder="Ajouter un message..."
        ></textarea>

      </div>


      <!-- PUBLICATION -->

      <button
        id="publish-btn"
        disabled
      >
        Publier dans le salon
      </button>

    </section>


    <!-- =======================================================
         CONNEXION
         ======================================================= -->

    <section
      id="login-box"
      class="card hidden"
    >

      <h2>
        Connexion nécessaire
      </h2>

      <p>
        Connecte-toi à MAHOUTO+ pour publier ce fichier.
      </p>

      <button
        id="login-btn"
        class="google-btn"
      >
        Se connecter avec Google
      </button>

    </section>


    <!-- =======================================================
         STATUS
         ======================================================= -->

    <div id="status"></div>


    <!-- =======================================================
         SUCCÈS
         ======================================================= -->

    <section
      id="success-box"
      class="card success hidden"
    >

      <div class="success-icon">
        ✅
      </div>

      <h2>
        Publication réussie
      </h2>

      <p id="success-text">
        Ton fichier a été publié.
      </p>

      <button
        id="discussions-btn"
      >
        Voir les discussions
      </button>

    </section>


    <!-- =======================================================
         ERREUR
         ======================================================= -->

    <section
      id="error-box"
      class="card error hidden"
    >

      <h3>
        Impossible de terminer le partage
      </h3>

      <p id="error-text">
        Une erreur est survenue.
      </p>

      <button
        id="retry-btn"
      >
        Réessayer
      </button>

    </section>

  </main>


  <!-- =========================================================
       CONFIGURATION
       ========================================================= -->

  <script src="/config.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>


  <!-- =========================================================
       APPLICATION
       ========================================================= -->

  <script>

    "use strict";


    /* =========================================================
       CONFIGURATION SUPABASE
       ========================================================= */

    if (
      !window.MAHOUTO_CONFIG ||
      !window.MAHOUTO_CONFIG.SUPABASE_URL ||
      !window.MAHOUTO_CONFIG.SUPABASE_ANON_KEY
    ) {

      document.body.innerHTML = `
        <div style="
          padding:30px;
          font-family:Arial,sans-serif;
          background:#0A0A0A;
          color:white;
          min-height:100vh;
        ">
          <h2>Erreur de configuration</h2>
          <p>
            La configuration Supabase de MAHOUTO+ est introuvable.
          </p>
        </div>
      `;

      throw new Error(
        "Configuration Supabase manquante."
      );
    }


    if (!window.supabase) {

      document.body.innerHTML = `
        <div style="
          padding:30px;
          font-family:Arial,sans-serif;
          background:#0A0A0A;
          color:white;
          min-height:100vh;
        ">
          <h2>Erreur</h2>
          <p>
            Impossible de charger le module Supabase.
          </p>
        </div>
      `;

      throw new Error(
        "Supabase JS non chargé."
      );
    }


    const cfg =
      window.MAHOUTO_CONFIG;


    const supabase =
      window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_ANON_KEY
      );


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const loadingBox =
      document.getElementById(
        "loading-box"
      );

    const loadingTitle =
      document.getElementById(
        "loading-title"
      );

    const loadingText =
      document.getElementById(
        "loading-text"
      );

    const loader =
      document.getElementById(
        "loader"
      );

    const shareCard =
      document.getElementById(
        "share-card"
      );

    const loginBox =
      document.getElementById(
        "login-box"
      );

    const successBox =
      document.getElementById(
        "success-box"
      );

    const errorBox =
      document.getElementById(
        "error-box"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const roomSelect =
      document.getElementById(
        "room-select"
      );

    const captionEl =
      document.getElementById(
        "caption"
      );

    const publishBtn =
      document.getElementById(
        "publish-btn"
      );

    const loginBtn =
      document.getElementById(
        "login-btn"
      );

    const retryBtn =
      document.getElementById(
        "retry-btn"
      );

    const discussionsBtn =
      document.getElementById(
        "discussions-btn"
      );

    const filenameEl =
      document.getElementById(
        "filename"
      );

    const filesizeEl =
      document.getElementById(
        "filesize"
      );

    const previewIcon =
      document.getElementById(
        "preview-icon"
      );

    const errorText =
      document.getElementById(
        "error-text"
      );

    const successText =
      document.getElementById(
        "success-text"
      );


    /* =========================================================
       SHARE ID
       ========================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const shareId =
      params.get("id");


    let currentShare = null;

    let currentUser = null;

    let isPublishing = false;


    /* =========================================================
       AFFICHAGE DES ÉTATS
       ========================================================= */

    function hideAllStates() {

      loadingBox.classList.add(
        "hidden"
      );

      shareCard.classList.add(
        "hidden"
      );

      loginBox.classList.add(
        "hidden"
      );

      successBox.classList.add(
        "hidden"
      );

      errorBox.classList.add(
        "hidden"
      );

    }


    function showLoading(
      title,
      message
    ) {

      hideAllStates();

      loadingTitle.textContent =
        title ||
        "Préparation du partage...";

      loadingText.textContent =
        message ||
        "Chargement...";

      loader.classList.remove(
        "hidden"
      );

      loadingBox.classList.remove(
        "hidden"
      );

      setStatus("");

    }


    function showShare() {

      hideAllStates();

      shareCard.classList.remove(
        "hidden"
      );

      setStatus("");

      updatePublishButton();

    }


    function showLogin() {

      hideAllStates();

      loginBox.classList.remove(
        "hidden"
      );

      setStatus(
        "Connecte-toi pour continuer."
      );

    }


    function showSuccess(
      message
    ) {

      hideAllStates();

      successText.textContent =
        message ||
        "Ton fichier a été publié.";

      successBox.classList.remove(
        "hidden"
      );

      setStatus("");

    }


    function showError(
      message
    ) {

      hideAllStates();

      errorText.textContent =
        message ||
        "Une erreur est survenue.";

      errorBox.classList.remove(
        "hidden"
      );

      setStatus("");

    }


    /* =========================================================
       STATUS
       ========================================================= */

    function setStatus(
      text
    ) {

      statusEl.textContent =
        text ||
        "";

    }


    /* =========================================================
       FORMATAGE
       ========================================================= */

    function formatSize(
      bytes
    ) {

      const value =
        Number(bytes);


      if (
        !Number.isFinite(value) ||
        value <= 0
      ) {

        return "Taille inconnue";

      }


      if (
        value < 1024
      ) {

        return `${value} o`;

      }


      if (
        value < 1024 * 1024
      ) {

        return (
          (value / 1024)
            .toFixed(1)
          + " Ko"
        );

      }


      if (
        value < 1024 * 1024 * 1024
      ) {

        return (
          (value / (1024 * 1024))
            .toFixed(1)
          + " Mo"
        );

      }


      return (
        (value /
          (1024 * 1024 * 1024)
        ).toFixed(1)
        + " Go"
      );

    }


    function iconForMime(
      mime
    ) {

      const type =
        String(mime || "")
          .toLowerCase();


      if (
        type.startsWith(
          "image/"
        )
      ) {

        return "🖼️";

      }


      if (
        type.startsWith(
          "video/"
        )
      ) {

        return "🎥";

      }


      if (
        type.startsWith(
          "audio/"
        )
      ) {

        return "🎵";

      }


      if (
        type.includes(
          "pdf"
        )
      ) {

        return "📕";

      }


      if (
        type.includes(
          "word"
        )
      ) {

        return "📘";

      }


      if (
        type.includes(
          "excel"
        ) ||
        type.includes(
          "spreadsheet"
        )
      ) {

        return "📗";

      }


      if (
        type.includes(
          "zip"
        ) ||
        type.includes(
          "compressed"
        )
      ) {

        return "🗜️";

      }


      if (
        type.startsWith(
          "text/"
        )
      ) {

        return "📄";

      }


      return "📎";

    }


    /* =========================================================
       CHARGEMENT DU PARTAGE
       ========================================================= */

    async function loadShare() {

      if (!shareId) {

        throw new Error(
          "Lien de partage invalide : identifiant manquant."
        );

      }


      showLoading(
        "Préparation du partage...",
        "Chargement du fichier partagé..."
      );


      const response =
        await fetch(
          `/api/share-pending?id=${encodeURIComponent(
            shareId
          )}`,
          {
            method: "GET",
            cache: "no-store",
            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      let data = null;


      try {

        data =
          await response.json();

      } catch (jsonError) {

        throw new Error(
          "Le serveur a retourné une réponse invalide."
        );

      }


      if (
        !response.ok ||
        !data ||
        !data.success
      ) {

        throw new Error(
          data?.error ||
          "Impossible de charger le partage."
        );

      }


      if (
        !data.share
      ) {

        throw new Error(
          "Les informations du fichier sont introuvables."
        );

      }


      currentShare =
        data.share;


      filenameEl.textContent =
        currentShare.filename ||
        "Fichier";


      filesizeEl.textContent =
        formatSize(
          currentShare.file_size
        );


      previewIcon.textContent =
        iconForMime(
          currentShare.mime_type
        );


      captionEl.value =
        currentShare.caption ||
        "";


      showShare();

    }


    /* =========================================================
       UTILISATEUR CONNECTÉ
       ========================================================= */

    async function getCurrentUser() {

      const result =
        await supabase.auth.getUser();


      if (
        result.error
      ) {

        console.error(
          "getCurrentUser:",
          result.error
        );

        return null;

      }


      return (
        result.data?.user ||
        null
      );

    }


    /* =========================================================
       CHARGEMENT DES SALONS
       ========================================================= */

    async function loadRooms() {

      roomSelect.innerHTML = `
        <option value="">
          Chargement des salons...
        </option>
      `;


      const result =
        await supabase
          .from("rooms")
          .select(
            "id,name,emoji,color"
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      const rooms =
        result.data;

      const error =
        result.error;


      if (error) {

        console.error(
          "loadRooms:",
          error
        );

        throw new Error(
          "Impossible de charger les salons."
        );

      }


      if (
        !Array.isArray(rooms) ||
        rooms.length === 0
      ) {

        throw new Error(
          "Aucun salon disponible."
        );

      }


      roomSelect.innerHTML = `
        <option value="">
          Choisir un salon...
        </option>
      `;


      rooms.forEach(
        room => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            room.id;


          option.textContent =
            `${room.emoji || "💬"} ${room.name}`;


          roomSelect.appendChild(
            option
          );

        }
      );


      updatePublishButton();

    }


    /* =========================================================
       BOUTON PUBLIER
       ========================================================= */

    function updatePublishButton() {

      publishBtn.disabled =
        isPublishing ||
        !currentUser ||
        !currentShare ||
        !roomSelect.value;

    }


    roomSelect.addEventListener(
      "change",
      updatePublishButton
    );


    /* =========================================================
       PUBLICATION
       ========================================================= */

    async function publishShare() {

      if (
        isPublishing
      ) {

        return;

      }


      if (
        !currentUser
      ) {

        showLogin();

        return;

      }


      if (
        !currentShare
      ) {

        showError(
          "Le fichier partagé est introuvable."
        );

        return;

      }


      if (
        !roomSelect.value
      ) {

        setStatus(
          "Choisis d'abord un salon."
        );

        return;

      }


      isPublishing =
        true;


      updatePublishButton();


      setStatus(
        "Publication en cours..."
      );


      try {

        /*
         * Récupération de la session Supabase.
         */

        const sessionResult =
          await supabase.auth.getSession();


        const session =
          sessionResult
            ?.data
            ?.session;


        if (
          !session ||
          !session.access_token
        ) {

          throw new Error(
            "Ta session a expiré. Reconnecte-toi."
          );

        }


        /*
         * Envoi au backend.
         */

        const response =
          await fetch(
            "/api/share-finalize",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json",

                "Authorization":
                  `Bearer ${session.access_token}`
              },

              body:
                JSON.stringify({

                  share_id:
                    currentShare.id,

                  room_id:
                    roomSelect.value,

                  caption:
                    captionEl.value
                      .trim()

                })

            }
          );


        let data = null;


        try {

          data =
            await response.json();

        } catch (jsonError) {

          throw new Error(
            "Le serveur a retourné une réponse invalide."
          );

        }


        if (
          !response.ok ||
          !data ||
          !data.success
        ) {

          throw new Error(
            data?.error ||
            "La publication a échoué."
          );

        }


        const roomName =
          data.room?.name ||
          "le salon sélectionné";


        showSuccess(
          `Publié dans « ${roomName} ».`
        );


      } catch (error) {

        console.error(
          "publishShare:",
          error
        );


        showError(
          error?.message ||
          "Impossible de terminer le partage."
        );


      } finally {

        isPublishing =
          false;

        updatePublishButton();

      }

    }


    publishBtn.addEventListener(
      "click",
      publishShare
    );


    /* =========================================================
       CONNEXION GOOGLE
       ========================================================= */

    async function loginWithGoogle() {

      try {

        loginBtn.disabled =
          true;


        setStatus(
          "Ouverture de la connexion Google..."
        );


        /*
         * On conserve exactement l'URL actuelle
         * afin de revenir sur :
         *
         * /share.html?id=UUID
         */

        const redirectTo =
          window.location.href;


        const result =
          await supabase.auth
            .signInWithOAuth({

              provider:
                "google",

              options: {
                redirectTo
              }

            });


        if (
          result.error
        ) {

          throw result.error;

        }


      } catch (error) {

        console.error(
          "loginWithGoogle:",
          error
        );


        showError(
          error?.message ||
          "Impossible de démarrer la connexion Google."
        );


        loginBtn.disabled =
          false;

      }

    }


    loginBtn.addEventListener(
      "click",
      loginWithGoogle
    );


    /* =========================================================
       BOUTON DISCUSSIONS
       ========================================================= */

    discussionsBtn.addEventListener(
      "click",
      () => {

        window.location.href =
          "/discussions.html";

      }
    );


    /* =========================================================
       BOUTON RÉESSAYER
       ========================================================= */

    retryBtn.addEventListener(
      "click",
      () => {

        window.location.reload();

      }
    );


    /* =========================================================
       AUTH STATE
       ========================================================= */

    supabase.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        console.log(
          "Auth event:",
          event
        );


        if (
          session &&
          session.user
        ) {

          currentUser =
            session.user;


          /*
           * Si le partage est déjà chargé,
           * on affiche directement le formulaire.
           */

          if (
            currentShare &&
            !isPublishing
          ) {

            try {

              await loadRooms();

              showShare();

            } catch (error) {

              console.error(
                "Auth/loadRooms:",
                error
              );

              showError(
                error?.message ||
                "Impossible de charger les salons."
              );

            }

          }

        }

      }
    );


    /* =========================================================
       INITIALISATION
       ========================================================= */

    async function init() {

      try {

        /*
         * IMPORTANT :
         * Sans ?id=UUID, cette page n'est pas
         * un partage valide.
         */

        if (!shareId) {

          showError(
            "Lien de partage invalide. Utilise le lien généré par MAHOUTO+."
          );

          return;

        }


        /*
         * 1. Récupérer le fichier.
         */

        await loadShare();


        /*
         * 2. Vérifier la session.
         */

        currentUser =
          await getCurrentUser();


        /*
         * 3. Si pas connecté :
         *    afficher UNIQUEMENT connexion.
         */

        if (!currentUser) {

          showLogin();

          return;

        }


        /*
         * 4. Utilisateur connecté :
         *    charger les salons.
         */

        await loadRooms();


        /*
         * 5. Afficher UNIQUEMENT
         *    le formulaire de partage.
         */

        showShare();

      } catch (error) {

        console.error(
          "init:",
          error
        );


        showError(
          error?.message ||
          "Impossible de préparer le partage."
        );

      }

    }


    /*
     * Lancement.
     */

    init();

  </script>

</body>
</html>
