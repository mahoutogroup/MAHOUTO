<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message privé — MAHOUTO+</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/logo-mahouto-plus.png">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="attachment-card.css">
<link rel="stylesheet" href="audio-player.css">
<script src="theme-toggle.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

  html, body { height: 100%; background: var(--bg); color: var(--white); }

  body { display: flex; flex-direction: column; }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--bg-card);
  }

  header a.back { color: var(--gold-bright); text-decoration: none; font-size: 22px; line-height: 1; }

  header .peer-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--gold-bright); color: #0A0A0A;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 14px; flex: none; overflow: hidden;
  }
  header .peer-avatar img { width: 100%; height: 100%; object-fit: cover; }
  header .peer-avatar.has-photo { cursor: pointer; }

  #avatar-viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 80;
    display: flex; align-items: center; justify-content: center;
  }
  #avatar-viewer img { width: 90vw; height: 90vh; object-fit: contain; }

  #media-viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 80;
    display: flex; align-items: center; justify-content: center;
  }
  #media-viewer img, #media-viewer video { width: 90vw; height: 90vh; object-fit: contain; }
  #media-viewer-close {
    position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
    border-radius: 50%; border: none; background: rgba(0,0,0,.5); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer; z-index: 81;
  }
  .play-overlay {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.55);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 20px; pointer-events: none;
  }

  header h1 { font-size: 17px; color: var(--gold-bright); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    background: var(--bg-card);
    align-self: flex-start;
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    cursor: pointer;
  }

  .bubble.long { max-width: 90%; }

  .bubble pre.code-block {
    margin: 6px 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.28);
    overflow-x: auto;
    white-space: pre;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .bubble.mine pre.code-block { background: rgba(0,0,0,.14); }
  .bubble pre.code-block code { white-space: pre; }

  .bubble.mine { background: var(--gold-bright); color: #0A0A0A; align-self: flex-end; }
  .bubble .meta { font-size: 11px; opacity: .65; margin-bottom: 4px; font-weight: bold; }

  /* Accusés de réception : ✓ envoyé, ✓✓ gris livré, ✓✓ bleu lu — uniquement sur mes messages */
  .bubble .ticks { margin-left: 6px; font-size: 12px; letter-spacing: -1px; opacity: 1; }
  .bubble .ticks.sent, .bubble .ticks.delivered { color: rgba(10,10,10,.45); }
  .bubble .ticks.read { color: #0B84FF; }
  .bubble .edited-tag { font-size: 10.5px; opacity: .6; margin-left: 6px; font-style: italic; }
  .bubble.deleted { font-style: italic; opacity: .6; }

  form#composer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    background: var(--bg-elevated);
    border-top: 1px solid var(--bg-card);
  }

  #composer textarea {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border-radius: 20px;
    border: none;
    background: var(--bg-card);
    color: var(--white);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 220px;
    overflow-y: auto;
    line-height: 1.35;
  }

  #composer textarea:focus { outline: 2px solid var(--gold-bright); }

  #composer button[type="submit"] {
    padding: 0 16px;
    border: none;
    border-radius: 20px;
    background: var(--gold-bright);
    font-weight: bold;
    cursor: pointer;
    flex: none;
    font-size: 14px;
  }

  #composer button:disabled { opacity: .5; cursor: not-allowed; }

  #status-message { color: var(--text-muted); font-size: 13px; min-height: 18px; padding: 0 16px; }

  .hidden { display: none !important; }

  #msg-action-sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 70;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #msg-action-sheet .sheet {
    width: 100%; max-width: 480px; background: var(--bg-elevated);
    border-radius: 20px 20px 0 0; padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    max-height: 70vh; overflow-y: auto;
  }
  #msg-action-sheet .sheet-handle {
    width: 40px; height: 4px; background: var(--border); border-radius: 3px; margin: 0 auto 10px;
  }
  #msg-action-sheet button {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 22px;
    background: none; border: none; color: var(--white); font-size: 15px; text-align: left; cursor: pointer;
  }
  #msg-action-sheet button:active { background: var(--bg-card); }
  #msg-action-sheet button.danger { color: #F87171; }

  header .peer-name-wrap { display: flex; flex-direction: column; }
  header .peer-status { font-size: 11px; color: var(--text-dim); }
  header .peer-status.online { color: var(--accent-green); }
  header .peer-status.online::before {
    content: ""; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--accent-green); margin-right: 5px;
  }

  #mic-btn {
    background: var(--bg-card); border: none; border-radius: 20px;
    width: 42px; flex: none; color: var(--gold-bright); font-size: 17px; cursor: pointer;
  }
  #mic-btn.recording { background: #F87171; color: #fff; animation: micPulse 1s infinite; }
  @keyframes micPulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
  #recording-indicator {
    padding: 6px 16px; font-size: 12.5px; color: #F87171; display: flex; align-items: center; gap: 8px;
  }

  .bubble audio { width: 220px; max-width: 100%; margin-top: 2px; }

  #not-logged-in {
    padding: 60px 24px; text-align: center; color: var(--text-dim); font-size: 14px;
  }
</style>
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle-fab">🌙</button>

<div id="not-logged-in" class="hidden">
  Connecte-toi depuis l'accueil pour accéder à tes messages privés.
</div>

<header id="chat-header" class="hidden">
  <a class="back" href="messages-prives.html" aria-label="Retour">←</a>
  <div class="peer-avatar" id="peer-avatar">?</div>
  <div class="peer-name-wrap">
    <h1 id="peer-name">Conversation</h1>
    <span class="peer-status" id="peer-status">Hors ligne</span>
  </div>
</header>

<div id="avatar-viewer" class="hidden">
  <img id="avatar-viewer-img" src="" alt="">
</div>

<div id="media-viewer" class="hidden">
  <button type="button" id="media-viewer-close" aria-label="Fermer">✕</button>
  <img id="media-viewer-img" class="hidden" src="" alt="">
  <video id="media-viewer-video" class="hidden" controls></video>
</div>

<button type="button" id="play-all-audio-btn" class="play-all-audio-btn hidden">▶ Lire tous les audios</button>
<div id="messages" class="hidden"></div>
<div id="recording-indicator" class="hidden">🔴 Enregistrement... <span id="recording-time">0:00</span></div>
<div id="status-message"></div>

<!-- Menu d'actions sur un message (modifier / supprimer / copier / partager) -->
<div id="msg-action-sheet" class="hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <button type="button" data-action="copy">📋 Copier</button>
    <button type="button" data-action="share">🔗 Partager</button>
    <button type="button" data-action="edit">✏️ Modifier</button>
    <button type="button" data-action="delete-me">🙈 Supprimer pour moi</button>
    <button type="button" class="danger" data-action="delete-all">🗑️ Supprimer pour tous</button>
  </div>
</div>

<div id="attachment-queue" class="attachment-queue hidden">
  <div id="attachment-queue-list" class="attachment-queue-list"></div>
  <div class="attachment-queue-actions">
    <button type="button" id="attachment-queue-cancel" class="attachment-queue-cancel">Annuler</button>
    <button type="button" id="attachment-queue-send" class="attachment-queue-send">Envoyer <span id="attachment-queue-count"></span></button>
  </div>
</div>

<form id="composer" class="hidden">
  <button type="button" id="attach-btn" title="Envoyer un fichier" style="background:var(--bg-card);border:none;border-radius:20px;width:42px;flex:none;color:var(--gold-bright);font-size:17px;cursor:pointer;">📎</button>
  <button type="button" id="mic-btn" title="Message vocal">🎤</button>
  <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.tiff,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.md,.svg,.ai,.eps,.psd,.cdr,.dng,.cr2,.cr3,.nef,.arw,.raf,.mp3,.wav,.m4a,.ogg,.mp4,.webm,.mov,.mkv,.zip,.rar,.7z,.tar,.gz,.html,.css,.js,.ts,.json,.xml,.sql,.php,.py,.java,.c,.cpp,.h,.go,.rs" class="hidden">
  <textarea id="message-input" rows="1" placeholder="Écrire un message..." maxlength="20000"></textarea>
  <button type="submit">Envoyer</button>
</form>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="attachments.js"></script>
<script src="audio-player.js"></script>
<script>
(function () {
  const cfg = window.MAHOUTO_CONFIG;
  const supabase = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const CONV_ID = params.get("conv");
  const PEER_ID = params.get("with");
  const PEER_NAME = params.get("name") || "Utilisateur";

  const notLoggedInEl = document.getElementById("not-logged-in");
  const chatHeader = document.getElementById("chat-header");
  const messagesEl = document.getElementById("messages");
  const composer = document.getElementById("composer");
  const messageInput = document.getElementById("message-input");
  const statusMessage = document.getElementById("status-message");

  // -------- Lecture en chaîne des audios de la conversation (playlist) --------
  const playAllAudioBtn = document.getElementById("play-all-audio-btn");
  if (window.MahoutoAudioPlayer) {
    window.MahoutoAudioPlayer.setOnRegistryChange((count) => {
      playAllAudioBtn.classList.toggle("hidden", count < 2);
    });
    playAllAudioBtn.addEventListener("click", () => window.MahoutoAudioPlayer.playAll());
  }

  document.getElementById("peer-name").textContent = PEER_NAME;

  let currentUser = null;
  let hiddenMessageIds = new Set();
  let peerAvatarUrl = null;

  function setStatus(text) { statusMessage.textContent = text || ""; }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // Détecte si une URL de pièce jointe pointe vers un PDF.
  function isPdfUrl(url) {
    return /\.pdf(\?|$)/i.test(url || "");
  }

  // Construit l'URL Cloudinary de la miniature de la 1ère page d'un PDF.
  function pdfThumbnailUrl(url) {
    if (!url || !url.includes("/upload/")) return null;
    return url.replace("/upload/", "/upload/pg_1,f_jpg,w_500,c_limit,q_auto/");
  }

  // Transforme les URLs présentes dans un texte déjà échappé en liens
  // cliquables — jamais appliqué au texte brut, pour rester sûr contre
  // les injections.
  function linkify(escapedText) {
    return escapedText.replace(/(\bhttps?:\/\/[^\s<]+|\bwww\.[^\s<]+)/gi, function (match) {
      const href = /^https?:\/\//i.test(match) ? match : "https://" + match;
      return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;">' + match + '</a>';
    });
  }

  // Met en forme le corps d'un message : détecte les blocs ```code```
  // et les isole visuellement, sans jamais désactiver l'échappement.
  // N'opère QUE sur du texte déjà passé par escapeHtml(). linkify()
  // n'est appliqué qu'aux portions hors bloc de code.
  function formatMessageBody(escapedText) {
    const parts = escapedText.split(/```([\s\S]*?)```/g);
    let result = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        const codeContent = parts[i].replace(/^\n/, "").replace(/\n$/, "");
        result += '<pre class="code-block"><code>' + codeContent + "</code></pre>";
      } else {
        result += linkify(parts[i]);
      }
    }
    return result;
  }

  // Nettoie un nom de fichier pour l'utiliser dans une URL de
  // transformation Cloudinary : les points, parenthèses, virgules...
  // ont un sens technique pour Cloudinary et cassent l'URL, même
  // une fois encodés. On retire aussi l'extension : Cloudinary
  // l'ajoute automatiquement lui-même au moment du téléchargement.
  function sanitizeForCloudinaryAttachment(filename) {
    const withoutExt = filename.replace(/\.[^./\\]+$/, "");
    const safe = withoutExt.replace(/[^a-zA-Z0-9 _-]/g, "_").trim();
    return safe || "fichier";
  }

  // Construit une URL Cloudinary qui force le téléchargement avec le
  // vrai nom d'origine (fl_attachment), plutôt que l'identifiant
  // aléatoire généré par Cloudinary lors de l'envoi.
  function attachmentDownloadUrl(url, filename) {
    if (!url || !url.includes("/upload/") || !filename) return url;
    const safeName = sanitizeForCloudinaryAttachment(filename);
    return url.replace("/upload/", "/upload/fl_attachment:" + encodeURIComponent(safeName) + "/");
  }

  // Accusé de réception affiché uniquement sur mes propres messages,
  // jamais sur les messages reçus. Basé uniquement sur delivered_at/
  // read_at renvoyés par le serveur — jamais déduit côté client.
  function receiptTicksHtml(msg) {
    if (msg.read_at) return '<span class="ticks read">✓✓</span>';
    if (msg.delivered_at) return '<span class="ticks delivered">✓✓</span>';
    return '<span class="ticks sent">✓</span>';
  }

  // `resolvedMap` (optionnel) : Map(id -> {url, previewUrl, downloadUrl})
  // déjà résolue en lot par loadHistory(). Un DM est TOUJOURS
  // "authenticated" : sans cette map (message reçu en temps réel),
  // la pièce jointe est résolue individuellement après le premier
  // rendu, sans bloquer l'affichage du message.
  function renderMessage(msg, resolvedMap) {
    if (hiddenMessageIds.has(msg.id)) return;

    const bubble = document.createElement("div");
    bubble.dataset.id = msg.id;
    const isMine = msg.sender_id === currentUser.id;
    bubble.className = "bubble" +
      (isMine ? " mine" : "") +
      (msg.is_deleted ? " deleted" : "") +
      (msg.content && msg.content.length > 200 ? " long" : "");
    const time = new Date(msg.created_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = time;
    if (isMine && !msg.is_deleted) {
      const ticks = document.createElement("span");
      ticks.className = "ticks " + (msg.read_at ? "read" : msg.delivered_at ? "delivered" : "sent");
      ticks.textContent = msg.read_at || msg.delivered_at ? "✓✓" : "✓";
      meta.appendChild(ticks);
    }
    bubble.appendChild(meta);

    if (msg.is_deleted) {
      if (msg.attachment_type === "audio" && window.MahoutoAudioPlayer) {
        window.MahoutoAudioPlayer.unregisterTrack(msg.id);
      }
      bubble.appendChild(document.createTextNode("🚫 Message supprimé"));
    } else {
      if (msg.attachment_url) {
        const resolved = resolvedMap ? resolvedMap.get(String(msg.id)) : null;
        const mediaEl = MahoutoAttachments.renderAttachment(msg, resolved);
        mediaEl.classList.add("msg-attachment-wrap");
        bubble.appendChild(mediaEl);

        if (!resolved && MahoutoAttachments.needsSignedUrl(msg)) {
          MahoutoAttachments.resolveAttachmentUrls(supabase, "dm", CONV_ID, [msg]).then((map) => {
            const r = map.get(String(msg.id));
            if (r && mediaEl.isConnected) {
              const fresh = MahoutoAttachments.renderAttachment(msg, r);
              fresh.classList.add("msg-attachment-wrap");
              mediaEl.replaceWith(fresh);
            }
          });
        }
      }

      if (msg.content) {
        const textWrap = document.createElement("div");
        if (msg.attachment_url) textWrap.style.marginTop = "6px";
        textWrap.innerHTML = formatMessageBody(escapeHtml(msg.content));
        bubble.appendChild(textWrap);
      }

      if (msg.edited_at) {
        const editedTag = document.createElement("span");
        editedTag.className = "edited-tag";
        editedTag.textContent = "modifié";
        bubble.appendChild(editedTag);
      }
    }

    bubble.addEventListener("click", (e) => {
      const media = e.target.closest(".msg-media");
      if (media) { openMediaViewer(media); return; }
      openMessageActions(msg);
    });

    const existing = messagesEl.querySelector('[data-id="' + msg.id + '"]');
    if (existing) {
      existing.replaceWith(bubble);
    } else {
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  async function loadHiddenMessageIds() {
    const { data, error } = await supabase
      .from("dm_hidden_messages")
      .select("message_id")
      .eq("user_id", currentUser.id);
    if (error) { console.error("dm_hidden_messages indisponible :", error); return; }
    hiddenMessageIds = new Set((data || []).map((r) => r.message_id));
  }

  async function loadHistory() {
    const { data, error } = await supabase
      .from("dm_messages")
      .select("*")
      .eq("conversation_id", CONV_ID)
      .order("created_at", { ascending: true })
      .limit(300);

    if (error) { setStatus("Erreur de chargement des messages."); console.error(error); return; }
    const resolvedMap = await MahoutoAttachments.resolveAttachmentUrls(supabase, "dm", CONV_ID, data || []);
    (data || []).forEach((m) => renderMessage(m, resolvedMap));
  }

  function subscribeToNewMessages() {
    supabase
      .channel("dm:" + CONV_ID)
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "dm_messages", filter: "conversation_id=eq." + CONV_ID },
        (payload) => {
          renderMessage(payload.new);
          if (payload.new.sender_id !== currentUser.id) {
            markConversationDelivered();
            markConversationRead();
          }
        }
      )
      .on(
        "postgres_changes",
        { event: "UPDATE", schema: "public", table: "dm_messages", filter: "conversation_id=eq." + CONV_ID },
        (payload) => { renderMessage(payload.new); }
      )
      .subscribe();
  }

  async function loadPeerProfile() {
    const { data } = await supabase.rpc("get_public_profile", { uid: PEER_ID });
    const profile = data && data[0];
    if (profile) {
      peerAvatarUrl = profile.avatar_url;
      if (profile.username) document.getElementById("peer-name").textContent = profile.username;
    }
    const avatarEl = document.getElementById("peer-avatar");
    if (peerAvatarUrl) {
      avatarEl.innerHTML = `<img src="${peerAvatarUrl}" alt="">`;
      avatarEl.classList.add("has-photo");
    } else {
      const name = document.getElementById("peer-name").textContent;
      avatarEl.textContent = name ? name.trim()[0].toUpperCase() : "?";
      avatarEl.classList.remove("has-photo");
    }
  }

  const avatarViewer = document.getElementById("avatar-viewer");
  const avatarViewerImg = document.getElementById("avatar-viewer-img");
  document.getElementById("peer-avatar").addEventListener("click", () => {
    if (!peerAvatarUrl) return;
    avatarViewerImg.src = peerAvatarUrl;
    avatarViewer.classList.remove("hidden");
  });
  avatarViewer.addEventListener("click", () => {
    avatarViewer.classList.add("hidden");
    avatarViewerImg.src = "";
  });

  const mediaViewer = document.getElementById("media-viewer");
  const mediaViewerImg = document.getElementById("media-viewer-img");
  const mediaViewerVideo = document.getElementById("media-viewer-video");

  function openMediaViewer(el) {
    if (el.dataset.type === "video") {
      mediaViewerVideo.src = el.dataset.src;
      mediaViewerVideo.classList.remove("hidden");
      mediaViewerImg.classList.add("hidden");
      mediaViewerImg.src = "";
      mediaViewerVideo.play().catch(() => {});
    } else {
      mediaViewerImg.src = el.dataset.fullSrc || el.src;
      mediaViewerImg.classList.remove("hidden");
      mediaViewerVideo.classList.add("hidden");
      mediaViewerVideo.pause();
      mediaViewerVideo.removeAttribute("src");
      mediaViewerVideo.load();
    }
    mediaViewer.classList.remove("hidden");
  }

  function closeMediaViewer() {
    mediaViewer.classList.add("hidden");
    mediaViewerImg.classList.add("hidden");
    mediaViewerImg.src = "";
    mediaViewerVideo.pause();
    mediaViewerVideo.removeAttribute("src");
    mediaViewerVideo.load();
  }

  document.getElementById("media-viewer-close").addEventListener("click", closeMediaViewer);
  mediaViewer.addEventListener("click", (e) => {
    if (e.target === mediaViewer || e.target === mediaViewerImg) closeMediaViewer();
  });

  async function enterConversation() {
    notLoggedInEl.classList.add("hidden");
    chatHeader.classList.remove("hidden");
    messagesEl.classList.remove("hidden");
    composer.classList.remove("hidden");

    await loadPeerProfile();
    await loadHiddenMessageIds();
    await loadHistory();
    subscribeToNewMessages();
    subscribeToPresence();
    await markAsRead();
    await markConversationDelivered();
    await markConversationRead();
    messageInput.focus();
  }

  async function markAsRead() {
    if (!currentUser) return;
    await supabase
      .from("dm_read_state")
      .upsert(
        { user_id: currentUser.id, conversation_id: CONV_ID, last_read_at: new Date().toISOString() },
        { onConflict: "user_id,conversation_id" }
      );
  }

  // -------- Accusés de réception (✓ / ✓✓ gris / ✓✓ bleu) --------
  // Ces deux fonctions n'envoient jamais de timestamp : le serveur
  // (fonctions RPC SECURITY DEFINER) génère delivered_at/read_at avec
  // now() et vérifie lui-même que currentUser fait partie de la
  // conversation. Aucune donnée sensible n'est fournie par le client.
  async function markConversationDelivered() {
    if (!currentUser || !CONV_ID) return;
    const { error } = await supabase.rpc("mark_conversation_delivered", { p_conversation_id: CONV_ID });
    if (error) console.error("mark_conversation_delivered :", error.message);
  }

  async function markConversationRead() {
    if (!currentUser || !CONV_ID) return;
    if (document.visibilityState !== "visible") return;
    const { error } = await supabase.rpc("mark_conversation_read", { p_conversation_id: CONV_ID });
    if (error) console.error("mark_conversation_read :", error.message);
  }

  // -------- Statut en ligne (Presence Supabase, rien en base) --------
  function subscribeToPresence() {
    const presenceChannel = supabase.channel("presence:mahouto", {
      config: { presence: { key: currentUser.id } }
    });

    const statusEl = document.getElementById("peer-status");

    presenceChannel.on("presence", { event: "sync" }, () => {
      const state = presenceChannel.presenceState();
      const peerOnline = Object.prototype.hasOwnProperty.call(state, PEER_ID);
      statusEl.textContent = peerOnline ? "En ligne" : "Hors ligne";
      statusEl.classList.toggle("online", peerOnline);
    });

    presenceChannel.subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        await presenceChannel.track({ online_at: new Date().toISOString() });
      }
    });
  }

  composer.addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = messageInput.value.trim();
    if (!content || !currentUser) return;

    messageInput.value = "";
    autoGrow();
    const { data, error } = await supabase.from("dm_messages").insert({
      conversation_id: CONV_ID,
      sender_id: currentUser.id,
      content: content
    }).select("*").single();

    if (error) { console.error(error); setStatus("Message non envoyé."); }
    else if (data) { renderMessage(data); }
  });

  // -------- Zone de texte extensible (vers le haut, comme WhatsApp) --------
  function autoGrow() {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 220) + "px";
  }

  messageInput.addEventListener("input", autoGrow);

  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      composer.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });

  const attachBtn = document.getElementById("attach-btn");
  const fileInput = document.getElementById("file-input");
  const attachQueueEl = document.getElementById("attachment-queue");
  const attachQueueListEl = document.getElementById("attachment-queue-list");
  const attachQueueCountEl = document.getElementById("attachment-queue-count");
  const attachQueueSendBtn = document.getElementById("attachment-queue-send");
  const attachQueueCancelBtn = document.getElementById("attachment-queue-cancel");

  let pendingFiles = [];
  let queueSending = false;
  let localIdSeq = 0;

  attachBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const newFiles = Array.from(fileInput.files || []);
    fileInput.value = "";
    if (!newFiles.length) return;
    newFiles.forEach((file) => {
      pendingFiles.push({ localId: ++localIdSeq, file, status: "pending" });
    });
    renderQueue();
  });

  function renderQueue() {
    if (!pendingFiles.length) {
      attachQueueEl.classList.add("hidden");
      attachQueueListEl.innerHTML = "";
      return;
    }
    attachQueueEl.classList.remove("hidden");
    attachQueueListEl.innerHTML = "";
    pendingFiles.forEach((item) => {
      const row = document.createElement("div");
      row.className = "attachment-queue-item";
      row.dataset.localId = item.localId;

      const icon = document.createElement("div");
      icon.className = "attachment-queue-item-icon";
      icon.textContent = "📎";

      const info = document.createElement("div");
      info.className = "attachment-queue-item-info";
      const name = document.createElement("div");
      name.className = "attachment-queue-item-name";
      name.textContent = item.file.name;
      const status = document.createElement("div");
      status.className = "attachment-queue-item-status" + (item.status === "error" ? " error" : item.status === "sent" ? " sent" : "");
      status.textContent =
        item.status === "pending" ? "En attente" :
        item.status === "uploading" ? "Envoi..." :
        item.status === "sent" ? "Envoyé ✓" : "Erreur — sera retenté";
      info.appendChild(name);
      info.appendChild(status);

      row.appendChild(icon);
      row.appendChild(info);

      if (item.status === "pending" || item.status === "error") {
        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "attachment-queue-item-remove";
        removeBtn.textContent = "✕";
        removeBtn.addEventListener("click", () => {
          pendingFiles = pendingFiles.filter((f) => f.localId !== item.localId);
          renderQueue();
        });
        row.appendChild(removeBtn);
      }

      attachQueueListEl.appendChild(row);
    });
    attachQueueCountEl.textContent = "(" + pendingFiles.filter((f) => f.status !== "sent").length + ")";
  }

  attachQueueCancelBtn.addEventListener("click", () => {
    if (queueSending) return;
    pendingFiles = [];
    renderQueue();
  });

  async function uploadAndSendFile(file) {
    const { data: sessionData } = await supabase.auth.getSession();
    const accessToken = sessionData && sessionData.session ? sessionData.session.access_token : null;
    const signQuery = new URLSearchParams({ filename: file.name || "", context: "dm", contextId: CONV_ID });
    const signResp = await fetch("/api/attachment?" + signQuery.toString(), {
      headers: accessToken ? { "Authorization": "Bearer " + accessToken } : {}
    });
    const sign = await signResp.json();
    if (!signResp.ok) throw new Error(sign.error || "Signature indisponible");

    const formData = new FormData();
    formData.append("file", file);
    formData.append("api_key", sign.apiKey);
    formData.append("timestamp", sign.timestamp);
    formData.append("signature", sign.signature);
    formData.append("folder", sign.folder);
    if (sign.type) formData.append("type", sign.type);

    const uploadResp = await fetch(sign.uploadUrl, { method: "POST", body: formData });
    const uploadData = await uploadResp.json();
    if (!uploadResp.ok) throw new Error(uploadData.error?.message || "Envoi échoué");

    let attachmentType = "raw";
    if (uploadData.resource_type === "image") attachmentType = "image";
    else if (uploadData.resource_type === "video") attachmentType = MahoutoAttachments.isAudioFile(file) ? "audio" : "video";

    const { data, error } = await supabase.from("dm_messages").insert({
      conversation_id: CONV_ID,
      sender_id: currentUser.id,
      content: "",
      attachment_url: uploadData.secure_url,
      attachment_type: attachmentType,
      attachment_name: file.name || null,
      attachment_size: file.size || null,
      attachment_mime: file.type || null,
      attachment_public_id: uploadData.public_id || null,
      attachment_resource_type: uploadData.resource_type || null,
      attachment_access: sign.accessType === "authenticated" ? "authenticated" : "public"
    }).select("*").single();

    if (error) throw error;
    if (data) renderMessage(data);
  }

  attachQueueSendBtn.addEventListener("click", async () => {
    if (queueSending || !currentUser) return;
    const toSend = pendingFiles.filter((f) => f.status === "pending" || f.status === "error");
    if (!toSend.length) return;

    queueSending = true;
    attachQueueSendBtn.disabled = true;
    attachQueueCancelBtn.disabled = true;

    for (const item of toSend) {
      item.status = "uploading";
      renderQueue();
      try {
        await uploadAndSendFile(item.file);
        item.status = "sent";
      } catch (err) {
        console.error(err);
        item.status = "error";
      }
      renderQueue();
    }

    pendingFiles = pendingFiles.filter((f) => f.status !== "sent");
    queueSending = false;
    attachQueueCancelBtn.disabled = false;
    attachQueueSendBtn.disabled = false;
    renderQueue();
  });

  // -------- Message vocal --------
  const micBtn = document.getElementById("mic-btn");
  const recordingIndicator = document.getElementById("recording-indicator");
  const recordingTimeEl = document.getElementById("recording-time");
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordingTimer = null;
  let recordingSeconds = 0;

  micBtn.addEventListener("click", async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.addEventListener("dataavailable", (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      });

      mediaRecorder.addEventListener("stop", async () => {
        stream.getTracks().forEach((t) => t.stop());
        clearInterval(recordingTimer);
        recordingIndicator.classList.add("hidden");
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎤";

        if (recordedChunks.length) {
          const blob = new Blob(recordedChunks, { type: "audio/webm" });
          await sendAudioMessage(blob);
        }
      });

      mediaRecorder.start();
      recordingSeconds = 0;
      recordingTimeEl.textContent = "0:00";
      recordingIndicator.classList.remove("hidden");
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹️";

      recordingTimer = setInterval(() => {
        recordingSeconds++;
        const m = Math.floor(recordingSeconds / 60);
        const s = recordingSeconds % 60;
        recordingTimeEl.textContent = m + ":" + (s < 10 ? "0" : "") + s;
      }, 1000);
    } catch (err) {
      console.error(err);
      alert("Impossible d'accéder au microphone : " + err.message);
    }
  });

  async function sendAudioMessage(blob) {
    setStatus("Envoi du message vocal...");
    try {
      const { data: sessionData } = await supabase.auth.getSession();
      const accessToken = sessionData && sessionData.session ? sessionData.session.access_token : null;
      const signQuery = new URLSearchParams({ filename: "vocal.webm", context: "dm", contextId: CONV_ID });
      const signResp = await fetch("/api/attachment?" + signQuery.toString(), {
        headers: accessToken ? { "Authorization": "Bearer " + accessToken } : {}
      });
      const sign = await signResp.json();
      if (!signResp.ok) throw new Error(sign.error || "Signature indisponible");

      const formData = new FormData();
      formData.append("file", blob, "vocal.webm");
      formData.append("api_key", sign.apiKey);
      formData.append("timestamp", sign.timestamp);
      formData.append("signature", sign.signature);
      formData.append("folder", sign.folder);
      if (sign.type) formData.append("type", sign.type);

      const uploadResp = await fetch(sign.uploadUrl, { method: "POST", body: formData });
      const uploadData = await uploadResp.json();
      if (!uploadResp.ok) throw new Error(uploadData.error?.message || "Envoi échoué");

      const { data, error } = await supabase.from("dm_messages").insert({
        conversation_id: CONV_ID,
        sender_id: currentUser.id,
        content: "",
        attachment_url: uploadData.secure_url,
        attachment_type: "audio",
        attachment_name: "vocal.webm",
        attachment_size: blob.size || null,
        attachment_mime: blob.type || "audio/webm",
        attachment_public_id: uploadData.public_id || null,
        attachment_resource_type: uploadData.resource_type || null,
        attachment_access: sign.accessType === "authenticated" ? "authenticated" : "public"
      }).select("*").single();

      if (error) throw error;
      if (data) renderMessage(data);
      setStatus("");
    } catch (err) {
      console.error(err);
      setStatus("Envoi du message vocal impossible : " + err.message);
    }
  }

  // -------- Menu d'actions sur un message --------
  const actionSheet = document.getElementById("msg-action-sheet");
  let activeMessage = null;

  function openMessageActions(msg) {
    if (msg.is_deleted) return;
    activeMessage = msg;

    const isMine = msg.sender_id === currentUser.id;
    actionSheet.querySelector('[data-action="edit"]').style.display = isMine && !msg.attachment_url ? "flex" : "none";
    actionSheet.querySelector('[data-action="delete-all"]').style.display = isMine ? "flex" : "none";

    actionSheet.classList.remove("hidden");
  }

  function closeMessageActions() {
    actionSheet.classList.add("hidden");
    activeMessage = null;
  }

  actionSheet.addEventListener("click", (e) => {
    if (e.target === actionSheet) closeMessageActions();
  });

  actionSheet.querySelector('[data-action="copy"]').addEventListener("click", async () => {
    if (activeMessage && activeMessage.content) {
      try { await navigator.clipboard.writeText(activeMessage.content); } catch (err) { console.error(err); }
    }
    closeMessageActions();
  });

  actionSheet.querySelector('[data-action="share"]').addEventListener("click", async () => {
    const msg = activeMessage;
    closeMessageActions();
    if (!msg) return;

    if (msg.attachment_url) {
      try {
        let fetchUrl = msg.attachment_url;
        if (MahoutoAttachments.needsSignedUrl(msg)) {
          const map = await MahoutoAttachments.resolveAttachmentUrls(supabase, "dm", CONV_ID, [msg]);
          const r = map.get(String(msg.id));
          if (r && r.url) fetchUrl = r.url;
        }
        const resp = await fetch(fetchUrl);
        const blob = await resp.blob();
        const ext = msg.attachment_type === "image" ? "jpg"
          : msg.attachment_type === "video" ? "mp4"
          : msg.attachment_type === "audio" ? "webm"
          : "pdf";
        const filename = msg.attachment_name || ("mahouto-plus." + ext);
        const file = new File([blob], filename, { type: blob.type });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: "MAHOUTO+" });
          return;
        }
      } catch (err) {
        console.error("Partage du fichier impossible, repli sur le lien :", err);
      }
    }

    const text = msg.content || msg.attachment_url || "";
    if (navigator.share) {
      try { await navigator.share({ text: text, title: "MAHOUTO+" }); } catch (err) { /* annulé */ }
    } else if (text) {
      try { await navigator.clipboard.writeText(text); setStatus("Copié — le partage direct n'est pas supporté ici."); } catch (err) { console.error(err); }
    }
  });

  actionSheet.querySelector('[data-action="edit"]').addEventListener("click", () => {
    if (!activeMessage) return;
    const msg = activeMessage;
    closeMessageActions();

    const newContent = prompt("Modifier le message :", msg.content || "");
    if (newContent === null) return;
    const trimmed = newContent.trim();
    if (!trimmed) return;

    supabase
      .from("dm_messages")
      .update({ content: trimmed, edited_at: new Date().toISOString() })
      .eq("id", msg.id)
      .then(({ error }) => {
        if (error) { console.error(error); alert("Impossible de modifier ce message."); }
      });
  });

  actionSheet.querySelector('[data-action="delete-me"]').addEventListener("click", async () => {
    if (!activeMessage) return;
    const msg = activeMessage;
    closeMessageActions();

    const { error } = await supabase
      .from("dm_hidden_messages")
      .upsert({ user_id: currentUser.id, message_id: msg.id }, { onConflict: "user_id,message_id" });

    if (error) { console.error(error); alert("Impossible de masquer ce message."); return; }

    hiddenMessageIds.add(msg.id);
    const el = messagesEl.querySelector('[data-id="' + msg.id + '"]');
    if (el) el.remove();
  });

  actionSheet.querySelector('[data-action="delete-all"]').addEventListener("click", () => {
    if (!activeMessage) return;
    const msg = activeMessage;
    closeMessageActions();

    if (!confirm("Supprimer ce message pour tout le monde ?")) return;

    supabase
      .from("dm_messages")
      .update({ is_deleted: true, content: "", attachment_url: "" })
      .eq("id", msg.id)
      .then(({ error }) => {
        if (error) { console.error(error); alert("Impossible de supprimer ce message."); }
      });
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && currentUser && CONV_ID) {
      markConversationRead();
    }
  });

  (async function init() {
    if (!CONV_ID || !PEER_ID) {
      notLoggedInEl.classList.remove("hidden");
      notLoggedInEl.textContent = "Conversation introuvable.";
      return;
    }

    const { data } = await supabase.auth.getSession();
    if (!data || !data.session || !data.session.user) {
      notLoggedInEl.classList.remove("hidden");
      return;
    }
    currentUser = data.session.user;
    await enterConversation();
  })();

})();
</script>
<script src="pwa-install.js"></script>

</body>
